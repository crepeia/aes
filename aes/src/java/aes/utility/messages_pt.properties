alternativeDecreaseRegist08= Registre o quanto voc\u00ea bebe!
alternativeDecreaseSlow02= Procure sempre beber devagar.
alternativeDecreaseSlow03= Evite beber mais do que uma dose por hora.
alternativeDecreaseSlow04= Sempre consuma uma bebida n\u00e3o alco\u00f3lica antes e depois de uma dose, tendo espa\u00e7o entre as doses.
alternativeDecreaseSlow05= Como bebidas n\u00e3o alco\u00f3licas voc\u00ea pode usar \u00e1gua, sucos ou refrigerantes.
alternativeDecreaseSlow07= Nunca beba de est\u00f4mago vazio.
alternativeDecreaseSlow08= Busque sempre se alimentar durante o per\u00edodo em que est\u00e1 bebendo.
alternativeDecreaseSlow09= Ter comido faz com que o \u00e1lcool seja absorvido no seu organismo mais lentamente.
alternativeDecreaseSlow11= Controlando o Ritmo.
alternativePlanFissureText02= Alguns acontecimentos ao seu redor podem fazer com que voc\u00ea sinta muita vontade de beber.
alternativePlanFissureText04= Lembrar das raz\u00f5es que levaram voc\u00ea a mudar a forma como bebe (mantenha isso por escrito ou gravado em seu celular/computador).
alternativePlanFissureText05= Compartilhe isso com algu\u00e9m que voc\u00ea confie - fale sobre como est\u00e1 sendo este processo.
alternativePlanFissureText06= Procure se envolver em uma atividade saud\u00e1vel ou algo que distraia voc\u00ea (como exerc\u00edcios f\u00edsicos ou um hobby que n\u00e3o envolva \u00e1lcool).
alternativePlanFissureText09= A vontade de beber, mesmo a mais intensa, passar\u00e1 - geralmente dentro de alguns minutos - lembrar-se disso ir\u00e1 ajudar.
alternativePlanFissureText11= Essa p\u00e1gina foi \u00fatil para voc\u00ea?
alternativePlanFissureText12= Controlando a Fissura.
alternativePlanPlanSayNoText02= Voc\u00ea j\u00e1 reparou que existe uma maior chance de algu\u00e9m lhe oferecer alguma bebida quando voc\u00ea n\u00e3o est\u00e1 bebendo?
alternativePlanPlanSayNoText04= O segredo est\u00e1 em dizer n\u00e3o de forma r\u00e1pida e direta! Isso evita que voc\u00ea pense em desculpas para permitir voc\u00ea mesmo a beber.
alternativePlanPlanSayNoText07= Buscando Alternativas!
alternativePlanTriggers04= Dica importante!
alternativePlanTriggers05= Busque evitar estas situa\u00e7\u00f5es acima - Pense sempre em op\u00e7\u00f5es que n\u00e3o envolvam beber \u00e1lcool.
alternativePlanTriggers08= Evitando Situa\u00e7\u00f5es de Risco - Gatilhos.
alternativeReduceAlter02= Voc\u00ea j\u00e1 parou para pensar que beber pode ocupar uma grande parte do seu tempo livre ou de lazer?
alternativeReduceAlter03= Procure novas atividades mais saud\u00e1veis, como exerc\u00edcios f\u00edsicos (ex.: caminhadas, andar de bicicletas, passear ao ar livre, etc.).
alternativeReduceAlter04= Com o tempo voc\u00ea ser\u00e1 mais saud\u00e1vel e mais confiante, caso evite beber para:
alternativeReduceAlter05= Se sentir confort\u00e1vel em conversas, festas, churrascos, etc.
alternativeReduceAlter06= Melhorar o seu humor.
alternativeReduceAlter07= Lidar com problemas.
alternativeReduceAlter09= Fazendo algo diferente!
