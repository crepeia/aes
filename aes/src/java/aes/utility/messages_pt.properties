estrategiaDimAltPlanFisTitle1= Plano para controle da Fissura | \u00c1lcool & Sa\u00fade
estrategiaDimAltPlanFisH31= Controlando a fissura
alternativePlanFissureText01= Plano para resistir \u00e0 vontade de beber (fissura)
estrategiaDimAltPlanFisLi1= Alguns acontecimentos ao seu redor podem fazer com que voc\u00ea sinta muita vontade de beber
alternativePlanFissureText03= Quando isso acontecer voc\u00ea deve considerar estas tr\u00eas op\u00e7\u00f5es:
estrategiaDimAltPlanFisL12= Lembrar das raz\u00f5es que levaram voc\u00ea a mudar a forma como bebe (mantenha isso por escrito ou gravado em.seu celular/computador)
estrategiaDimAltPlanFisLi3= Compartilhe isso com algu\u00e9m que voc\u00ea confie - fala sobre como est\u00e1 sendo este processo
estrategiaDimAltPlanFisL14= Procure se envolver em uma atividade saud\u00e1vel ou  algo que distraia voc\u00ea (como exerc\u00edcios f\u00edsicos ou um hobby que n\u00e3o envolva \u00e1lcool).
alternativePlanFissureText07= Aceite a sua fissura
alternativePlanFissureText08= Ao inv\u00e9s de lutar contra o que est\u00e1 sentindo, aceite e espere sua vontade passar.
estrategiaDimAltPlanFisP4= A vontade de beber, mesmo a mais intensa, passar\u00e1 - geralmente dentro de alguns minutos - Lembrar-se disso ir\u00e1 ajudar
alternativePlanFissureText10= Pense nessa vontade como uma onda que chega forte a uma praia, mas que perde a sua for\u00e7a depois de um tempo.
