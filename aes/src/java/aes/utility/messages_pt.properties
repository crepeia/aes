termsTitleH1= Termo de responsabilidade, pol\u00edtica de privacidade e termos e condi\u00e7\u00f5es de uso do site.
termsPVersion= Vers\u00e3o: 1.0
termsDescriptionP1= Bem vindo ao site "\u00c1lcool & Sa\u00fade". Para que o uso do site seja satisfat\u00f3rio e n\u00e3o ofensivo para voc\u00ea, \u00e9 importante ler, entender e concordar com os seguintes termos e condi\u00e7\u00f5es.
termsDescriptionP2= Este site foi desenvolvido com intuito de ser um servi\u00e7o p\u00fablico, ofertando informa\u00e7\u00f5es e um programa de preven\u00e7\u00e3o ao consumo abusivo de \u00e1lcool.
termsDescriptionP3= O programa \u00e9 complementar aos programas de preven\u00e7\u00e3o do consumo abusivo de \u00e1lcool e sua utiliza\u00e7\u00e3o n\u00e3o substitui a consulta com profissionais de sa\u00fade.
termosUso07= O programa \u00e9 de car\u00e1ter experimental e ser\u00e1 testado quanto sua efic\u00e1cia cl\u00ednica.
termsAccessH3= Acesso ao site
termsAccessP= Algumas das p\u00e1ginas do site s\u00e3o de livre acesso a todos os visitantes, no entanto, o acesso ao programa de tratamento requer a realiza\u00e7\u00e3o de um cadastro gratuito. Caso exista interesse por parte do usu\u00e1rio, \u00e9 necess\u00e1rio escolher um nome de usu\u00e1rio e uma senha. O nome de usu\u00e1rio e senha devem ser mantidos em sigilo e n\u00e3o devem ser compartilhados com qualquer outro usu\u00e1rio. Os visitantes s\u00e3o solicitados a n\u00e3o divulgarem o nome de usu\u00e1rio e senha para terceiros.
termosUso10= Proibi\u00e7\u00f5es
termsRestrainsLi1= Usar outro nome de pessoa, nome de usu\u00e1rio ou senha quando acessar este site, sem o pr\u00e9vio consentimento;
termsRestrainsLi2= Escrever ou transmitir qualquer material que pode, de alguma forma, difamar, ofender ou causar desconforto a qualquer pessoa; ser obsceno ou que de qualquer maneira, interfira na utiliza\u00e7\u00e3o de outros usu\u00e1rios a este site;
termsRestrainsLi3= Prover qualquer informa\u00e7\u00e3o para o site que seja confidencial ou propriedade de terceiros;
termsRestrainsLi4= Usar este site de qualquer maneira que possa infringir leis, regras ou regulamenta\u00e7\u00f5es ou direito de terceiros; ou
termsRestrainsLi5= Transmitir v\u00edrus ou qualquer conte\u00fado que interfira na funcionalidade do site.
termosUso16= Garantias
termsGarantiesP1= Todos os esfor\u00e7os foram realizados para garantir que as informa\u00e7\u00f5es e materiais contidos neste site s\u00e3o completamente verdadeiros e n\u00e3o danosos. Os materiais e informa\u00e7\u00f5es disponibilizadas foram avaliados por especialistas na \u00e1rea de tratamento do tabagismo e por ex-fumantes.
termsGarantiesP2= O site n\u00e3o garante que os servi\u00e7os ser\u00e3o disponibilizados de forma ininterrupta ou constante.
termsGarantiesP3= Embora os servi\u00e7os propostos pelo site tenham como objetivo prover ajuda a fumantes, os mesmos s\u00e3o livres e encorajados a consultar profissionais de sa\u00fade. Todos os usu\u00e1rios devem utilizar este assumindo seus pr\u00f3prios riscos.
termosUso20= Servi\u00e7os e Materiais de Terceiros
termsThirdpartyP= As informa\u00e7\u00f5es contidas neste site podem incluir servi\u00e7os e informa\u00e7\u00f5es de terceiros. O conte\u00fado e servi\u00e7os de terceiros ser\u00e3o disponibilizados com aprova\u00e7\u00e3o pr\u00e9via.
termosUso22= Links
termsLinksP= Este site cont\u00e9m links para outros sites que n\u00e3o se encontram sob o controle ou \u00e9 mantido por n\u00f3s. Os links de terceiros s\u00e3o disponibilizados para conveni\u00eancia e informa\u00e7\u00e3o. Caso o usu\u00e1rio acesse estas informa\u00e7\u00f5es, os riscos de utiliza\u00e7\u00e3o s\u00e3o de inteira responsabilidade do usu\u00e1rio. O fato de um site de terceiros estar ligado a este, n\u00e3o implica necessariamente em rela\u00e7\u00e3o de patroc\u00ednio ou que o site de terceiro seja afiliado deste.
termosUso24= Mudan\u00e7as de Informa\u00e7\u00f5es, Produtos e Servi\u00e7os
termsChangesP= Informa\u00e7\u00f5es, produtos e servi\u00e7os publicados neste site s\u00e3o sujeitos a altera\u00e7\u00f5es sem pr\u00e9vias not\u00edcias.
termsInfoH3= Informa\u00e7\u00e3o disponibilizada pelo site
termsInfoP= Pessoas inscritas no programa \u00c1lcool & Sa\u00fade disponibilizam informa\u00e7\u00f5es relacionadas ao conte\u00fado dos mesmos de forma involunt\u00e1ria. Uma vez disponibilizada, a informa\u00e7\u00e3o \u00e9 de propriedade do usu\u00e1rio, podendo ser reproduzida, publicada, transmitida, disponibilizada, sujeita as obriga\u00e7\u00f5es da Pol\u00edtica de Privacidade.
termosUso28= Licen\u00e7a
termsLicensePa= Todo conte\u00fado do site, incluindo os programas, design, textos e gr\u00e1ficos s\u00e3o licenciados pela Licen\u00e7a P\u00fablica Geral - GNU, garantindo a liberdade de usar o conte\u00fado do programa para qualquer prop\u00f3sito, modificar o programa, de compartilhar com seus vizinhos e amigos e compartilhar as mudan\u00e7as que voc\u00ea fizer.
termosUso30= Ver a licen\u00e7a GPL GNU completa.
termosUso31= Marcas Registradas
termsTrademarkP= Este site cont\u00e9m marcas e logomarcas de terceiros registradas, protegidas por lei. N\u00e3o \u00e9 permitido o uso delas sem consentimento pr\u00e9vio.
termosUso33= T\u00e9rmino
termsEndP= Caso o usu\u00e1rio desrespeite os termos e condi\u00e7\u00f5es do site, seu acesso pode ser limitado ou proibido.
polTitlepage= Pol\u00edtica do site | \u00c1lcool & Sa\u00fade
Vers\u00e3o\:\ 1.0=pol.version
polPrivacyH1= Pol\u00edtica de Privacidade
polPrivacyP= N\u00f3s nos preocupamos com a prote\u00e7\u00e3o da privacidade dos usu\u00e1rios e adotamos a pol\u00edtica de proteger informa\u00e7\u00f5es sobre indiv\u00edduos. Esta pol\u00edtica descreve as informa\u00e7\u00f5es coletadas pelo site, como a informa\u00e7\u00e3o \u00e9 utilizada, como a informa\u00e7\u00e3o \u00e9 revelada, a seguran\u00e7a da informa\u00e7\u00e3o, e como as informa\u00e7\u00f5es podem ser acessadas e corrigidas a respeito da privacidade do usu\u00e1rio.
polPdataH3= 1. Coleta das Informa\u00e7\u00f5es Pessoais
polPdataP1= Voc\u00ea pode fornecer informa\u00e7\u00f5es pessoais durante a utiliza\u00e7\u00e3o dos servi\u00e7os oferecidos por este site. Esta informa\u00e7\u00e3o pessoal pode incluir detalhes como seu nome, idade, sexo e formas de contato. Produtos e servi\u00e7os podem exigir outros tipos de informa\u00e7\u00e3o.
polPdataP2= A escolha das informa\u00e7\u00f5es fornecidas compete exclusivamente ao usu\u00e1rio do site. Utilizamos as informa\u00e7\u00f5es para gerar informa\u00e7\u00f5es e melhorar a qualidade dos servi\u00e7os prestados.
polPdataP3= Este site tamb\u00e9m pode coletar e arquivar informa\u00e7\u00f5es a respeito da visita do website, incluindo:
polPdataLi1= Nome e dom\u00ednio onde voc\u00ea acessou a internet;
polPdataLi2= Data e a hora do seu acesso;
polPdataLi3= O endere\u00e7o de internet do site onde voc\u00ea foi direcionado ao site;
polPdataLi4= As p\u00e1ginas que voc\u00ea acessou enquanto utilizava o site.
polPdataP4= Estas informa\u00e7\u00f5es n\u00e3o identificam usu\u00e1rios e s\u00e3o utilizadas para medir o n\u00famero de visitantes do site e como ele \u00e9 navegado. Esta informa\u00e7\u00e3o \u00e9 utilizada para fazer o site mais \u00fatil para voc\u00ea.
polPdataP5= Este site tamb\u00e9m coleta informa\u00e7\u00f5es de pessoas registradas ou visitantes com o prop\u00f3sito de melhorar a qualidade e efetividade. O administrador agradece todo tipo de retorno sobre qualquer aspecto.
polDatauseH3= 2. Como sua informa\u00e7\u00e3o pessoal \u00e9 utilizada?
polDatauseP1= As informa\u00e7\u00f5es pessoais obtidas atrav\u00e9s do site s\u00e3o utilizadas para:
polDatauseLi1= Fornecer servi\u00e7os a voc\u00ea;
polDatauseLi2= Fornecer informa\u00e7\u00f5es e outros tipos de comunicado;
polDatauseLi3= Envolver voc\u00ea em iniciativas do site;
polDatauseLi4= Analisar padr\u00f5es e tend\u00eancias da utiliza\u00e7\u00e3o do site.
polDatauseP2= Algumas formas de uso das informa\u00e7\u00f5es descritas acima podem ser fornecidas por terceiros, autorizados a utilizar estas informa\u00e7\u00f5es para estas propostas.
polDatauseP3= As informa\u00e7\u00f5es coletadas para este site tamb\u00e9m pode ser utilizada para determinar padr\u00f5es demogr\u00e1ficos de uso. Informa\u00e7\u00f5es pessoais n\u00e3o s\u00e3o utilizadas para este prop\u00f3sito. Esta informa\u00e7\u00e3o an\u00f4nima \u00e9, ent\u00e3o, utilizada para melhorar o site e nossos servi\u00e7os. Estas informa\u00e7\u00f5es n\u00e3o ser\u00e3o transmitidas para terceiros.
polDatauseP4= Al\u00e9m dos prop\u00f3sitos descritos acima, o site n\u00e3o utilizar\u00e1 suas informa\u00e7\u00f5es sem consentimento pr\u00e9vio. A \u00fanica exce\u00e7\u00e3o a esta regra ser\u00e1 quando evidenciado o prop\u00f3sito de prevenir algum dano \u00e0 sa\u00fade ou pela Justi\u00e7a.
polDatasecH3= 3. Seguran\u00e7a de seus dados
polDatasecP1= O site implementa procedimentos para garantir a seguran\u00e7a das informa\u00e7\u00f5es coletadas, evitando que as informa\u00e7\u00f5es sejam perdidas, destru\u00eddas, utilizadas ou acessadas de forma n\u00e3o autorizada. As informa\u00e7\u00f5es fornecidas por voc\u00ea ser\u00e3o acessadas somente por pessoal autorizado.
polDatasecP2= Entretanto, nenhuma transmiss\u00e3o de dados na internet ou informa\u00e7\u00e3o contida em nossos servidores acessada via internet s\u00e3o totalmente seguras. Estas atividades s\u00e3o de sua inteira responsabilidade.
polSecrecyH3= 4. Quebra de sigilo das informa\u00e7\u00f5es
polSecrecyP= As informa\u00e7\u00f5es coletadas atrav\u00e9s do site n\u00e3o ser\u00e3o reveladas ou repassadas a terceiros a menos que esteja de acordo com esta pol\u00edtica de privacidade. Informa\u00e7\u00f5es podem ser fornecidas a terceiros somente com autoriza\u00e7\u00e3o e um prop\u00f3sito particular.
polLinks3rdH3= 5. Links para sites de terceiros
polLinks3rdP= Este site cont\u00e9m links para outros sites. N\u00f3s n\u00e3o nos responsabilizamos pelas pr\u00e1ticas de privacidade e conte\u00fado de sites de terceiros. \u00c9 de sua responsabilidade pesquisar a pol\u00edtica de privacidade destes sites.
polChangesH3= 6. Mudan\u00e7as no Termo de Privacidade
