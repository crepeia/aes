tip= Dica
tip10= Sempre que come\u00e7ar a sentir vontade de beber comece a fazer algo divertido que n\u00e3o envolva \u00e1lcool. Com o tempo voc\u00ea ir\u00e1 beber menos.
tip13= Se voc\u00ea sentir um forte desejo de beber, converse com algu\u00e9m que possa ajudar. Voc\u00ea se beneficiar\u00e1 ao compartilhar os seus sentimentos e pensamentos.
tip15= Comunique a seus amig@s a sua decis\u00e3o de reduzir a frequ\u00eancia e quantidade de consumo de \u00e1lcool \u2013 el@s podem ajudar a manter sua decis\u00e3o n\u00e3o oferecendo bebidas a voc\u00ea.
tip19= Fique alerta! Caso estiver precisando de quantidades maiores do que anteriormente para sentir os mesmos efeitos do \u00e1lcool, isso aponta para um problema importante, mas que pode ser resolvido caso voc\u00ea tente parar de beber, ao menos por um tempo.
tip28= Querendo beber menos? Procure seguir as estrat\u00e9gias de redu\u00e7\u00e3o que melhor se adequem a voc\u00ea.
tip29= Quando o seu copo est\u00e1 vazio, pense nas consequ\u00eancias de beber um pouco mais. Ir al\u00e9m das doses que voc\u00ea planejou pode fazer com que venha a ter problemas em controlar o seu consumo
tip33= Aprenda que \u00e9 um direito seu recusar uma bebida, quando algu\u00e9m lhe oferece. Diga sempre n\u00e3o,  muito obrigado! Esta f\u00f3rmula \u00e9 simples e pode ajudar em diversas situa\u00e7\u00f5es.
tip34= Se voc\u00ea quiser parar de beber, mas t\u00eam encontrado dificuldades fazendo isso, procure um profissional de sa\u00fade que pode ajudar. Pedir ajuda pode ser um passo dif\u00edcil, mas que trar\u00e1 recompensas importantes no futuro.
tip36= Ainda que esteja bebendo menos, nunca dirija ap\u00f3s beber. Pensar em sua sa\u00fade, tamb\u00e9m envolve pensar em evitar acidentes
tip37= Sempre pense nas consequ\u00eancias e em sua sa\u00fade antes de come\u00e7ar a beber. Crie este h\u00e1bito de pensar sobre as consequ\u00eancias antes de come\u00e7ar a beber.
tip42= Evite a participa\u00e7\u00e3o em jogos de beber ou concursos. Muitas vezes esses jogos envolvem grandes quantidades de bebida, consumidas de maneira muito r\u00e1pida, potencializando problemas decorrentes do consumo.
tip45= Um exerc\u00edcio que pode lhe ajudar \u00e9 evitar dar o primeiro gole.  Espere em torno de 1 ou 2 horas para come\u00e7ar a beber, este tempo pode lhe ajudar a controlar a vontade de beber e a pensar nas consequ\u00eancias negativas do consumo.
tip49= Evite participar de rodadas. Essas ocasi\u00f5es podem contribuir para que voc\u00ea consuma \u00e1lcool para al\u00e9m do que havia planejado.
tip54= Tome bastante \u00e1gua antes de ingerir alguma bebida alco\u00f3lica. Considere este conselho especialmente se voc\u00ea est\u00e1 com sede.
tip55= Identifique as coisas, imagens e pensamentos que contribuem para o seu bem-estar. Muitas pessoas exageram com o \u00e1lcool por estarem tristes ou com raiva.
tip62= Envolva um amigo ou membro da fam\u00edlia em que voc\u00ea confia para ajud\u00e1-lo a permanecer motivado. Compartilhe com eles as metas que conseguiu alcan\u00e7ar e tamb\u00e9m os momentos de dificuldade
tip9= O seu copo est\u00e1 pela metade? Fa\u00e7a uma pausa e pare de beber por 15 minutos. Voc\u00ea perceber\u00e1 que vai beber menos utilizando esta estrat\u00e9gia
