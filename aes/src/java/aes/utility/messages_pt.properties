passwordrecovery_subj = Programa \u00c1lcool & Sa\u00fade - Redefinir senha
passwordrecovery=Ol\u00e1,<br> Recebemos uma solicita\u00e7\u00e3o para informa\u00e7\u00e3o dos dados de autentica\u00e7\u00e3o do seguinte email: #email#, caso n\u00e3o tenha feio esta solicita\u00e7\u00e3o, favor desconsiderar o mesmo.<br> Caso tenha sido voc\u00ea, copie o seguinte c\u00f3digo: #code#.<br> Digite-o <a href="http://www.alcoolesaude.com.br/esqueceu-sua-senha.xhtml">aqui</a> para prosseguir com a sua altera\u00e7\u00e3o de senha.<br><br> Cordialmente<br> Equipe \u00c1lcool & Sa\u00fade
redefined.password=Senha redefinida com sucesso!

privacidadeTitlepage= Pol\u00edtica de Privacidade | \u00c1lcool e Sa\u00fade
privacidadeH1= Pol\u00edtica de Privacidade
privacidadeIntro= Esta Pol\u00edtica de Privacidade descreve como o aplicativo <strong>\u00c1lcool e Sa\u00fade</strong> coleta, utiliza e protege os dados de participantes volunt\u00e1rios, no contexto do projeto de pesquisa <em>"Predi\u00e7\u00e3o de Consumo de \u00c1lcool no Aplicativo \u00c1lcool &amp; Sa\u00fade via Aprendizado de M\u00e1quina e Dados Multimodais"</em>, aprovado pelo Comit\u00ea de \u00c9tica em Pesquisa da Universidade Federal de Juiz de Fora (CEP/UFJF).
privacidadeParecerNumero= N\u00famero do Parecer: 8.508.969
privacidadeCaae= CAAE: 95623726.9.0000.5147
privacidadeSituacao= Situa\u00e7\u00e3o: Aprovado
privacidadeDadosH2= Quais dados coletamos
privacidadeDadosLocalizacao= <strong>Localiza\u00e7\u00e3o (GPS)</strong> \u2014 inclusive quando o aplicativo est\u00e1 em segundo plano, enquanto o participante estiver com a coleta avan\u00e7ada ativada.
privacidadeDadosAcelerometro= <strong>Aceler\u00f4metro</strong> \u2014 usado para extrair caracter\u00edsticas do padr\u00e3o de marcha (caminhada), como intensidade de movimento e cad\u00eancia.
privacidadeDadosEma= <strong>Respostas ao question\u00e1rio di\u00e1rio (EMA)</strong> \u2014 check-ins de autorrelato realizados pelo participante ao longo do dia.
privacidadeDadosNota= N\u00e3o coletamos fotos, contatos, mensagens ou arquivos do aparelho.
privacidadeFinalidadeH2= Para que usamos esses dados
privacidadeFinalidadeTexto= Os dados s\u00e3o utilizados exclusivamente para fins de pesquisa cient\u00edfica: construir uma base de dados multimodal e treinar modelos de aprendizado de m\u00e1quina capazes de identificar padr\u00f5es associados a epis\u00f3dios de consumo de \u00e1lcool, com o objetivo de, no futuro, oferecer suporte preventivo mais personalizado aos usu\u00e1rios do aplicativo.
privacidadeConsentimentoH2= Consentimento
privacidadeConsentimentoTexto= A coleta avan\u00e7ada de dados (localiza\u00e7\u00e3o e aceler\u00f4metro) s\u00f3 \u00e9 ativada ap\u00f3s o participante ler e aceitar o Termo de Consentimento Livre e Esclarecido (TCLE) diretamente no aplicativo. O participante pode revogar esse consentimento a qualquer momento, sem nenhum preju\u00edzo ao uso normal do aplicativo.
privacidadeArmazenamentoH2= Como os dados s\u00e3o armazenados e protegidos
privacidadeArmazenamentoItem1= Os dados s\u00e3o transmitidos com criptografia (HTTPS).
privacidadeArmazenamentoItem2= S\u00e3o armazenados em servidores da Universidade Federal de Juiz de Fora (UFJF).
privacidadeArmazenamentoItem3= O acesso \u00e9 restrito exclusivamente \u00e0 equipe de pesquisa.
privacidadeArmazenamentoItem4= N\u00e3o compartilhamos dados com terceiros.
privacidadeArmazenamentoItem5= Para qualquer an\u00e1lise ou divulga\u00e7\u00e3o de resultados, as coordenadas de localiza\u00e7\u00e3o s\u00e3o convertidas em m\u00e9tricas de comportamento abstratas (ex.: padr\u00f5es de deslocamento), sem expor rotas ou endere\u00e7os precisos.
privacidadeRetencaoH2= Por quanto tempo guardamos os dados
privacidadeRetencaoTexto= Os dados da pesquisa ficam arquivados sob a responsabilidade do pesquisador principal pelo per\u00edodo de 5 (cinco) anos, conforme a Resolu\u00e7\u00e3o CNS 466/2012.
privacidadeDireitosH2= Seus direitos
privacidadeDireitosItem1= Recusar ou retirar seu consentimento a qualquer momento, sem penalidade.
privacidadeDireitosItem2= Solicitar esclarecimentos sobre os dados coletados.
privacidadeDireitosItem3= Solicitar a exclus\u00e3o dos seus dados, entrando em contato pelo e-mail abaixo.
privacidadeContatoH2= Contato
privacidadeContatoTexto= Em caso de d\u00favidas sobre esta Pol\u00edtica de Privacidade ou sobre a pesquisa, entre em contato:
privacidadeContatoEmailLabel= E-mail:
privacidadeAtualizacao= \u00daltima atualiza\u00e7\u00e3o: julho de 2026.