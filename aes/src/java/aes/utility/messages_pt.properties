teenDrink03= Voc\u00ea relatou fazer consumo de \u00e1lcool, o que pode trazer consequ\u00eancias negativas para sua sa\u00fade no fututo. Por quest\u00f5es biol\u00f3gicas e legais, menores de 18 anos n\u00e3o devem utilizar \u00e1lcool.
teenDrink06= Por que eu n\u00e3o devo beber?
teenDrink07= Saiba que existem diversos meios para ajud\u00e1-la a parar de beber. Caso algu\u00e9m lhe ofere\u00e7a bebida, sempre diga 'n\u00e3o obrigada', de forma educada e direta. Procure manter-se longe de pessoas ou lugares que fazem com que voc\u00ea beba. Caso voc\u00ea n\u00e3o consiga parar de beber, procure um profissional de sa\u00fade e pe\u00e7a ajuda. Caso n\u00e3o tenha acesso \u00e0 um profissional de sa\u00fade utilize o Viva Voz (Disque 132 - liga\u00e7\u00e3o gratuita)
teenDrink08= Caso eu j\u00e1 beba, o que devo fazer?
teenNotDrink02= Parab\u00e9ns por n\u00e3o consumir \u00e1lcool!
teenNotDrink03= A adolec\u00eancia \u00e9 um per\u00edodo \u00fanico para o desenvolvimento do c\u00e9rebro. Estudos apontam que mesmo os adolecentes que consomem \u00e1lcool a pouco tempo, podem ter uma diminui\u00e7\u00e3o do volume do c\u00e9rebro. Ao longo do tempo, adolescentes que consomem \u00e1lcool podem temb\u00e9m ter maiores dificuldades para resolver problemas de exigem o uso de racioc\u00ednio. Ao evirar consumir \u00e1lcool voc\u00ea n\u00e3o s\u00f3 preserva o seu c\u00e9rebro por mais tempo, como tamb\u00e9m evita outros poss\u00edveis danos que podem estar associados com problemas de sa\u00fade, acidentes, brigas e discuss\u00f5es
telaDescSugestao= Aqui voc\u00ea pode sugerir alguma mudan\u00e7a no nosso app!
temporaryCode= Usando c\u00f3digo tempor\u00e1rio.
termoConsentimento00= Termo de Consentimento
termoConsentimento02= O Sr.(a) est\u00e1 sendo convidado (a) como volunt\u00e1rio (a) a participar de parte da pesquisa \u201cInformalcool - Avalia\u00e7\u00e3o da efetividade de interven\u00e7\u00f5es breves para a redu\u00e7\u00e3o do consumo de \u00e1lcool assistidas por computador\u201d.
termoConsentimento06= Os procedimentos ser\u00e3o realizados da seguinte maneira: avaliaremos as respostas fornecidas por cada usu\u00e1rio durante a navega\u00e7\u00e3o no site, as pontua\u00e7\u00f5es do AUDIT e dos question\u00e1rios utilizados, al\u00e9m da perman\u00eancia no site.
termoConsentimento0701= voc\u00ea n\u00e3o ter\u00e1 nenhum custo.
termoConsentimento12= em nenhuma publica\u00e7\u00e3o que possa resultar deste estudo. Este estudo apresenta risco m\u00ednimo, isto \u00e9, o mesmo risco existente em atividades rotineiras como conversar, tomar banho, ler, etc. Apesar disso, voc\u00ea tem assegurado o direito a ressarcimento ou indeniza\u00e7\u00e3o no caso de quaisquer danos eventualmente produzidos pela pesquisa.
termoConsentimento13= Os dados e instrumentos utilizados na pesquisa ficar\u00e3o arquivados com o pesquisador respons\u00e1vel e podem ser destru\u00eddos se solicitado pelo usu\u00e1rio.
termosUso00= Termos de Uso
termosUso01= Termo de responsabilidade, pol\u00edtica de privacidade e termos e condi\u00e7\u00f5es de uso do \u00c1lcool & Sa\u00fade.
termosUso02= Bem vindo ao "\u00c1lcool & Sa\u00fade". Para que o uso do \u00c1lcool & Sa\u00fade seja satisfat\u00f3rio e n\u00e3o ofensivo para voc\u00ea, \u00e9 importante ler, entender e concordar com os seguintes termos e condi\u00e7\u00f5es.
termosUso03= O \u00c1lcool & Sa\u00fade foi desenvolvido com intuito de ser um servi\u00e7o p\u00fablico, ofertando informa\u00e7\u00f5es e um programa para ajudar que pessoas fazem consumo de risco de \u00e1lcool.
termosUso08= Acesso ao \u00c1lcool & Sa\u00fade
termosUso09= Algumas das p\u00e1ginas do \u00c1lcool & Sa\u00fade s\u00e3o de livre acesso a todos os visitantes, no entanto, o acesso ao programa requer a realiza\u00e7\u00e3o de um cadastro gratuito. Caso exista interesse por parte do usu\u00e1rio, \u00e9 necess\u00e1rio escolher um nome de usu\u00e1rio e uma senha. O nome de usu\u00e1rio e senha devem ser mantidos em sigilo e n\u00e3o devem ser compartilhados com qualquer outro usu\u00e1rio. Os visitantes s\u00e3o solicitados a n\u00e3o divulgarem o nome de usu\u00e1rio e senha para terceiros.
termosUso11= - Usar outro nome de pessoa, nome de usu\u00e1rio ou senha quando acessar o \u00c1lcool & Sa\u00fade, sem o pr\u00e9vio consentimento;
termosUso12= - Escrever ou transmitir qualquer material que pode, de alguma forma, difamar, ofender ou causar desconforto a qualquer pessoa; ser obsceno ou que de qualquer maneira, interfira na utiliza\u00e7\u00e3o de outros usu\u00e1rios do \u00c1lcool & Sa\u00fade;
termosUso13= - Prover qualquer informa\u00e7\u00e3o para o \u00c1lcool & Sa\u00fade que seja confidencial ou propriedade de terceiros;
termosUso14= - Usar o \u00c1lcool & Sa\u00fade de qualquer maneira que possa infringir leis, regras ou regulamenta\u00e7\u00f5es ou direito de terceiros; ou
termosUso15= - Transmitir v\u00edrus ou qualquer conte\u00fado que interfira na funcionalidade do \u00c1lcool & Sa\u00fade.
termosUso17= Todos os esfor\u00e7os foram realizados para garantir que as informa\u00e7\u00f5es e materiais contidos no \u00c1lcool & Sa\u00fade sejam completamente verdadeiros e n\u00e3o danosos. Os materiais e informa\u00e7\u00f5es disponibilizadas foram avaliados por especialistas na preven\u00e7\u00e3o do consumo abusivo de \u00e1lcool e pessoas que j\u00e1 utilizaram a estrat\u00e9gia de beber menos.
termosUso18= O \u00c1lcool & Sa\u00fade n\u00e3o garante que os servi\u00e7os ser\u00e3o disponibilizados de forma ininterrupta ou constante.
termosUso19= Embora os servi\u00e7os propostos pelo \u00c1lcool & Sa\u00fade tenham como objetivo prover ajuda aos usu\u00e1rios que se preocupem com seu consumo de \u00e1lcool, os mesmos s\u00e3o livres e encorajados a consultar profissionais de sa\u00fade. Todos os usu\u00e1rios devem utilizar este assumindo seus pr\u00f3prios riscos.
termosUso21= As informa\u00e7\u00f5es contidas no \u00c1lcool & Sa\u00fade podem incluir servi\u00e7os e informa\u00e7\u00f5es de terceiros. O conte\u00fado e servi\u00e7os de terceiros ser\u00e3o disponibilizados com aprova\u00e7\u00e3o pr\u00e9via.
termosUso23= O \u00c1lcool & Sa\u00fade cont\u00e9m links para outros sites que n\u00e3o se encontram sob o controle ou \u00e9 mantido por n\u00f3s. Os links de terceiros s\u00e3o disponibilizados para conveni\u00eancia e informa\u00e7\u00e3o. Caso o usu\u00e1rio acesse estas informa\u00e7\u00f5es, os riscos de utiliza\u00e7\u00e3o s\u00e3o de inteira responsabilidade do usu\u00e1rio. O fato de um site de terceiros estar ligado a este projeto, n\u00e3o implica necessariamente em rela\u00e7\u00e3o de patroc\u00ednio ou que o site de terceiro seja afiliado deste.
termosUso25= Informa\u00e7\u00f5es, produtos e servi\u00e7os publicados no \u00c1lcool & Sa\u00fade s\u00e3o sujeitos a altera\u00e7\u00f5es sem pr\u00e9vias not\u00edcias.
termosUso26= Informa\u00e7\u00e3o disponibilizada pelo \u00c1lcool & Sa\u00fade
termosUso27= Pessoas inscritas no programa \u00c1lcool & Sa\u00fade disponibilizam informa\u00e7\u00f5es relacionadas ao conte\u00fado dos mesmos de forma involunt\u00e1ria. Uma vez disponibilizada, a informa\u00e7\u00e3o \u00e9 de propriedade do usu\u00e1rio, podendo ser reproduzida, publicada, transmitida, disponibilizada, sujeita as obriga\u00e7\u00f5es da Pol\u00edtica de Privacidade
termosUso29= Todo conte\u00fado do \u00c1lcool & Sa\u00fade, incluindo os programas, design, textos e gr\u00e1ficos s\u00e3o licenciados pela Licen\u00e7a P\u00fablica Geral - GNU, garantindo a liberdade de usar o conte\u00fado do programa para qualquer prop\u00f3sito, modificar o programa, de compartilhar com seus vizinhos e amigos e compartilhar as mudan\u00e7as que voc\u00ea fizer.
termosUso32= O \u00c1lcool & Sa\u00fade cont\u00e9m marcas e logomarcas de terceiros registradas, protegidas por lei. N\u00e3o \u00e9 permitido o uso delas sem consentimento pr\u00e9vio.
termosUso34= Caso o usu\u00e1rio desrespeite os termos e condi\u00e7\u00f5es do \u00c1lcool & Sa\u00fade, seu acesso pode ser limitado ou proibido.
