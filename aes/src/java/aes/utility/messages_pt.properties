quantoVoceBebeSimGravidezTitle= O quanto voc\u00ea bebe - Informa\u00e7\u00f5es para Gestantes | \u00c1lcool & Sa\u00fade
pregnantAdultDrink01= Informa\u00e7\u00f5es para Gestantes
quantoVoceBebeSimGravidezH31= Cuidado !
quantoVoceBebeSimGravidezH32= Mais informa\u00e7\u00f5es sobre \u00e1lcool
quantoVoceBebeSimGravidezH33= Acompanhamento anual
quantoVoceBebeSimGravidezP1= Voc\u00ea relatou fazer consumo de \u00e1lcool - o que \u00e9 extremamente prejudicial para o bom desenvolvimento do seu beb\u00ea.
quantoVoceBebeSimGravidezP2= \u00c9 fundamental que permane\u00e7a sem beber durante toda a gravidez e mesmo durante o per\u00edodo em que estiver amamentando.
quantoVoceBebeSimGravidezP3= Recomendamos fortemente que pare de beber e que procure, assim que poss\u00edvel, um profissional de sa\u00fade que possa ajud\u00e1-la.
quantoVoceBebeSimGravidezP4= Este ainda n\u00e3o possui ferramentas espec\u00edficas para gestantes.
pregnantAdultDrink04= Recomendamos que leia as perguntas e respostas sobre \u00e1lcool e gravidez abaixo, elas podem lhe ajudar.
quantoVoceBebeSimGravidezP6= N\u00e3o, voc\u00ea n\u00e3o pode
quantoVoceBebeSimGravidezP7= N\u00e3o consuma \u00e1lcool caso esteja ou possa estar gr\u00e1vida
quantoVoceBebeSimGravidezP8= O \u00e1lcool que voc\u00ea consome afeta o desenvolvimento do seu bebe
quantoVoceBebeSimGravidezP9= N\u00e3o, n\u00e3o existe
quantoVoceBebeSimGravidezP10= Toda a bebida que cont\u00e9m \u00e1lcool, mesmo que em menor quantidade, pode prejudicar o se beb\u00ea
quantoVoceBebeSimGravidezP11= Por bebidas alco\u00f3licas estamos nos referindo \u00e0 todas, mesmo cerveja, vinho, coquet\u00e9is, "ice" ou qualquer outra mistura que contenha \u00e1lcool
quantoVoceBebeSimGravidezP12= N\u00e3o, cada gesta\u00e7\u00e3o \u00e9 diferente
quantoVoceBebeSimGravidezP13= O consumo de \u00e1lcool pode prejudicar mais um beb\u00ea do que outro
quantoVoceBebeSimGravidezP14= Voc\u00ea poderia ter tido uma crian\u00e7a que nasceu saud\u00e1vel, mas tamb\u00e9m poderia ter tido uma crian\u00e7a nascida com problemas
quantoVoceBebeSimGravidezP15= N\u00e3o, os problemas afetar o desenvolvimento de sua crian\u00e7a
quantoVoceBebeSimGravidezP16= Em alguns casos mais graves, mesmo quando adulto sua crian\u00e7a precisar\u00e1 de cuidados especiais
quantoVoceBebeSimGravidezP17= Caso tenha bebido \u00e1lcool antes de saber que estava gr\u00e1vida, para de beber agora e procure um profissional de sa\u00fade
quantoVoceBebeSimGravidezP18= Voc\u00ea se sentir\u00e1 melhor e o seu beb\u00ea ter\u00e1 uma grande chance de nascer saud\u00e1vel
quantoVoceBebeSimGravidezP19= Caso esteja com suspeita de estar gr\u00e1vida - n\u00e3o beba \u00e1lcool
quantoVoceBebeSimGravidezP20= Mesmo caso esteja tentando engravidar, n\u00e3o beba \u00e1lcool, pois voc\u00ea pode j\u00e1 estar gr\u00e1vida e n\u00e3o saber
quantoVoceBebeSimGravidezP21= Mesmos nos dois primeiros meses o \u00e1lcool pode prejudicar o seu beb\u00ea
quantoVoceBebeSimGravidezP22= Recomendamos em seu caso que procure um profissional de sa\u00fade para ajud\u00e1-la
quantoVoceBebeSimGravidezP23= O conte\u00fado deste site n\u00e3o foi desenvolvido especialmente para gestantes, mas algumas dicas podem ser \u00fateis:
quantoVoceBebeSimGravidezP24= Saiba que existem diversos meios para ajud\u00e1-la a parar de beber
quantoVoceBebeSimGravidezP25= Caso algu\u00e9m lhe ofere\u00e7a bebida, sempre diga "n\u00e3o obrigada", de forma educada e direta
quantoVoceBebeSimGravidezP26= Procure manter-se longe de pessoas ou lugares que fazem com que voc\u00ea beba
quantoVoceBebeSimGravidezP27= N\u00e3o guarde bebidas alco\u00f3licas em casa
quantoVoceBebeSimGravidezP28= Caso voc\u00ea n\u00e3o consiga parar de beber procure um profissional de sa\u00fade e pe\u00e7a ajuda
quantoVoceBebeSimGravidezP29= Caso n\u00e3o tenha acesso \u00e0 um profissional de sa\u00fade utilize o Viva Voz (Disque 132 - liga\u00e7\u00e3o gratuita)
quantoVoceBebeSimGravidezP30= Se voc\u00ea gostaria de aprofundar mais sobre o assunto, preparamos um material para voc\u00ea neste
quantoVoceBebeSimGravidezP30Link= link.
quantoVoceBebeSimGravidezP31= Se voc\u00ea quiser, podemos entrar em contato com voc\u00ea daqui a um ano para uma nova avalia\u00e7\u00e3o e outras informa\u00e7\u00f5es. Coloque seu e-mail no campo abaixo.
quantoVoceBebeSimGravidezPTabTitle1= 1. Eu posso consumir bebidas alco\u00f3licas se estiver gr\u00e1vida?
quantoVoceBebeSimGravidezPTabTitle2= 2. Existe algum tipo de bebida alco\u00f3lica que \u00e9 segura para ser usada durante a gravidez?
quantoVoceBebeSimGravidezPTabTitle3= 3. Caso tenha bebido durante minha \u00faltima gesta\u00e7\u00e3o e n\u00e3o tive problemas. Tudo bem eu beber desta vez ?
quantoVoceBebeSimGravidezPTabTitle4= 4. Os problemas que meu beb\u00ea pode ter por eu ter bebido v\u00e3o melhorar com o tempo?
quantoVoceBebeSimGravidezPTabTitle5= 5. O que eu fa\u00e7o se estou gr\u00e1vida, mas mesmo assim tenho bebido?
