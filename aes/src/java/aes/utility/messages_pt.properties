quantoVoceBebeNaoAdolesTitle= Informa\u00e7\u00f5es menores de 18 anos | \u00c1lcool & Sa\u00fade
quantoVoceBebeNaoAdolesH31= Parab\u00e9ns por n\u00e3o consumir \u00e1lcool !
quantoVoceBebeNaoAdolesP1= A adolesc\u00eancia \u00e9 um per\u00edodo \u00fanico para o desenvolvimento do c\u00e9rebro.
quantoVoceBebeNaoAdolesP1a= Estudos apontam que, mesmo os adolescentes que consomem \u00e1lcool a pouco tempo, podem ter uma diminui\u00e7\u00e3o do volume do c\u00e9rebro. Ao longo do tempo, adolescentes que consomem \u00e1lcool podem tamb\u00e9m ter maiores dificuldades para resolver problemas que exigem o uso de racioc\u00ednio.
quantoVoceBebeNaoAdolesP1b= Ao evitar consumir \u00e1lcool voc\u00ea n\u00e3o s\u00f3 preserva o seu c\u00e9rebro por mais tempo, como tamb\u00e9m evita outros poss\u00edveis danos que podem estar associados a problemas de sa\u00fade, acidentes, brigas e discuss\u00f5es.
quantoVoceBebeNaoAdolesP1c= Aprender a se divertir e a aproveitar a vida de forma mais saud\u00e1vel \u00e9 sempre uma escolha boa !
quantoVoceBebeNaoAdolesP2= Caso tenha d\u00favidas ou venha a consumir \u00e1lcool no futuro procure um profissional de sa\u00fade  e converse sobre este assunto:
quantoVoceBebeNaoAdolesP3= Confira abaixo algumas das d\u00favidas frequentes entre adolescentes:
quantoVoceBebeNaoAdolesPtab1= 1. Por que devo continuar sem beber ?
quantoVoceBebeNaoAdolesP4= O consumo de \u00e1lcool est\u00e1 associado com uma s\u00e9rie de problemas
quantoVoceBebeNaoAdolesP5= Muitos destes problemas demoram para aparecer e outros s\u00e3o mais vis\u00edveis
quantoVoceBebeNaoAdolesP6= Problemas de sa\u00fade, legais e acidentes est\u00e3o associados com o consumo de \u00e1lcool
quantoVoceBebeNaoAdolesP7= Adolescentes e adultos podem ter o seu desenvolvimento prejudicado pelo \u00e1lcool, reduzindo seu desempenho em esportes, estudo e trabalho
quantoVoceBebeNaoAdolesPtab2= 2. Caso eu n\u00e3o beba, mas esteja pensando em experimentar ?
quantoVoceBebeNaoAdolesP8a= N\u00e3o recomendamos que comece a beber no momento, adolescentes est\u00e3o muito mais expostos \u00e0s consequ\u00eancias negativas relacionados ao consumo do \u00e1lcool.
quantoVoceBebeNaoAdolesP8= Recomendamos em seu caso esteja considerando experimentar \u00e1lcool ou come\u00e7ar a beber que procure um profissional de sa\u00fade para se informar melhor.
quantoVoceBebeNaoAdolesP10= Saiba que existem diversos meios para resistir a press\u00e3o de  beber. Sempre procure ajuda ou apoio quando estiver sentindo-se sob press\u00e3o em rela\u00e7\u00e3o \u00e0 este assunto.
quantoVoceBebeNaoAdolesP11= Caso algu\u00e9m lhe ofere\u00e7a bebida, sempre diga "n\u00e3o obrigada", de forma educada e direta. Isso demonstra for\u00e7a e determina\u00e7\u00e3o.
quantoVoceBebeNaoAdolesP12= Procure manter-se longe de pessoas ou lugares que o pressionam a come\u00e7ar a beber
quantoVoceBebeNaoAdolesP13= Caso n\u00e3o consiga resistir e venha a consumir \u00e1lcool o quanto antes conseguir parar menores ser\u00e3o os efeitos negativos do consumo - procure um profissional de sa\u00fade e pe\u00e7a ajuda
quantoVoceBebeNaoAdolesP15= Caso queira se aprofundar mais neste assunto, preparamos um material para voc\u00ea neste.


pregnantTeenNotDrink01= Informa\u00e7\u00f5es para menores de 18 anos gr\u00e1vidas
quantoVoceBebeNaoAdolesGravidezH31= Parab\u00e9ns por n\u00e3o consumir \u00e1lcool ! Cuidado: toda gravidez na adolesc\u00eancia \u00e9 considerada como de risco, mesmo que voc\u00ea n\u00e3o consuma \u00e1lcool.
quantoVoceBebeNaoAdolesGravidezP1= A adolesc\u00eancia \u00e9 um per\u00edodo \u00fanico para o desenvolvimento do c\u00e9rebro e do seu corpo.
quantoVoceBebeNaoAdolesGravidezP1a= Estudos apontam que mesmo os adolescentes que consomem \u00e1lcool a pouco tempo, podem ter uma diminui\u00e7\u00e3o do volume do c\u00e9rebro. Ao longo do tempo, adolescentes que consomem \u00e1lcool, podem tamb\u00e9m ter maiores dificuldades para resolver problemas que exigem o uso de racioc\u00ednio.
quantoVoceBebeNaoAdolesGravidezP1b= Ao evitar consumir \u00e1lcool voc\u00ea n\u00e3o s\u00f3 preserva o seu c\u00e9rebro por mais tempo, como tamb\u00e9m evita outros poss\u00edveis danos que podem estar associados com problemas de sa\u00fade, acidentes, brigas e discuss\u00f5es.
quantoVoceBebeNaoAdolesGravidezP1c= Aprender a se divertir e aproveitar a vida de forma mais saud\u00e1vel \u00e9 sempre uma escolha boa !

