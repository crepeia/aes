estrategiaDimAlterL12= Procure novas atividades mais saud\u00e1veis, como exerc\u00edcios f\u00edsicos (ex. caminhadas, andar de bicicletas, passear ao ar livre, etc)
estrategia.dim.alter.h4.2= Com o tempo voc\u00ea ser\u00e1 mais saud\u00e1vel e mais confiante, caso evite beber para:
