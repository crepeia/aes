h2PageBlank= Objetivo do Programa
aboutobjectiveContent= Oferecer suporte e informa\u00e7\u00f5es de qualidade em sa\u00fade para pessoas que usam \u00e1lcool.
h2PageBlank1= Desenvolvimento
pPageBlank1= Desenvolvido por especialistas da Universidade Federal de Juiz de Fora os princ\u00edpios da
pPageBlank2= Conte\u00fado baseado nas diretrizes para o tratamento de problemas relacionados ao uso de \u00e1lcool - seguindo orienta\u00e7\u00f5es da Organiza\u00e7\u00e3o Mundial de Sa\u00fade, Minist\u00e9rio da Sa\u00fade e NIAAA
pPageBlank3= Este site n\u00e3o substitui o atendimento realizado por um profissional de sa\u00fade. Todo o conte\u00fado do site est\u00e1 sendo avaliado por um pesquisa cl\u00ednica registrada no Comit\u00ea de \u00c9tica em Pesquisa da UFJF
h2Pesquisadores= Motiva\u00e7\u00f5es
pPesquisadores1= O consumo abusivo de \u00e1lcool est\u00e1 associado com mais de 60 tipos de problemas de sa\u00fade diferentes e com alto custo econ\u00f4mico e social.
pPesquisadores2= Existem evid\u00eancias de que interven\u00e7\u00f5es disponibilizadas na internet podem ser eficazes para redu\u00e7\u00e3o do consumo abusivo de \u00e1lcool.
pPesquisadores3= O uso da internet no pa\u00eds cresce exponencialmente, o que caracteriza este espa\u00e7o como oportuno para oferecer informa\u00e7\u00e3o em sa\u00fade com qualidade.
pPesquisadores31= . Contudo, ainda s\u00e3o poucos os estudos que avaliam a aceitabilidade/efetividade destas interven\u00e7\u00f5es em pa\u00edses com as caracter\u00edsticas s\u00f3cio-econ\u00f4micas do Brasil.
pPesquisadores4= Embora existam sites em l\u00edngua portuguesa que ofere\u00e7am informa\u00e7\u00f5es sobre \u00e1lcool, consideramos que ainda existe uma importante
pPesquisadores5= "Disparidade entre a demanda e a oferta de interven\u00e7\u00f5es online de qualidade para diversos comportamentos em sa\u00fade."
h2Pesquisadores1= Nossa metodologia
pPesquisadores6= O conte\u00fado do site \u00e9 baseado nas diretrizes da Organiza\u00e7\u00e3o Mundial de Sa\u00fade para identifica\u00e7\u00e3o de problemas relacionados ao uso de \u00e1lcool e interven\u00e7\u00f5es breves para o uso de risco e uso nocivo de \u00e1lcool. Parte do conte\u00fado tamb\u00e9m est\u00e1 baseado no guia cl\u00ednico do NIAAA "Helping Patients who Drink too much" .
pPesquisadores7= Durante as etapas de desenvolvimento, pessoas que consomem \u00e1lcool foram consultados atrav\u00e9s da realiza\u00e7\u00e3o de entrevistas coletivas e de testes de usabilidade. Ap\u00f3s o t\u00e9rmino da primeira vers\u00e3o, seu conte\u00fado foi avaliado por especialistas em interven\u00e7\u00f5es breves.
pPesquisadores8= O conte\u00fado respeita as normas do Conselho Federal de Medicina, Conselho Federal de Psicologia e da Health on the Net Foundation

