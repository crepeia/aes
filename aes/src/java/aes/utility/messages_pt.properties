tcleAlertAgreeBody= Obrigado por aceitar participar da pesquisa! O hor\u00e1rio em que as perguntas s\u00e3o enviadas pode ser alterado em Op\u00e7\u00f5es
tcleAlertAgreeTitle= Obrigado pela ajuda!!
tcleAlertNotAgreeBody= Poxa, que pena que voc\u00ea n\u00e3o queira participar. Caso mude de ideia, voc\u00ea pode alterar a resposta na tela de "Op\u00e7\u00f5es".
tcleAlertNotAgreeTitle= Quem sabe na pr\u00f3xima vez
tcleBody11= Gostar\u00edamos de convidar voc\u00ea a participar como volunt\u00e1rio(a) da pesquisa
tcleBody12= \u201cAplicativo M\u00f3vel com Elementos de Jogos numa Interven\u00e7\u00e3o para o Consumo Excessivo de \u00c1lcool\u201d.
tcleBody13= O motivo que nos leva a realizar esta pesquisa \u00e9 a import\u00e2ncia de um sistema que auxilie nas interven\u00e7\u00f5es de usu\u00e1rios de alto risco de bebidas alco\u00f3licas. Nesta pesquisa pretendemos avaliar a satisfa\u00e7\u00e3o e experi\u00eancia do usu\u00e1rio com a utiliza\u00e7\u00e3o de um aplicativo m\u00f3vel que auxilie em tais interven\u00e7\u00f5es.
tcleBody21= Caso voc\u00ea concorde em participar, algumas perguntas fechadas ir\u00e3o aparecer durante a utiliza\u00e7\u00e3o do aplicativo. Essas perguntas ser\u00e3o feitas para avaliar o seu grau de satisfa\u00e7\u00e3o e a sua experi\u00eancia com o sistema e com os elementos de jogos
tcleBody22= (n\u00edvel, distintivo, placar de l\u00edderes e classifica\u00e7\u00e3o)
tcleBody23= presentes no aplicativo. Pedimos que responda essas perguntas com seriedade para n\u00e3o afetar o resultado final da pesquisa. Se aceitar participar tamb\u00e9m iremos coletar alguns dados, obtidos atrav\u00e9s da sua intera\u00e7\u00e3o com o aplicativo.
tcleBody3= As perguntas ir\u00e3o aparecer todo dia em um hor\u00e1rio definido por voc\u00ea. Voc\u00ea poder\u00e1 escolher esse hor\u00e1rio ap\u00f3s esse documento, em caso de resposta positiva para participa\u00e7\u00e3o na pesquisa. Voc\u00ea tamb\u00e9m poder\u00e1 alterar o hor\u00e1rio que receber\u00e1 as perguntas  atrav\u00e9s de uma op\u00e7\u00e3o nas configura\u00e7\u00f5es.
tcleBody4= Esta pesquisa tem um risco, que \u00e9 o surgimento de situa\u00e7\u00f5es psicologicamente desconfort\u00e1veis. Para diminuir a chance desse risco acontecer, as perguntas que ser\u00e3o realizadas foram desenvolvidas para evitar ao m\u00e1ximo o aparecimento de situa\u00e7\u00f5es desconfort\u00e1veis e problemas psicol\u00f3gicos passados. A pesquisa pode ajudar voc\u00ea a ter uma satisfa\u00e7\u00e3o e um engajamento maior na utiliza\u00e7\u00e3o do aplicativo e nos seus processos de interven\u00e7\u00e3o que ele oferece.
tcleBody5= Para participar deste estudo, voc\u00ea n\u00e3o ter\u00e1 nenhum custo e nem receber\u00e1 qualquer vantagem financeira. Apesar disso, se voc\u00ea tiver algum dano por causa das atividades que fizermos com voc\u00ea nesta pesquisa, voc\u00ea tem direito a buscar indeniza\u00e7\u00e3o. Voc\u00ea ter\u00e1 todas as informa\u00e7\u00f5es que quiser sobre esta pesquisa e estar\u00e1 livre para participar ou recusar-se a participar. Mesmo que voc\u00ea queira participar agora, voc\u00ea pode voltar atr\u00e1s ou parar de participar a qualquer momento, atrav\u00e9s de uma op\u00e7\u00e3o nas configura\u00e7\u00f5es que lhe permite entrar e sair da pesquisa a qualquer momento. A sua participa\u00e7\u00e3o \u00e9 volunt\u00e1ria e o fato de n\u00e3o querer participar n\u00e3o vai trazer qualquer penalidade. O pesquisador n\u00e3o vai divulgar seu nome. Os resultados da pesquisa estar\u00e3o \u00e0 sua disposi\u00e7\u00e3o quando finalizada. Seu nome ou o material que indique sua participa\u00e7\u00e3o n\u00e3o ser\u00e1 liberado sem a sua permiss\u00e3o. Voc\u00ea n\u00e3o ser\u00e1 identificado(a) em nenhuma publica\u00e7\u00e3o que possa resultar desta pesquisa.
tcleBody61= Os pesquisadores tratar\u00e3o a sua identidade com padr\u00f5es profissionais de sigilo, atendendo a legisla\u00e7\u00e3o brasileira
tcleBody62= (Resolu\u00e7\u00e3o N\u00ba 466/12 do Conselho Nacional de Sa\u00fade)
tcleBody63= , e utilizando as informa\u00e7\u00f5es somente para fins acad\u00eamicos e cient\u00edficos. Os pesquisadores tamb\u00e9m tratar\u00e3o os seus dados obtidos na pesquisa de forma que proteja os seus direitos fundamentais de liberdade e de privacidade e seguindo os princ\u00edpios expressos pela a
tcleBody64= Lei Geral de Prote\u00e7\u00e3o de Dados Pessoais (LGPD, Lei n\u00b0 13.709/2018).
tcleBody71= Caso tenha alguma d\u00favida em rela\u00e7\u00e3o ao processo responderemos elas pelo email
tcleBody72= projeto.alcoolesaude@ufjf.br
tcleBody73= e caso tenha alguma d\u00favida em rela\u00e7\u00e3o a \u00e9tica da pesquisa pode entrar em contato pelo n\u00famero
tcleBody74= (32) 2102-3788
tcleBody75= ou por e-mail
tcleBody76= cep.propp@ufjf.br.
