strategyStopIntroduction01= Pessoas que podem ser dependentes podem achar dif\u00edcil parar de beber sem ajuda.
strategyStopIntroduction03= Existem atualmente diversas abordagens de tratamentos que comprovadamente podem lhe ajudar.
strategyStopIntroduction05= Come\u00e7ar buscando ajuda \u00e9 um excelente caminho.
strategyStopIntroduction06= As suas chances s\u00e3o muito maiores quando voc\u00ea encontra um tipo de tratamento que voc\u00ea se sente confort\u00e1vel.
strategyStopIntroduction08= As sugest\u00f5es a seguir s\u00e3o mais \u00fateis para pessoas que tem grande chances de terem se tornado dependentes de \u00e1lcool.
strategyStopProfessionalSupport02= Avan\u00e7os no tratamento do alcoolismo fazem com que atualmente pacientes tenham mais alternativas de tratamento e que profissionais tenham mais ferramentas.
strategyStopProfessionalSupport03= Novos medicamentos podem ajud\u00e1-lo a parar de beber atuando em vias neurais.
strategyStopProfessionalSupport04= Estes novos medicamentos (ex.: Naltrexona, Topiramato, etc.) n\u00e3o o fazem se sentir com n\u00e1useas comos os medicamentos mais antigos (ex.: Disulfiram).
strategyStopProfessionalSupport05= Nenhuma destas medica\u00e7\u00f5es causam depend\u00eancia, o que \u00e9 a preocupa\u00e7\u00e3o de alguns grupos de apoio e servi\u00e7os de aconselhamento para \u00e1lcool.
strategyStopProfessionalSupport06= Estudos tem mostrado que pacientes com depend\u00eancia de \u00e1lcool podem receber tratamento efetivo combinando estas novas medica\u00e7\u00f5es e visitas breves \u00e0 um profissional de sa\u00fade para acompanhamento.
strategyStopProfessionalSupportTherapy02= Existem diferentes tipos de aconselhamento/terapias que podem lhe ajudar e que s\u00e3o efetivas:
strategyStopProfessionalSupportTherapy03= Alguns exemplos s\u00e3o a abordagem cognitivo comportamental, abordagem motivacional, 12 passos ou uma combina\u00e7\u00e3o destas.
strategyStopProfessionalSupportTherapy04= Apesar das diferen\u00e7as entre as abordagens, conseguir algum tipo de ajuda por si mesmo \u00e9 mais importante do que uma abordagem espec\u00edfica, desde que seja lhe oferecido(a) uma abordagem que seja emp\u00e1tica, evite confronta\u00e7\u00f5es pesadas, aumente sua motiva\u00e7\u00e3o e lhe oferece m\u00e9todos objetivos para mudar a forma como voc\u00ea bebe.
strategyStopProfessionalSupportTherapy06= Algumas pessoas, n\u00e3o a maior parte delas, podem precisar de programas mais intensivos. Caso voc\u00ea precise de um encaminhamento para um programa como este, procure um profissional de sa\u00fade.
strategyStopSocialSupport01= Neste caso \u00e9 importante:
strategyStopSocialSupport02= Conversar sobre a sua mudan\u00e7a com fam\u00edlia e amigos.
strategyStopSocialSupport03= Buscar desenvolver novos interesses e novos grupos sociais.
strategyStopSocialSupport04= Encontrar um jeito prazeroso de usar o seu tempo de forma que o \u00e1lcool n\u00e3o esteja envolvido.
strategyStopSocialSupport05= Recomendamos fortemente que caso esteja querendo parar de beber voc\u00ea deve procurar ajuda de um profissional de sa\u00fade.
strategyStopSocialSupport06= Pedir ajuda de outras pessoas.
strategyStopSocialSupport07= Ao parar de beber geralmente as pessoas encontram o desafio de reconstruir a sua vida sem \u00e1lcool.
strategyStopSocialSupportAA02= Pessoas em recupera\u00e7\u00e3o que frequentam grupos como o AA regularmente tendem a terem melhores resultados dos os que n\u00e3o frequentam.
strategyStopSocialSupportAA04= Procure um grupo em que voc\u00ea se sinta mais confort\u00e1vel.
strategyStopSocialSupportAA05= Em um grupo que voc\u00ea se sinta mais confort\u00e1vel voc\u00ea ter\u00e1 mais chances de se envolver, inclusive podendo ajudar outras pessoas no futuro.
strategyStopSocialSupportOthers02= N\u00e3o lhe ofere\u00e7am \u00e1lcool.
strategyStopSocialSupportOthers03= Evitem usar \u00e1lcool quando voc\u00ea estiver presente.
strategyStopSocialSupportOthers04= Que lhe ofere\u00e7am apoio e que evitem criticismo.
strategyStopSocialSupportOthers05= N\u00e3o pedirem que voc\u00ea assuma novas demandas no momento.
strategyStopSocialSupportOthers07= Procurem tamb\u00e9m ajuda de um profissional ou grupos como o Al-Anon.
strategyStopSupportDepressionAndAnxiety02= Sintomas moderados podem deixar de incomodar a partir do momento em que voc\u00ea passa a beber menos ou para de beber.
strategyStopSupportDepressionAndAnxiety04= Procure um profissional de sa\u00fade.
strategyStopSupportDepressionAndAnxiety06= Existem tratamentos dispon\u00edveis que podem lhe ajudar a passar por esta situa\u00e7\u00e3o.
strategyStopSupportDoNotGiveUp01= Mudar comportamentos como fumar, comer demais ou beber muito, pode demandar muito esfor\u00e7o, podendo n\u00e3o ter resultados positivos logo na primeira tentativa.
strategyStopSupportDoNotGiveUp02= Algumas falhas durante o percurso s\u00e3o comuns, mas voc\u00ea sempre aprende mais a cada vez que passa por elas.
strategyStopSupportDoNotGiveUp03= Cada uma destas tentativas o trar\u00e1 mais pr\u00f3ximo ao seu objetivo.
strategyStopSupportDoNotGiveUp05= Caso esta abordagem n\u00e3o funcione, tente alguma outra coisa.
strategyStopSupportDoNotGiveUp06= Caso alguma falha aconte\u00e7a durante este caminho, busque voltar para os trilhos o mais r\u00e1pido poss\u00edvel.
strategyStopSupportDoNotGiveUp08= pesar desta ser uma longa jornada, voc\u00ea tem grandes chances de sucesso.
strategyStopSupportDoNotGiveUp09= Quanto mais persistir tentando maiores s\u00e3o estas chances de sucesso.
strategyStopSupportDoNotGiveUp10= Diversas pesquisas apoiam isto, mostrando que \u00e9 poss\u00edvel mudar seu comportamento com rela\u00e7\u00e3o ao \u00e1lcool.
