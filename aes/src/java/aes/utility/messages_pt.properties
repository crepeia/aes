alcoholAffectHealth2= pode afetar a sua sa\u00fade?
alcoholYesDependence02= Considerando as suas respostas, seu consumo de \u00e1lcool j\u00e1 poderia ser considerado como associado \u00e0 v\u00e1rios problemas.
alcoholYesDependence03= A forma como voc\u00ea consome \u00e1lcool \u00e9 compat\u00edvel com a maneira com que pessoas dependentes de \u00e1lcool o consomem.
alcoholYesDependence04= Voc\u00ea j\u00e1 experimenta problemas importantes e ir\u00e1 se beneficiar muito de uma ajuda profissional.
alcoholYesDependence05= Geralmente conhecido como alcoolismo, a depend\u00eancia do uso de \u00e1lcool \u00e9 uma consequ\u00eancia do seu consumo abusivo.
alcoholYesDependence06= Os problemas relacionados ao consumo de \u00e1lcool s\u00e3o considerados problemas de sa\u00fade importantes e exigem cuidado.
alcoholYesDependence08= Recomendamos fortemente que voc\u00ea procure ajuda de um profissional de sa\u00fade ou ligue para o programa gratuito 132 "Viva Voz".\n\nSe preferir, voc\u00ea tamb\u00e9m pode conversar conosco. Estamos \u00e0 disposi\u00e7\u00e3o para te ajudar e tirar suas d\u00favidas com psic\u00f3logos de forma r\u00e1pida e online!
alcoholYesDependence09= CLIQUE AQUI PARA CONHECER MAIS
alcoholYesDependence10= Estes passos podem lhe ajudar a conhecer melhor como o seu consumo de \u00e1lcool pode prejudicar a sua sa\u00fade no momento.
alcoholYesDependence11= Voc\u00ea gostaria de adicionalmente conhecer algumas estrat\u00e9gias pr\u00e1ticas que podem lhe ajudar com este problema?
alcoholYesDependence14= Caso tenha interesse de receber o nosso contato novamente, clique no bot\u00e3o abaixo:
alcoholYesDependence15= Entrar em Contato em 1 Ano
alcoholYesDependence16= Ou volte \u00e0 p\u00e1gina principal:
