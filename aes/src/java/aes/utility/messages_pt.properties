prontoFisLab2= Comer alimentos com baixa quantidade de calorias como frutas cristalizadas (uva passas), balas diet\u00e9ticas e chicletes diet\u00e9ticos.
prontoFisLab3= Fazer exerc\u00edcio de relaxamento - em \u00e1udio MP3 - link para download no plano de parar.
prontoFisLab4= Ler um cart\u00e3o com suas raz\u00f5es para ter parado de fumar.
