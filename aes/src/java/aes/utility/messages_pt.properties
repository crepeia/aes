options07= Siga os passos abaixo.\nAntes de executar, leia todos os passos:\n\n1. Toque no bot\u00e3o \"Configura\u00e7\u00f5es do Aplicativo\" abaixo.\n2. Voc\u00ea ser\u00e1 levado para a tela de configura\u00e7\u00f5es do aplicativo.\n3. Procure e toque em \"Bateria\" ou \"Otimiza\u00e7\u00e3o de Bateria\" ou \"Gerenciar uso de Bateria\".\n5. Encontre e toque em alguma das op\u00e7\u00f5es: \"N\u00e3o restrito\" ou \"Sem restri\u00e7\u00f5es\" ou \"Permitir uso completo de bateria\".\n\nEssa configura\u00e7\u00e3o garante que o aplicativo ir\u00e1 funcionar corretamente em segundo plano, evitando problemas no chat. Obrigado!
