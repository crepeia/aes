keepDrinking01= Registre o quanto voc\u00ea bebe
estrategiaDimRegistroLi1= Registrar o quanto voc\u00ea est\u00e1 bebendo \u00e9 uma das tarefas que mais pode lhe ajudar a diminuir o seu consumo
estrategiaDimRegistroLi2= \u00c9 importante que voc\u00ea escolha a maneira mais pr\u00e1tica de fazer este registro
alternativeDecreaseRegist01= Abaixo seguem algumas das sugest\u00f5es para registro
estrategiaDimRegistroLi3= Utilize a ferramenta do pr\u00f3prio site
estrategiaDimRegistroLi4= Utilize cart\u00f5es impressos que podem estar em sua pr\u00f3pria carteira ou bolsa
estrategiaDimRegistroLi5= Utilize um calend\u00e1rio em casa para registrar
estrategiaDimRegistroLi6= Registre no bloco de notas do seu celular ou computador
alternativeDecreaseRegist06= Voc\u00ea tamb\u00e9m pode fazer este registro no site ou imprimi-lo como ver\u00e1 na p\u00e1gina a seguir

estrategiaPararApoioDepreAnsiTitle1= Parando de Beber | \u00c1lcool & Sa\u00fade
estrategiaPararApoioDepreAnsiH31= Sentindo-se deprimido ou ansioso
strategyStopSupportDepressionAndAnxiety01= Sentir-se deprimido ou ansioso \u00e9 comum entre pessoas que possuem algum tipo de problema com \u00e1lcool
estrategiaPararApoioDepreAnsiLi1= Sintomas moderados podem deixar de incomodar a partir do momento em que voc\u00ea passa a beber menos ou para de beber
strategyStopSupportDepressionAndAnxiety03= Caso os sintomas persistam ou piorem:
estrategiaPararApoioDepreAnsiLi2= Procure um profissional de sa\u00fade
strategyStopSupportDepressionAndAnxiety05= Caso voc\u00ea tenha tido pensamentos relacionados \u00e0 suic\u00eddio, procure o servi\u00e7o de emerg\u00eancia mais pr\u00f3ximo de voc\u00ea (como bombeiros, emerg\u00eancia hospitalar ou seu pr\u00f3prio m\u00e9dico)
estrategiaPararApoioDepreAnsiLi3= Existem tratamentos dispon\u00edveis que podem lhe ajudar a passar por esta situa\u00e7\u00e3o

strategyStopIntroduction07= Parando de Beber
estrategiaPararApoioIntroH41= As sugest\u00f5es a seguir s\u00e3o mais \u00fateis para pessoas que tem grande chances de terem se tornado dependentes de \u00e1lcool
estrategiaPararApoioIntroLi1= Pessoas que podem ser dependentes podem achar dif\u00edcil parar de beber sem ajuda
strategyStopIntroduction02= Recomendamos fortemente que caso esteja querendo parar de beber voc\u00ea deve procurar ajuda de um profissional de sa\u00fade
estrategiaPararApoioIntroLi2= Existem atualmente diversas abordagens de tratamentos que comprovadamente podem lhe ajudar
strategyStopIntroduction04= \u00c9 importante ressaltar que n\u00e3o existe um \u00fanico tipo de tratamento e que cada pessoa pode se adaptar melhor a um especifico
estrategiaPararApoioIntroLi3= Come\u00e7ar buscando ajuda \u00e9 um excelente caminho
estrategiaPararApoioIntroLi4= As suas chances s\u00e3o muito maiores quando voc\u00ea encontra um tipo de tratamento que voc\u00ea se sente confort\u00e1vel

quittingDrinkingProfessionalSuport= Parando de Beber - Apoio Profissional
strategyStopProfessionalSupportTherapy01= Aconselhamento ou "Terapia"
estrategiaPararApoioProfTerapiaP1= Existem diferentes tipos de aconselhamento/terapias que podem lhe ajudar e que s\u00e3o efetivas
estrategiaPararApoioProfTerapiaLi1= Alguns exemplos s\u00e3o a abordagem cognitivo comportamental, abordagem motivacional, 12 passos ou uma combina\u00e7\u00e3o destas
estrategiaPararApoioProfTerapiaLi2= Apesar das diferen\u00e7as entre as abordagens, conseguir algum tipo de ajuda por si mesmo \u00e9 mais importante do que uma abordagem espec\u00edfica, desde que seja lhe oferecido(a) uma abordagem que seja emp\u00e1tica, evite confronta\u00e7\u00f5es pesadas, aumente sua motiva\u00e7\u00e3o e lhe oferece m\u00e9todos objetivos para mudar a forma como voc\u00ea bebe
strategyStopProfessionalSupportTherapy05= Programas de tratamento intensivo especializados
estrategiaPararApoioProfTerapiaLi3= Algumas pessoas, n\u00e3o a maior parte delas, podem precisar de programas mais intensivos. Caso voc\u00ea precise de um encaminhamento para um programa como este, procure um profissional de sa\u00fade

strategyStopProfessionalSupport01= Medicamentos para tratar alcoolismo
estrategiaPararApoioProfissionalP1= Avan\u00e7os no tratamento do alcoolismo fazem com que atualmente pacientes tenham mais alternativas de tratamento e que profissionais tenham mais ferramentas
estrategiaPararApoioProfissionalLi1= Novos medicamentos podem ajud\u00e1-lo a parar de beber atuando em vias neurais
estrategiaPararApoioProfissionalLi2= Estes novos medicamentos (ex. Naltrexona, Topiramato, etc) n\u00e3o o fazem se sentir com n\u00e1useas comos os medicamentos mais antigos (ex. Disulfiram)
estrategiaPararApoioProfissionalLi3= Nenhuma destas medica\u00e7\u00f5es causam depend\u00eancia, o que \u00e9 a preocupa\u00e7\u00e3o de alguns grupos de apoio e servi\u00e7os de aconselhamento para \u00e1lcool
estrategiaPararApoioProfissionalLi4= Estudos tem mostrado que pacientes com depend\u00eancia de \u00e1lcool podem receber tratamento efetivo combinando estas novas medica\u00e7\u00f5es e visitas breves \u00e0 um profissional de sa\u00fade para acompanhamento

estrategiaPararApoioProfissionalNaoDesistaTitle= Parando de beber | \u00c1lcool & Sa\u00fade
changingYourBehaviorDontGiveUp= Mudando seu comportamento - N\u00e3o desista
estrategiaPararApoioProfissionalNaoDesistaP1= Mudar comportamentos como fumar, comer demais ou beber muito, pode demandar muito esfor\u00e7o, podendo n\u00e3o ter resultados positivos logo na primeira tentativa
estrategiaPararApoioProfissionalNaoDesistaLi1= Algumas falhas durante o percurso s\u00e3o comuns, mas voc\u00ea sempre aprende mais a cada vez que passa por elas
estrategiaPararApoioProfissionalNaoDesistaLi2= Cada uma destas tentativas o trar\u00e1 mais pr\u00f3ximo ao seu objetivo
strategyStopSupportDoNotGiveUp04= Qualquer que seja o caminho que voc\u00ea escolha - tente-o de forma justa
estrategiaPararApoioProfissionalNaoDesistaLi3= Caso esta abordagem n\u00e3o funcione, tente alguma outra coisa
estrategiaPararApoioProfissionalNaoDesistaLi4= Caso alguma falha aconte\u00e7a durante este caminho, busque voltar para os trilhos o mais r\u00e1pido poss\u00edvel
strategyStopSupportDoNotGiveUp07= Lembre-se:
estrategiaPararApoioProfissionalNaoDesistaLi5= Apesar desta ser uma longa jornada, voc\u00ea  tem grandes chances de sucesso
estrategiaPararApoioProfissionalNaoDesistaLi6= Quanto mais persistir tentando maiores s\u00e3o estas chances de sucesso
estrategiaPararApoioProfissionalNaoDesistaLi7= Diversas pesquisas apoiam isto, mostrando que \u00e9 poss\u00edvel mudar seu comportamento com rela\u00e7\u00e3o ao \u00e1lcool

quittingDrinkingSelfHelpGroups= Parando de Beber - Grupos de Auto-Ajuda
strategyStopSocialSupportAA01= Considere participar de um grupo de auto-ajuda como os Alco\u00f3licos An\u00f4nimos
estrategiaPararApoioSocialAaLi1= Pessoas em recupera\u00e7\u00e3o que frequentam grupos como o AA regularmente tendem a terem melhores resultados dos os que n\u00e3o frequentam
strategyStopSocialSupportAA03= Grupos podem variar bastante
estrategiaPararApoioSocialAaLi2= Procure um grupo em que voc\u00ea se sinta mais confort\u00e1vel
estrategiaPararApoioSocialAaLi3= Em um grupo que voc\u00ea se sinta mais confort\u00e1vel voc\u00ea ter\u00e1 mais chances de se envolver, inclusive podendo ajudar outras pessoas no futuro

quittingDrinkingAskingForHelp= Parando de Beber - Pedindo ajuda
strategyStopSocialSupportOthers01= Quando for pedir ajuda para parar de beber, seja para amigos ou qualquer outra pessoa \u00e9 importante pedir que
estrategiaPararApoioSocialOutrosLi1= N\u00e3o lhe ofere\u00e7am \u00e1lcool
estrategiaPararApoioSocialOutrosLi2= Evitem usar \u00e1lcool quando voc\u00ea estiver presente
estrategiaPararApoioSocialOutrosLi3= Que lhe ofere\u00e7am apoio e que evitem criticismo
estrategiaPararApoioSocialOutrosLi4= N\u00e3o pedirem que voc\u00ea assuma novas demandas no momento
estrategiaPararApoioSocialOutrosLi6= Procurem tamb\u00e9m ajuda de um profissional ou grupos como o Al-Anon

estrategiaPararApoioSocialH31= Parando de Beber - Suporte Social
estrategiaPararApoioSocialH41= Ao parar de beber geralmente as pessoas encontram o desafio de reconstruir a sua vida sem \u00e1lcool
estrategiaPararApoioSocialH32= Neste caso \u00e9 importante que:
estrategiaPararApoioSocialLi1= Conversar sobre a sua mudan\u00e7a com fam\u00edlia e amigos
estrategiaPararApoioSocialLi2= Buscar desenvolver novos interesses e novos grupos sociais
estrategiaPararApoioSocialLi3= Encontrar um jeito prazeroso de usar o seu tempo de forma que o \u00e1lcool n\u00e3o esteja envolvido
estrategiaPararApoioSocialLi5= Pedir ajuda de outras pessoas

logoutTitle1= \u00c1lcool & Sa\u00fade | Programa gratuito para avalia\u00e7\u00e3o do consumo de \u00e1lcool
