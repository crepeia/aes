planoMudancaProntoParaComecarTitle1= O quanto voc\u00ea bebe ? | \u00c1lcool & Sa\u00fade
planoMudancaProntoParaComecarH11= Pronto para come\u00e7ar
planoMudancaProntoParaComecarP1= A seguir, caso esteja pronto(a) para come\u00e7ar, voc\u00ea ter\u00e1 a oportunidade de preencher o seu plano de mudan\u00e7a
planoMudancaProntoParaComecarH41= Voc\u00ea ter\u00e1 a op\u00e7\u00e3o de imprimir e/ou enviar este plano para o seu e-mail depois de finalizado
planoMudancaProntoParaComecarFacet1= Data para come\u00e7ar
changePlanReadyText04= Raz\u00f5es: As raz\u00f5es mais importantes que eu tenho para mudar a forma que bebo s\u00e3o:
planoMudancaProntoParaComecarFacet3= Estrat\u00e9gias - Eu irei usar as seguintes estrat\u00e9gias ?
planoMudancaProntoParaComecarFacet4= Pessoas - As pessoas que podem me ajudar s\u00e3o (nomes e como eles podem lhe ajudar) ?
planoMudancaProntoParaComecarFacet5= Sinais de Sucesso - Eu saberei que meu plano est\u00e1 funcionando quando ?
planoMudancaProntoParaComecarFacet6= Poss\u00edveis Dificuldades e Solu\u00e7\u00f5es: O que pode interferir e como posso lidar com estas situa\u00e7\u00f5es ?

planoMudancaProntoParaComecar1Title1= Seu plano personalizado | \u00c1lcool & Sa\u00fade

planoMudancaH11= Planejando sua Mudan\u00e7a
changePlanIntroText08= Mesmo que voc\u00ea esteja comprometido em mudar o seu consumo de \u00e1lcool, voc\u00ea pode ainda sentir-se em d\u00favida sobre esta decis\u00e3o.
planoMudancaP2= Apresentar sentimentos mistos em rela\u00e7\u00e3o a este objetivo \u00e9 comum - uma ferramenta que ir\u00e1 lhe ajudar a alcan\u00e7ar as suas metas \u00e9 o
planoMudancaP21= plano de a\u00e7\u00e3o.
changePlanIntroText03= Este plano vai lhe ajudar a definir:
planoMudancaLi1= Quais s\u00e3o as suas metas
planoMudancaLi2= Porque voc\u00ea quer alcan\u00e7\u00e1-las
planoMudancaLi3= Como voc\u00ea planeja alcan\u00e7\u00e1-las
planoMudancaLi4= Clique em pr\u00f3ximo para continuar

politicaDoSiteTitle1= Pol\u00edtica de privacidade | \u00c1lcool & Sa\u00fade
politicaDoSiteP2= V.3
politicaDoSiteP3= Nos sistemas do projeto \u00c1lcool e Sa\u00fade, privacidade e seguran\u00e7a s\u00e3o prioridades e nos comprometemos com a transpar\u00eancia do tratamento de dados pessoais dos nossos usu\u00e1rios/clientes. Por isso, esta presente Pol\u00edtica de Privacidade estabelece como \u00e9 feita a coleta, uso e transfer\u00eancia de informa\u00e7\u00f5es de volunt\u00e1rios e visitantes que acessam ou usam nossos sites ou aplicativo m\u00f3vel.
politicaDoSiteP41= Ao utilizar nossos servi\u00e7os, voc\u00ea entende que coletaremos e usaremos suas informa\u00e7\u00f5es pessoais nas formas descritas nesta Pol\u00edtica, sob as
politicaDoSiteP42= normas de Prote\u00e7\u00e3o de Dados
politicaDoSiteP42Link= LGPD, Lei Federal 13.709/2018
politicaDoSiteP43= das disposi\u00e7\u00f5es consumeristas da Lei Federal 8078/1990 e as demais normas do ordenamento jur\u00eddico brasileiro aplic\u00e1veis.
politicaDoSiteP5= Dessa forma, os sistemas
politicaDoSiteP51= \u00c1lcool e Sa\u00fade
politicaDoSiteP52= com autoriza\u00e7\u00e3o do Comit\u00ea de \u00c9tica em Pesquisa da UFJF (CAAE: 0027.0.180.000-11) e UNIFESP (CAAE: 13904513.7.1001.5505), no papel de Controladora de Dados, obrigam-se ao disposto nesta Pol\u00edtica de Privacidade.
politicaDoSiteH31= 1. Quais dados coletamos sobre voc\u00ea e para qual finalidade?
politicaDoSiteP6= Nossos sistemas coletam e utilizam alguns dados pessoais seus, de forma a viabilizar o oferecimento, a presta\u00e7\u00e3o e a melhoria na qualidade de servi\u00e7os, o fornecimento de informa\u00e7\u00f5es e outros tipos de comunicados, o envolvimento do titular em iniciativas do site e o aprimoramento da experi\u00eancia de uso e, assim, atender melhor \u00e0s necessidades do volunt\u00e1rio e da
politicaDoSiteP6Link= Pesquisa desenvolvida
politicaDoSiteP7= Tratando especificamente do aprimoramento da experi\u00eancia de uso, nossos sistemas podem coletar e arquivar dados e informa\u00e7\u00f5es referentes ao acesso e uso dos mesmos, como:
politicaDoSiteLi1= Nome e dom\u00ednio onde voc\u00ea acessou a Internet;
politicaDoSiteLi3= O endere\u00e7o de Internet do site onde voc\u00ea foi direcionado a um dos nossos sistemas;
politicaDoSiteLi4= As p\u00e1ginas que voc\u00ea acessou enquanto utilizava algum dos nossos sistemas.
politicaDoSiteP8= As informa\u00e7\u00f5es coletadas referente ao acesso e uso dos sistemas
politicaDoSiteP82= n\u00e3o identificam usu\u00e1rios e s\u00e3o utilizadas para medir o n\u00famero de visitantes do sistema e como ele \u00e9 navegado. Esta informa\u00e7\u00e3o \u00e9 utilizada para melhorar a navega\u00e7\u00e3o e a experi\u00eancia de uso.
politicaDoSiteH41= 1.1. Dados pessoais fornecidos pelo titular
politicaDoSiteLi5= Nome do Volunt\u00e1rio;
politicaDoSiteLi6= E-Mail do Volunt\u00e1rio;
politicaDoSiteLi7= N\u00fameros de Telefone e WhatsApp do Volunt\u00e1rio;
politicaDoSiteLi8= Sexo do Volunt\u00e1rio;
politicaDoSiteLi9= Data de Nascimento do Volunt\u00e1rio;
politicaDoSiteLi10= Senha de usu\u00e1rio para uso dos servi\u00e7os de
politicaDoSiteLi11= Comunica\u00e7\u00e3o mantida entre o Volunt\u00e1rio e
politicaDoSiteLi12= Consumo de bebidas alco\u00f3licas;
politicaDoSiteLi13= Grau de instru\u00e7\u00e3o;
politicaDoSiteLi14= Emprego;
politicaDoSiteLi15= Gravidez.
politicaDoSiteH42= 1.2. Dados pessoais coletados automaticamente
politicaDoSiteLi17= Dados de navega\u00e7\u00e3o referente ao sistema usado.
politicaDoSiteH32= 2. Como coletamos os seus dados?
politicaDoSiteP9= Nesse sentido, a coleta dos seus dados pessoais ocorre da seguinte forma:
politicaDoSiteLi18= Formul\u00e1rios de coleta;
politicaDoSiteLi19= Cookies de navega\u00e7\u00e3o.
politicaDoSiteH43= 2.1. Consentimento
politicaDoSiteP10= \u00c9 a partir do seu consentimento que tratamos os seus dados pessoais. O consentimento \u00e9 a manifesta\u00e7\u00e3o livre, informada e inequ\u00edvoca pela qual voc\u00ea autoriza os sistemas
politicaDoSiteP102= a tratar seus dados.
politicaDoSiteP11= Assim, em conson\u00e2ncia com a
politicaDoSiteP111= Lei Geral de Prote\u00e7\u00e3o de Dados
politicaDoSiteP112= seus dados s\u00f3 ser\u00e3o coletados, tratados e armazenados mediante pr\u00e9vio e expresso consentimento.
politicaDoSiteP12= O seu consentimento ser\u00e1 obtido de forma espec\u00edfica para cada finalidade acima descrita, evidenciando o compromisso de transpar\u00eancia dos sistemas
politicaDoSiteP122= para com seus volunt\u00e1rios, seguindo as regula\u00e7\u00f5es legislativas pertinentes.
politicaDoSiteP13= Ao utilizar os servi\u00e7os dos sistemas
politicaDoSiteP132= e fornecer seus dados pessoais, voc\u00ea est\u00e1 ciente e consentindo com as disposi\u00e7\u00f5es desta Pol\u00edtica de Privacidade, al\u00e9m de conhecer seus direitos e como exerc\u00ea-los.
politicaDoSiteP14= A qualquer tempo e sem nenhum custo, voc\u00ea poder\u00e1 revogar seu consentimento.
politicaDoSiteP15= \u00c9 importante destacar que a revoga\u00e7\u00e3o do consentimento para o tratamento dos dados pode implicar a impossibilidade da performance adequada de alguma funcionalidade dos sistemas que dependa da opera\u00e7\u00e3o. Tais consequ\u00eancias ser\u00e3o informadas previamente.
politicaDoSiteH33= 3. Quais s\u00e3o os seus direitos?
politicaDoSiteP161= assegura a seus volunt\u00e1rios seus direitos de titular dos dados previstos no artigo 18 da
politicaDoSiteP163= Dessa forma, voc\u00ea pode, de maneira gratuita e a qualquer tempo:
politicaDoSiteLi20= Confirmar a exist\u00eancia de tratamento de dados, de maneira simplificada ou em formato claro e completo;
politicaDoSiteLi21= Acessar seus dados, podendo solicit\u00e1-los em uma c\u00f3pia leg\u00edvel sob forma impressa ou por meio eletr\u00f4nico, seguro e id\u00f4neo.
politicaDoSiteLi22= Corrigir seus dados, ao solicitar a edi\u00e7\u00e3o, corre\u00e7\u00e3o ou atualiza\u00e7\u00e3o destes.
politicaDoSiteLi23= Limitar seus dados quando desnecess\u00e1rios, excessivos ou tratados em desconformidade com a legisla\u00e7\u00e3o atrav\u00e9s da anonimiza\u00e7\u00e3o, bloqueio ou elimina\u00e7\u00e3o.
politicaDoSiteLi24= Solicitar a portabilidade de seus dados, atrav\u00e9s de um relat\u00f3rio de dados cadastrais que os sistemas
politicaDoSiteLi242= tratam a seu respeito.
politicaDoSiteLi25= Eliminar seus dados tratados a partir de seu consentimento, exceto nos casos previstos em lei.
politicaDoSiteLi26= Revogar seu consentimento, desautorizando o tratamento de seus dados.
politicaDoSiteLi27= Informar-se sobre a possibilidade de n\u00e3o fornecer seu consentimento e sobre as consequ\u00eancias da negativa.
politicaDoSiteH34= 4. Como voc\u00ea pode exercer seus direitos de titular?
politicaDoSiteP17= Para exercer seus direitos de titular, voc\u00ea deve entrar em contato com nossos respons\u00e1veis pelos sistemas
politicaDoSiteP18= De forma a garantir a sua correta identifica\u00e7\u00e3o como titular dos dados pessoais objeto da solicita\u00e7\u00e3o, \u00e9 poss\u00edvel que solicitemos documentos ou demais comprova\u00e7\u00f5es que possam comprovar sua identidade. Nessa hip\u00f3tese, voc\u00ea ser\u00e1 informado previamente.
politicaDoSiteH35= 5. Como e por quanto tempo seus dados ser\u00e3o armazenados?
politicaDoSiteP19= Seus dados pessoais coletados pelos sistemas
politicaDoSiteP192= ser\u00e3o utilizados e armazenados durante o tempo necess\u00e1rio para a presta\u00e7\u00e3o do servi\u00e7o, para avalia\u00e7\u00e3o da pesquisa ou para que as finalidades elencadas na presente Pol\u00edtica de Privacidade sejam atingidas, considerando os direitos dos titulares dos dados (volunt\u00e1rios) e dos controladores.
politicaDoSiteP20= De modo geral, seus dados ser\u00e3o mantidos enquanto a rela\u00e7\u00e3o contratual entre voc\u00ea e os sistemas
politicaDoSiteP202= perdurar. Findado o per\u00edodo de armazenamento dos dados pessoais, estes ser\u00e3o exclu\u00eddos de nossas bases de dados ou anonimizados, ressalvadas as hip\u00f3teses legalmente previstas no artigo 16 da Lei Geral de Prote\u00e7\u00e3o de Dados, a saber:
politicaDoSiteLi28= Cumprimento de obriga\u00e7\u00e3o legal ou regulat\u00f3ria pelo controlador;
politicaDoSiteLi29= Estudo por \u00f3rg\u00e3o de pesquisa, garantida, sempre que poss\u00edvel, a anonimiza\u00e7\u00e3o dos dados pessoais;
politicaDoSiteLi30= Transfer\u00eancia a terceiro, desde que respeitados os requisitos de tratamento de dados dispostos nesta Lei; ou
politicaDoSiteLi31= Uso exclusivo do controlador, vedado seu acesso por terceiro, e desde que anonimizados os dados.
politicaDoSiteP21= Isto \u00e9, informa\u00e7\u00f5es pessoais sobre voc\u00ea que sejam imprescind\u00edveis para o cumprimento de determina\u00e7\u00f5es legais, judiciais e administrativas e/ou para o exerc\u00edcio do direito de defesa em processos judiciais e administrativos ser\u00e3o mantidas, a despeito da exclus\u00e3o dos demais dados.
politicaDoSiteP22= O armazenamento de dados coletados pelos sistemas
politicaDoSiteP222= reflete o nosso compromisso com a seguran\u00e7a e privacidade dos seus dados. Empregamos medidas e solu\u00e7\u00f5es t\u00e9cnicas de prote\u00e7\u00e3o aptas a garantir a confidencialidade, integridade e inviolabilidade dos seus dados. Al\u00e9m disso, tamb\u00e9m contamos com medidas de seguran\u00e7a apropriadas aos riscos e com controle de acesso \u00e0s informa\u00e7\u00f5es armazenadas.
politicaDoSiteH36= 6. O que fazemos para manter seus dados seguros?
politicaDoSiteP23= Para mantermos suas informa\u00e7\u00f5es pessoais seguras, usamos ferramentas f\u00edsicas, eletr\u00f4nicas e gerenciais orientadas para a prote\u00e7\u00e3o da sua privacidade.
politicaDoSiteP24= Aplicamos essas ferramentas levando em considera\u00e7\u00e3o a natureza dos dados pessoais coletados, o contexto e a finalidade do tratamento e os riscos que eventuais viola\u00e7\u00f5es gerariam para os direitos e liberdades do titular dos dados coletados e tratados.
politicaDoSiteP25= Entre as medidas que adotamos, destacamos as seguintes:
politicaDoSiteLi32= Apenas pessoas autorizadas t\u00eam acesso a seus dados pessoais;
politicaDoSiteLi33= O acesso a seus dados pessoais \u00e9 feito somente ap\u00f3s o compromisso de confidencialidade;
politicaDoSiteLi34= Seus dados pessoais s\u00e3o armazenados em ambiente seguro e id\u00f4neo.
politicaDoSiteP261= se compromete a adotar as melhores posturas para evitar incidentes de seguran\u00e7a. Contudo, \u00e9 necess\u00e1rio destacar que nenhuma p\u00e1gina virtual \u00e9 inteiramente segura e livre de riscos. \u00c9 poss\u00edvel que, apesar de todos os nossos protocolos de seguran\u00e7a, problemas de culpa exclusivamente de terceiros ocorram, como ataques cibern\u00e9ticos de
politicaDoSiteP262= hackers
politicaDoSiteP263= ou tamb\u00e9m em decorr\u00eancia da neglig\u00eancia ou imprud\u00eancia do pr\u00f3prio usu\u00e1rio/cliente.
politicaDoSiteP27= Em caso de incidentes de seguran\u00e7a que possa gerar risco ou dano relevante para voc\u00ea ou qualquer um de nossos usu\u00e1rios/clientes, comunicaremos aos afetados e a Autoridade Nacional de Prote\u00e7\u00e3o de Dados sobre o ocorrido, em conson\u00e2ncia com as disposi\u00e7\u00f5es da
politicaDoSiteP271= Lei Geral de Prote\u00e7\u00e3o de Dados.
politicaDoSiteH37= 7. Com quem seus dados podem ser compartilhados?
politicaDoSiteP28= Tendo em vista a preserva\u00e7\u00e3o de sua privacidade, os sistemas
politicaDoSiteP282= n\u00e3o compartilhar\u00e3o seus dados pessoais com nenhum terceiro n\u00e3o autorizado.
politicaDoSiteP29= Al\u00e9m disso, tamb\u00e9m existem outras hip\u00f3teses em que seus dados poder\u00e3o ser compartilhados, que s\u00e3o:
politicaDoSiteLi35= Determina\u00e7\u00e3o legal, requerimento, requisi\u00e7\u00e3o ou ordem judicial, com autoridades judiciais, administrativas ou governamentais competentes.
politicaDoSiteLi36= Prote\u00e7\u00e3o dos direitos de
politicaDoSiteLi362= em qualquer tipo de conflito, inclusive os de teor judicial.
politicaDoSiteH38= 8. Cookies ou dados de navega\u00e7\u00e3o
politicaDoSiteP30= Os sistemas
politicaDoSiteP302= fazem uso de Cookies, que s\u00e3o arquivos de texto enviados pela plataforma ao seu computador e que nele se armazenam, que cont\u00e9m informa\u00e7\u00f5es relacionadas \u00e0 navega\u00e7\u00e3o dos sites.
politicaDoSiteP303= Os cookies n\u00e3o armazenam dados pessoais sens\u00edveis, apenas dados anonimizados referentes \u00e0 navega\u00e7\u00e3o dos sites
politicaDoSiteP304= Em suma, os Cookies s\u00e3o utilizados para aprimorar a experi\u00eancia de uso do respectivo sistema.
politicaDoSiteP31= Ao acessar nossos sistemas e consentir com o uso de Cookies, voc\u00ea manifesta conhecer e aceitar a utiliza\u00e7\u00e3o de um sistema de coleta de dados de navega\u00e7\u00e3o com o uso de Cookies em seu dispositivo.
politicaDoSiteP322= utilizam os seguintes Cookies:
politicaDoSiteLi37= Cookies essenciais: S\u00e3o cookies referentes \u00e0s informa\u00e7\u00f5es de uso e navega\u00e7\u00e3o pelo usu\u00e1rio, coletadas pelos pr\u00f3prios sistemas com a finalidade de melhorar a experi\u00eancia, o uso e a performance do uso dos mesmos. Todos os cookies coletados pelos sistemas
politicaDoSiteLi372= s\u00e3o Cookies persistentes, ou seja, que possuem um tempo de vida pr\u00e9-definidos e expiram ap\u00f3s chegar na sua data de validade; e Cookies de sess\u00e3o, que apenas existem e perduram enquanto o usu\u00e1rio estiver com o navegador aberto.
politicaDoSiteP33= Nossos sistemas possuem links e produtos que redirecionam o usu\u00e1rio para outros dom\u00ednios de website ou que oferecem ao usu\u00e1rio um servi\u00e7o de terceiros dentro do nossos pr\u00f3prios sistemas. Ao interagir com esses links e produtos de terceiros, s\u00e3o gerados cookies por meio desses terceiros.
politicaDoSiteP331= \u00c1lcool e Sa\u00fade n\u00e3o se responsabiliza pelo compartilhamento de dados do usu\u00e1rio a terceiros, bem como a gera\u00e7\u00e3o dos cookies por esses
politicaDoSiteP332= Recomendamos que voc\u00ea leia sobre a pol\u00edtica de privacidade e uso dos dados desses terceiros antes de usar seus servi\u00e7os ou acessar seus dom\u00ednios.
politicaDoSiteP34= Voc\u00ea pode, a qualquer tempo e sem nenhum custo, alterar as permiss\u00f5es, bloquear ou recusar os Cookies. Todavia, a revoga\u00e7\u00e3o do consentimento de determinados Cookies pode inviabilizar o funcionamento correto de alguns recursos da plataforma. Voc\u00ea pode gerenciar as permiss\u00f5es de Cookies em seu navegador ou aplicativo.
politicaDoSiteH39= 9. Altera\u00e7\u00e3o desta Pol\u00edtica de Privacidade
politicaDoSiteP35= A atual vers\u00e3o da Pol\u00edtica de Privacidade foi formulada e atualizada pela \u00faltima vez em:
politicaDoSiteP351= 15 de janeiro de 2025
politicaDoSiteP36= Reservamos o direito de modificar essa Pol\u00edtica de Privacidade a qualquer tempo, principalmente em fun\u00e7\u00e3o da adequa\u00e7\u00e3o a eventuais altera\u00e7\u00f5es feitas em nossos sistemas ou em \u00e2mbito legislativo. Recomendamos que voc\u00ea a revise com frequ\u00eancia.
politicaDoSiteP37= Eventuais altera\u00e7\u00f5es entrar\u00e3o em vigor a partir de sua publica\u00e7\u00e3o em nossos sistemas e lhe notificaremos acerca das mudan\u00e7as ocorridas.
politicaDoSiteP38= Ao utilizar nossos servi\u00e7os e fornecer seus dados pessoais ap\u00f3s tais modifica\u00e7\u00f5es, voc\u00ea as consente.
politicaDoSiteH310= 10. Responsabilidade
politicaDoSiteP392= preveem a responsabilidade dos agentes que atuam nos processos de tratamento de dados, em conformidade com os artigos 42 ao 45 da Lei Geral de Prote\u00e7\u00e3o de Dados.
politicaDoSiteP40= Nos comprometemos em manter esta Pol\u00edtica de Privacidade atualizada, observando suas disposi\u00e7\u00f5es e zelando por seu cumprimento.
politicaDoSiteP421= Autoridade Nacional de Prote\u00e7\u00e3o de Dados
politicaDoSiteP422= exija a ado\u00e7\u00e3o de provid\u00eancias em rela\u00e7\u00e3o ao tratamento de dados realizado por
politicaDoSiteP424= comprometemo-nos a segui-las.
politicaDoSiteH44= 10.1 Isen\u00e7\u00e3o de responsabilidade
politicaDoSiteP432= n\u00e3o se responsabiliza por:
politicaDoSiteLi38= Quaisquer consequ\u00eancias decorrentes da neglig\u00eancia, imprud\u00eancia ou imper\u00edcia dos usu\u00e1rios em rela\u00e7\u00e3o a seus dados individuais. Garantimos e nos responsabilizamos apenas pela seguran\u00e7a dos processos de tratamento de dados e do cumprimento das finalidades descritas no presente instrumento.
politicaDoSiteP44= Destacamos que a responsabilidade em rela\u00e7\u00e3o \u00e0 confidencialidade dos dados de acesso \u00e9 do usu\u00e1rio.
politicaDoSiteLi39= A\u00e7\u00f5es maliciosas de terceiros, como ataques de hackers, exceto se comprovada conduta culposa ou deliberada de
politicaDoSiteP45= Destacamos que em caso de incidentes de seguran\u00e7a que possam gerar risco ou dano relevante para voc\u00ea ou qualquer um de nossos usu\u00e1rios/clientes, comunicaremos aos afetados e a
politicaDoSiteP452= sobre o ocorrido e cumpriremos as provid\u00eancias necess\u00e1rias.
politicaDoSiteLi40= Inveracidade das informa\u00e7\u00f5es inseridas pelo usu\u00e1rio/cliente nos registros necess\u00e1rios para a utiliza\u00e7\u00e3o dos servi\u00e7os de
politicaDoSiteLi402= quaisquer consequ\u00eancias decorrentes de informa\u00e7\u00f5es falsas ou inseridas de m\u00e1-f\u00e9 s\u00e3o de inteiramente responsabilidade do volunt\u00e1rio.
politicaDoSiteH311= 11. Encarregado de Prote\u00e7\u00e3o de Dados
politicaDoSiteP462= disponibilizam os seguintes meios para que voc\u00ea possa entrar em contato conosco para exercer seus direitos de titular:
politicaDoSiteLi41Link= projeto.alcoolesaude@ufjf.br
politicaDoSiteP47= Caso tenha d\u00favidas sobre esta Pol\u00edtica de Privacidade ou sobre os dados pessoais que tratamos, voc\u00ea pode entrar em contato com o nosso Encarregado de Prote\u00e7\u00e3o de Dados Pessoais, atrav\u00e9s dos seguintes canais:
politicaDoSiteLi42= Heder Soares Bernardino

preparandoDiminuirPararTitle1= Pronto para mudar ? | \u00c1lcool & Sa\u00fade
