pregnantAdultDrink02= Cuidado!
pregnantAdultDrink03= Voc\u00ea relatou fazer consumo de \u00e1lcool - o que \u00e9 prejudicial para o bom desenvolvimento do seu beb\u00ea. \u00c9 fundamental que permane\u00e7a sem beber durante toda a gravidez e mesmo durante o per\u00edodo em que estiver amamentando. Recomendamos fortemente que pare de beber e que procure assim que poss\u00edvel um profissional de sa\u00fade que possa ajud\u00e1-la. Este ainda n\u00e3o possui ferramentas espec\u00edficas para gestantes.
pregnantAdultDrink05= N\u00e3o, voc\u00ea n\u00e3o pode. N\u00e3o consuma \u00e1lcool caso esteja ou possa estar gr\u00e1vida. O \u00e1lcool que voc\u00ea consome afeta o desenvolvimento do seu bebe
pregnantAdultDrink06= Eu posso consumir bebidas alco\u00f3licas se estiver gr\u00e1vida?
pregnantAdultDrink07= N\u00e3o, n\u00e3o existe. Toda a bebida que cont\u00e9m \u00e1lcool, mesmo que em menor quantidade, pode prejudicar o se beb\u00ea. Por bebidas alco\u00f3licas estamos nos referindo \u00e0 todas, mesmo cerveja, vinho, coquet\u00e9is, 'ice' ou qualquer outra mistura que contenha \u00e1lcool
pregnantAdultDrink08= Existe algum tipo de bebida alco\u00f3lica que \u00e9 segura para ser usada durante a gravidez?
pregnantAdultDrink09= N\u00e3o, cada gesta\u00e7\u00e3o \u00e9 diferente. O consumo de \u00e1lcool pode prejudicar mais um beb\u00ea do que outro.Voc\u00ea poderia ter tido uma crian\u00e7a que nasceu saud\u00e1vel, mas tamb\u00e9m poderia ter tido uma crian\u00e7a nascida com problemas
pregnantAdultDrink10= Caso tenha bebido durante minha \u00faltima gesta\u00e7\u00e3o e n\u00e3o tive problemas. Tudo bem beber desta vez?
pregnantAdultDrink11= N\u00e3o, os problemas afetar o desenvolvimento de sua crian\u00e7a.Em alguns casos mais graves, mesmo quando adulto sua crian\u00e7a precisar\u00e1 de cuidados especiais
pregnantAdultDrink12= Os problemas que meu beb\u00ea pode ter por eu ter bebido v\u00e3o melhorar com o tempo?
pregnantAdultDrink13= Caso tenha bebido \u00e1lcool antes de saber que estava gr\u00e1vida, para de beber agora e procure um profissional de sa\u00fade. Voc\u00ea se sentir\u00e1 melhor e o seu beb\u00ea ter\u00e1 uma grande chance de nascer saud\u00e1vel.Caso esteja com suspeita de estar gr\u00e1vida - n\u00e3o beba \u00e1lcool. Mesmo caso esteja tentando engravidar, n\u00e3o beba \u00e1lcool, pois voc\u00ea pode j\u00e1 estar gr\u00e1vida e n\u00e3o saber. Mesmos nos dois primeiros meses o \u00e1lcool pode prejudicar o seu beb\u00ea
pregnantAdultDrink14= O que eu fa\u00e7o se estou gr\u00e1vida, mas mesmo assim tenho bebido?
pregnantAdultDrink15= Recomendamos em seu caso que procure um profissional de sa\u00fade para ajud\u00e1-la. O conte\u00fado deste site n\u00e3o foi desenvolvido especialmente para gestantes, mas algumas dicas podem ser \u00fateis: Saiba que existem diversos meios para ajud\u00e1-la a parar de beber; Caso algu\u00e9m lhe ofere\u00e7a bebida, sempre diga 'n\u00e3o obrigada', de forma educada e direta; Procure manter-se longe de pessoas ou lugares que fazem com que voc\u00ea beba; N\u00e3o guarde bebidas alco\u00f3licas em casa; Caso voc\u00ea n\u00e3o consiga parar de beber procure um profissional de sa\u00fade e pe\u00e7a ajuda; Caso n\u00e3o tenha acesso \u00e0 um profissional de sa\u00fade utilize o Viva Voz (Disque 132 - liga\u00e7\u00e3o gratuita)
pregnantAdultDrink16= Como eu fa\u00e7o para parar de beber?
pregnantAdultNotDrink01= Informa\u00e7\u00f5es para gestantes
pregnantAdultNotDrink03= Voc\u00ea relatou n\u00e3o fazer consumo de \u00e1lcool e que \u00e9 fundamental para o bom desenvolvimento de um beb\u00ea. \u00c9 fundamental que permane\u00e7a sem beber durante toda a gravidez e mesmo durante o per\u00edodo em que estiver amamentando. Caso tenha d\u00favidas procure um profissional de sa\u00fade.
pregnantAdultNotDrink04= D\u00favidas frequentes entre gestantes:
pregnantTeenDrink02= Cuidado - voc\u00ea e seu futuro beb\u00ea est\u00e3o em risco!
pregnantTeenDrink03= Voc\u00ea relatou beber e que pode estar gr\u00e1vida - O consumo de \u00e1lcool \u00e9 muito prejudicial para adolescentes e extremamente prejudicial para o bom desenvolvimento do seu beb\u00ea. Toda gravidez na adolesc\u00eancia pode ser considerada uma gravidez de risco - Procure um profissional de sa\u00fade para obter mais orienta\u00e7\u00f5es sobre quais cuidados deve tomar. Recomendamos fortemente que pare de beber e que procure, assim que poss\u00edvel, um profissional de sa\u00fade que possa ajud\u00e1-la. Este aplicativo ainda n\u00e3o possui ferramentas espec\u00edficas para gestantes e para adolescentes
pregnantTeenDrink04= Recomendamos que leia as perguntas e resposas sobre \u00e1lcool e gravidez na adolescencia abaixo, elas podem lhe ajudar
pregnantTeenNotDrink02= Parab\u00e9ns por n\u00e3o consumir \u00e1lcool! Cuidado: toda gravidez na adolesc\u00eancia \u00e9 considerada como de risco, mesmo que voc\u00ea n\u00e3o consuma \u00e1lcool.
pregnantTeenNotDrink03= A adolec\u00eancia \u00e9 um per\u00edodo \u00fanico para o desenvolvimento do c\u00e9rebro. Estudos apontam que mesmo os adolecentes que consomem \u00e1lcool a pouco tempo, podem ter uma diminui\u00e7\u00e3o do volume do c\u00e9rebro. Ao longo do tempo, adolescentes que consomem \u00e1lcool podem temb\u00e9m ter maiores dificuldades para resolver problemas de exigem o uso de racioc\u00ednio. Ao evirar consumir \u00e1lcool voc\u00ea n\u00e3o s\u00f3 preserva o seu c\u00e9rebro por mais tempo, como tamb\u00e9m evita outros poss\u00edveis danos que podem estar associados com problemas de sa\u00fade, acidentes, brigas e discuss\u00f5es.
pregnantTeenNotDrink04= Aprender a se divertir e aproveitar a vida de forma saud\u00e1vel \u00e9 sempre uma escolha boa!
pregnantTeenNotDrink05= Caso tenha d\u00favidas ou venha a consumir \u00e1lcool no futuro procure um profissional de sa\u00fade e converse sobre este assunto
pregnantTeenNotDrink06= D\u00favidas frequentes entre adolescentes
pregnantTeenNotDrink07= O consumo de \u00e1lcool est\u00e1 associado com uma s\u00e9rie de problemas. Muitos destes problemas demoram para aparecer e outros s\u00e3o mais vis\u00edveis.Problemas de sa\u00fade, legais e acidentes est\u00e3o associados com o consumo de \u00e1lcool. Adolescentes e adultos podem ter o seu desenvolvimento prejudicado pelo \u00e1lcool, reduzindo seu desempenho em esportes, estudo e trabalho
pregnantTeenNotDrink08= Por que devo continuar sem beber?
pregnantTeenNotDrink09= Recomendamos em seu caso esteja considerando experimentar \u00e1lcool ou come\u00e7ar a beber que procure um profissional de sa\u00fade para se informar melhor. N\u00e3o recomendamos que comece a beber no momento, adolescentes est\u00e3o muito mais expostos \u00e0s consequ\u00eancias negativas relacionados ao consumo do \u00e1lcool. O conte\u00fado deste site n\u00e3o foi desenvolvido especialmente para adolescentes, mas algumas dicas podem ser \u00fateis: \n Saiba que existem diversos meios para resistir a press\u00e3o de beber; Sempre procure ajuda ou apoio quando estiver sentindo-se sob press\u00e3o em rela\u00e7\u00e3o \u00e0 este assunto; \n Caso algu\u00e9m lhe ofere\u00e7a bebida, sempre diga 'n\u00e3o obrigada', de forma educada e direta. Isso demonstra for\u00e7a e determina\u00e7\u00e3o. Procure manter-se longe de pessoas ou lugares que o pressionam a come\u00e7ar a beber. Caso n\u00e3o consiga resistir e venha a consumir \u00e1lcool o quanto antes conseguir parar menores ser\u00e3o os efeitos negativos do consumo - procure um profissional de sa\u00fade e pe\u00e7a ajuda
pregnantTeenNotDrink10= Caso eu n\u00e3o beba, mas esteja pensando em experimentar?
