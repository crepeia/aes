quantoVoceBebeBeberUsoSintAlcoolDoencaHOutputtext3= 03 - teve que beber muito mais do que costumava para conseguir os efeitos que queria ? Ou achou que a quantidade que voc\u00ea costuma beber teve um efeito muito menor do que antes
quantoVoceBebeBeberUsoSintAlcoolDoencaHOutputtext4= 04 - continuou a beber apesar disso lhe fazer se sentir deprimido ou ansioso ou mesmo aumentando um outro problema de sa\u00fade? Ou depois de ter um esquecido o que fez por ter bebido?
quantoVoceBebeBeberUsoSintAlcoolDoencaHOutputtext5= 05 - gastou muito tempo bebendo ? ou passando mal ou mesmo se recuperando por ter bebido
quantoVoceBebeBeberUsoSintAlcoolDoencaHOutputtext6= 06 - continuou a beber mesmo que isso estivesse causando problema com sua fam\u00edlia ou amigos?
quantoVoceBebeBeberUsoSintAlcoolDoencaHOutputtext7= 07 - notou que beber ou estar passando mal por ter bebido frequentemente interferiu na forma que voc\u00ea cuidava de sua casa ou fam\u00edlia ? Ou causou problemas no trabalho ? Ou problemas relacionados aos estudos?
quantoVoceBebeBeberUsoSintAlcoolDoencaHOutputtext8= 08 - mais de uma vez foi preso ou detido em uma delegacia, ou teve outros problemas relacionados com a bebida
quantoVoceBebeBeberUsoSintAlcoolDoencaHOutputtext9= 09 - percebeu que depois que os efeitos do \u00e1lcool passaram voc\u00ea teve sintomas de abstin\u00eancia, tais como problemas para dormir, tremores, exaust\u00e3o, n\u00e1useas, sudorese, taquicardia ou convuls\u00f5es? Ou sentiu coisas que n\u00e3o est\u00e3o aqui?
