tcleHelpText1= Participe da pesquisa de coletada de dados e nos ajude!!
tcleHelpText2= Ao participar voc\u00ea ir\u00e1 receber, diariamaente, uma notifica\u00e7\u00e3o contendo uma pergunta.
tcleHelpText3= Para participar, basta clicar no bot\u00e3o "Participar da pesquisa" e escolher que horas deseja receber as notifica\u00e7\u00f5es para come\u00e7ar a participar.
tcleHelpText4= Para mais informa\u00e7\u00f5es e para ter acesso ao Termo de Consentimento Livre e Esclarecido, clique na palavra "Termo de Consentimento Livre e Esclarecido".
