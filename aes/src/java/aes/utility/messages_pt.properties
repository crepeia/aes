tip.description.1=Beba um copo de \u00e1gua ou refrigerante ap\u00f3s cada bebida alco\u00f3lica. Voc\u00ea sentir\u00e1 menos vontade de beber.
tip.description.2=Nunca beba direto da garrafa. Assim, voc\u00ea n\u00e3o consegue controlar quanto est\u00e1 bebendo.
tip.description.5=N\u00e3o h\u00e1 problema em recusar uma bebida alco\u00f3lica! Lembre-se disso\u2026
tip.description.6=Defina o n\u00famero m\u00e1ximo de doses por semana - Siga sua meta para obter melhores resultados.
tip.description.8=Fique pelo menos 2 dias por semana sem beber \u00e1lcool. Isso reduz o h\u00e1bito e ajuda seu corpo a se recuperar.
tip.description.11=N\u00e3o beba quando estiver triste ou com raiva. O \u00e1lcool pode piorar seus problemas.
tip.description.16=As pessoas admiram quem tenta ser mais saud\u00e1vel. N\u00e3o tenha vergonha de dizer que est\u00e1 reduzindo o consumo.
tip.description.17=Tente estar com pessoas que n\u00e3o bebem em excesso.
tip.description.18=Evite lugares, pessoas e alimentos associados ao \u00e1lcool.
tip.description.20=Preste aten\u00e7\u00e3o aos coment\u00e1rios das pessoas sobre seu consumo.
tip.description.21=N\u00e3o desista dos seus objetivos.
tip.description.22=Evite manter bebidas alco\u00f3licas em casa.
tip.description.24=D\u00ea pelo menos seis goles para terminar sua bebida.
tip.description.25=Evite misturar diferentes tipos de bebida.
tip.description.26=Acesse seu di\u00e1rio eletr\u00f4nico quando sentir vontade de beber.
tip.description.30=Quem gosta de voc\u00ea continuar\u00e1 ao seu lado.
tip.description.31=Registre quanto voc\u00ea bebe por semana.
tip.description.32=Reduzir o consumo pode n\u00e3o ser f\u00e1cil.
tip.description.35=Busque alternativas melhores para seu tempo.
tip.description.39=Evite pessoas com quem voc\u00ea costuma beber muito.
tip.description.40=Pe\u00e7a apoio de amigos e familiares.
tip.description.41=Pratique dizer N\u00c3O.
tip.description.44=Evite atividades sociais com \u00e1lcool.
tip.description.46=Evite beber pela manh\u00e3.
tip.description.47=Coma antes ou enquanto bebe.
tip.description.48=Defina limites e n\u00e3o os ultrapasse.
tip.description.50=N\u00e3o desista se falhar na primeira tentativa.
tip.description.52=Ao sentir tontura, fa\u00e7a uma pausa.
tip.description.53=A melhor forma de evitar ressaca \u00e9 beber menos.
tip.description.56=Inclua atividade f\u00edsica no seu dia.
tip.description.57=Desenvolva um hobby.
tip.description.58=Fa\u00e7a exerc\u00edcios de respira\u00e7\u00e3o.
tip.description.59=Evite locais com \u00e1lcool.
tip.description.60=Recompense-se por pequenas conquistas.
tip.description.61=Reduza o estresse sem \u00e1lcool.
tip.description.65=Mantenha pensamentos positivos.
tip.description.67=Defina metas realistas.
