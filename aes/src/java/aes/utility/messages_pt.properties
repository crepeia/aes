prontoFisImg= Fissura
prontoFisP1= A vontade de fumar - ou fissura - \u00e9 muito comum nas pessoas que est\u00e3o parando de fumar.
prontoFisP2= Cada epis\u00f3dio dura em m\u00e9dia 5 minutos, diminuindo muito ou desaparecendo depois.
prontoFisP3= Existem t\u00e9cnicas que podem ajudar voc\u00ea a enfrentar a fissura.
