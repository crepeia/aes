preparingDecreaseOrStop03= Parar de Beber


preparandoDiminuirPararNaoTitle1= Voc\u00ea ainda n\u00e3o est\u00e1 pensando em mudar ? | \u00c1lcool & Sa\u00fade
preparandoDiminuirH11= Voc\u00ea ainda n\u00e3o est\u00e1 pensando em mudar
preparandoDiminuirP1= Apesar do \u00e1lcool poder ser causa de problemas, voc\u00ea respondeu que ainda n\u00e3o est\u00e1 preparado(a) para mudar
preparingDecreaseStopNo01= Considere durante este per\u00edodo as seguintes sugest\u00f5es
preparandoDiminuirLi1= Continue prestando aten\u00e7\u00e3o no quanto tem bebido, considerando a frequ\u00eancia e e quantidade
preparandoDiminuirLi2= Procure compreender o quanto o \u00e1lcool afeta voc\u00ea
preparandoDiminuirLi3= Lide com outras prioridades que possam estar no caminho da sua mudan\u00e7a
preparandoDiminuirLi4= Pe\u00e7a ajuda de um amigo, profissional de sa\u00fade ou outra pessoa que voc\u00ea confie
preparandoDiminuirLi5= Refa\u00e7a a avalia\u00e7\u00e3o no site, considere principalmente os pr\u00f3s e contras de mudar
preparingDecreaseStopNo07= Preven\u00e7\u00e3o - n\u00e3o espere por um problema maior ou mais grave
preparandoDiminuirLi7= Quando mais cedo mudamos maiores s\u00e3o nossas chances de sucesso e menores s\u00e3o os danos para o individuo e seus familiares
preparingDecreaseStopNo09= Voc\u00ea gostaria de voltar ao programa e elaborar plano de mudan\u00e7a que possa lhe auxiliar?

termoConsentimentoTitle1= Termo de Consentimento | \u00c1lcool & Sa\u00fade
tcleOptionTerm= Termo de Consentimento Livre e Esclarecido
termoConsentimentoP1A= O Sr.(a) est\u00e1 sendo convidado (a) como volunt\u00e1rio (a) a participar de parte da pesquisa \u201cInformalcool -  Avalia\u00e7\u00e3o da efetividade de interven\u00e7\u00f5es breves para a redu\u00e7\u00e3o do consumo de \u00e1lcool assistidas por computador\u201d.
termoConsentimento03= Ressaltamos que seus dados ser\u00e3o tratados com o mais absoluto sigilo e que em momento nenhum seus dados ser\u00e3o repassados a terceiros. Avaliar os dados dos usu\u00e1rios do site \u00e9 importante para que possamos construir ferramentas de interven\u00e7\u00e3o cada vez mais elaboradas.
termoConsentimento04= Neste estudo pretendemos avaliar a efetividade de diferentes interven\u00e7\u00f5es virtuais para redu\u00e7\u00e3o do consumo de \u00e1lcool.
termoConsentimento05= O motivo que nos leva a estudar esse assunto \u00e9 a relev\u00e2ncia em termos de sa\u00fade p\u00fablica dos danos associados ao consumo de \u00e1lcool que poderiam ser evitados atrav\u00e9s de interven\u00e7\u00f5es mediadas por computador, como vem sendo demonstrado em diversos pa\u00edses do mundo (Holanda, Inglaterra, Su\u00e9cia, M\u00e9xico, \u00cdndia e Bielor\u00fassia).
termoConsentimentoP3= Os procedimentos ser\u00e3o realizados da seguinte maneira: avaliaremos as respostas fornecidas por cada usu\u00e1rio durante a navega\u00e7\u00e3o no site, as pontua\u00e7\u00f5es do AUDIT e dos question\u00e1rios utilizados, perman\u00eancia no site.
termoConsentimento07= Para participar deste estudo
termoConsentimentoP4b= voc\u00ea n\u00e3o ter\u00e1 nenhum custo,
termoConsentimentoP4c= nem receber\u00e1 qualquer vantagem financeira.
termoConsentimento08= Voc\u00ea ser\u00e1 esclarecido (a) sobre o estudo em qualquer aspecto que desejar e estar\u00e1 livre para participar ou recusar-se a participar.
termoConsentimentoP5b= Poder\u00e1 retirar seu consentimento ou interromper a participa\u00e7\u00e3o a qualquer momento.
termoConsentimento09= A sua participa\u00e7\u00e3o \u00e9 volunt\u00e1ria e a recusa em participar n\u00e3o acarretar\u00e1 qualquer penalidade ou modifica\u00e7\u00e3o na forma em que \u00e9 atendido (a) pelo pesquisador. O pesquisador ir\u00e1 tratar a sua identidade com padr\u00f5es profissionais de
termoConsentimento091= sigilo.
termoConsentimento10= Mais uma vez ressaltamos que
termoConsentimento11= voc\u00ea n\u00e3o ser\u00e1 identificado
termoConsentimentoP6d= em nenhuma publica\u00e7\u00e3o que possa resultar deste estudo. Este estudo apresenta risco m\u00ednimo, isto \u00e9, o mesmo risco existente em atividades rotineiras como conversar, tomar banho, ler, etc. Apesar disso, voc\u00ea tem assegurado o direito a  ressarcimento ou indeniza\u00e7\u00e3o no caso de quaisquer danos eventualmente produzidos pela pesquisa.
termoConsentimentoP7= Os dados e instrumentos utilizados na pesquisa ficar\u00e3o arquivados com o pesquisador respons\u00e1vel por um per\u00edodo de 5 anos, e ap\u00f3s esse tempo ser\u00e3o destru\u00eddos.
termoConsentimento14= Eu fui informado(a) dos objetivos do presente estudo de maneira clara e detalhada e esclareci minhas d\u00favidas. Sei que a qualquer momento poderei solicitar novas informa\u00e7\u00f5es e modificar minha decis\u00e3o de participar se assim o desejar.
termoConsentimento15= Declaro que concordo em participar desse estudo.
termoConsentimentoP9= CADASTRAR

termosDeUsoP2= Este site foi desenvolvido com intuito de ser um servi\u00e7o p\u00fablico, ofertando informa\u00e7\u00f5es e um programa para ajudar que pessoas fazem consumo de risco de \u00e1lcool.
termosUso04= O programa \u00e9 complementar as abordagens tradicionais que tem por objetivo ajudar pessoas a beberem menos e
termosUso05= n\u00e3o
termosUso06= substitui a consulta com profissionais de sa\u00fade.
termosDeUsoP4= O programa \u00e9 de
termosDeUsoP41= car\u00e1ter experimental e ser\u00e1 testado quanto sua efic\u00e1cia cl\u00ednica
termosDeUsoP5= Algumas das p\u00e1ginas do site s\u00e3o de livre acesso a todos os visitantes, no entanto, o acesso ao programa requer a realiza\u00e7\u00e3o de um cadastro gratuito. Caso exista interesse por parte do usu\u00e1rio, \u00e9 necess\u00e1rio escolher um nome de usu\u00e1rio e uma senha. O nome de usu\u00e1rio e senha devem ser mantidos em sigilo e n\u00e3o devem ser compartilhados com qualquer outro usu\u00e1rio. Os visitantes s\u00e3o solicitados a n\u00e3o divulgarem o nome de usu\u00e1rio e senha para terceiros.
termosDeUsoP6= Todos os esfor\u00e7os foram realizados para garantir que as informa\u00e7\u00f5es e materiais contidos neste site s\u00e3o completamente verdadeiros e n\u00e3o danosos. Os materiais e informa\u00e7\u00f5es disponibilizadas foram avaliados por especialistas na preven\u00e7\u00e3o do consumo abusivo de \u00e1lcool e pessoas que j\u00e1 utilizaram a estrat\u00e9gia de beber menos.
termosDeUsoObject1= gpl

quemSomosOsAutoresH13= Equipe
quemSomosOsAutoresH14= Ex-integrantes da equipe
quemSomosOsAutoresP1= O projeto \u00c1lcool & Sa\u00fade foi criado pela linha de pesquisa de e-sa\u00fade do
quemSomosOsAutoresP1A= - em parceria com o Departamento de Ci\u00eancias da Computa\u00e7\u00e3o da
quemSomosOsAutoresP2A= e o
quemSomosOsAutoresP2A1= CNPQ - Ci\u00eancias sem Fronteiras.
quemSomosOsAutoresP3= Ex-coordenador do CREPEIA, Mestre em Psicologia Social (UFMG), Doutor em Ci\u00eancias da Sa\u00fade (Unifesp), P\u00f3s-Doutor em \u00c1lcool e Drogas (University of Connecticut Health Center e USP). Pesquisador do CNPq.
quemSomosOsAutoresP4= Professora de Psicologia da UFJF. Coordenadora do Centro de Refer\u00eancia em Pesquisa, Interven\u00e7\u00e3o e Avalia\u00e7\u00e3o em \u00c1lcool e outras Drogas (CREPEIA). Doutora em Ci\u00eancias, P\u00f3s-Doutora em Public Health Sciences pela University of Rochester. Seus principais temas de trabalho e pesquisa s\u00e3o: psicoterapia, interven\u00e7\u00f5es online para usu\u00e1rios de subst\u00e2ncias, estudos cl\u00ednicos baseados na Terapia Cognitivo-Comportamental e valida\u00e7\u00e3o de instrumentos.
quemSomosOsAutoresP6= Engenheiro de Aprendizagem de M\u00e1quina na BairesDev e Consultor em Ci\u00eancia de Dados na Zetta Health Analytics. Ex-professor do departamento de Educa\u00e7\u00e3o da Universidade Federal de Vi\u00e7osa. Doutor em Psicologia no tema interven\u00e7\u00f5es digitais pela Universidade Federal de Juiz de Fora (UFJF) com est\u00e1gio sandu\u00edche na University of Kansas Medical Center.
quemSomosOsAutoresP7= S\u00f3cio Fundador e Cientista Chefe da Evakub. Psic\u00f3logo (Universidade Federal de Juiz de Fora), mestre e doutor em Psicologia da UFJF (conceito 5 da Capes) Universidade Federal de Juiz de Fora com bolsa Sandwich/CAPES para est\u00e1gio de pesquisa no exterior na University of Kansas Medical Center, 2017. Est\u00e1gio de P\u00f3s-doutorado em curso na Universidade Federal do Rio Grande do Norte com bolsa CNPq. Professor do Departamento de Psicologia da PUC-RIO. Professor do Quadro Principal e orientador de Mestrado e Doutorado do Programa de P\u00f3s-Gradua\u00e7\u00e3o em Psicologia Cl\u00ednica da PUC-RIO (conceito 6 da Capes).
quemSomosOsAutoresP8= Psic\u00f3loga cl\u00ednica com \u00eanfase no atendimento de crian\u00e7as e adolescentes e orienta\u00e7\u00e3o e treinamento de pais. Possui gradua\u00e7\u00e3o em Psicologia pela Universidade Federal de Juiz de Fora (UFJF), mestrado e doutorado pelo departamento de p\u00f3s-gradua\u00e7\u00e3o em Psicologia da UFJF. Tem forma\u00e7\u00e3o em Terapia Cognitivo-Comportamental pela Associa\u00e7\u00e3o de Terapias Cognitivas do Estado do Rio de Janeiro (ATC-RIO) e p\u00f3s-gradua\u00e7\u00e3o em Terapia Cognitivo-Comportamental com Crian\u00e7as e Adolescentes pela faculdade Redentor.
quemSomosOsAutoresP9= Graduada em Engenharia Computacional.
quemSomosOsAutoresP10= Mestre em Ci\u00eancia da Computa\u00e7\u00e3o pela Universidade Federal do ABC e Cientista de Dados no Ita\u00fa Unibanco. Bacharel em Ci\u00eancias Exatas e em Ci\u00eancia da Computa\u00e7\u00e3o pela Universidade Federal de Juiz de Fora (2016) com per\u00edodo sandu\u00edche na University of Glasgow (2015)
quemSomosOsAutoresP11= Doutora em Psicologia pela Universidade Federal de Juiz de Fora com per\u00edodo sandu\u00edche pela Capes na University of Kansas Medical Center (Kansas, EUA). Pos-doutoranda no TSET Health Promotion Research Center, na University of Oklahoma Health Sciences Center (Oklahoma, EUA). Especialista em tratamento do tabagismo - Tobacco Treatment Specialist training (TTS) pela KU Medical Center (Kansas, EUA).
quemSomosOsAutoresP12= Cientista da Computa\u00e7\u00e3o com mestrado em Modelagem Computacional e especializa\u00e7\u00e3o em Aprendizado de M\u00e1quina.
quemSomosOsAutoresP13= Analista de Sistemas com foco em An\u00e1lise de Dados. Cursando p\u00f3s-gradua\u00e7\u00e3o em Analytics e Business Intelligence, Mestra em Comunica\u00e7\u00e3o pela UFJF, com especializa\u00e7\u00e3o em Cria\u00e7\u00e3o Publicit\u00e1ria, possui duas gradua\u00e7\u00f5es, Comunica\u00e7\u00e3o (2014) e An\u00e1lise e Desenvolvimento de Sistemas (2019).
quemSomosOsAutoresP14= Professor de Ci\u00eancia da Computa\u00e7\u00e3o na UFJF. Doutor em Inform\u00e1tica pela PUC-RJ e membro do Laborat\u00f3rio de Aplica\u00e7\u00f5es Inovadoras em Computa\u00e7\u00e3o (LApIC), onde pesquisa sobre Processamento de Linguagem Natural, Recupera\u00e7\u00e3o de Informa\u00e7\u00e3o e Intelig\u00eancia Artificial na Educa\u00e7\u00e3o. Possui atua\u00e7\u00e3o em projetos de desenvolvimento tecnol\u00f3gico e inova\u00e7\u00e3o na \u00e1rea de IA na Educa\u00e7\u00e3o e \u00e9 revisor de peri\u00f3dicos e eventos cient\u00edficos na \u00e1rea de Inform\u00e1tica na Educa\u00e7\u00e3o e IA na Educa\u00e7\u00e3o.
quemSomosOsAutoresP15= Mestranda em Psicologia pelo Programa de P\u00f3s-Gradua\u00e7\u00e3o em Psicologia da Universidade Federal de Juiz de Fora (UFJF), na linha de pesquisa de Processos Psicossociais em Sa\u00fade e psic\u00f3loga pela mesma universidade. Pesquisadora do Centro de Refer\u00eancia em Pesquisa, Interven\u00e7\u00e3o e Avalia\u00e7\u00e3o em \u00c1lcool e Outras Drogas (CREPEIA), com foco na \u00e1rea de interven\u00e7\u00f5es online para o uso de \u00e1lcool.
quemSomosOsAutoresP16= Mestre em Modelagem Computacional pela Universidade Federal de Juiz de Fora. Possui gradua\u00e7\u00e3o em Estat\u00edstica pela Universidade Federal de Juiz de Fora.
quemSomosOsAutoresP17= Graduando em Ci\u00eancias Exatas e Ci\u00eancia da Computa\u00e7\u00e3o pela Universidade Federal de Juiz de Fora. Possui 12 meses de experi\u00eancia na \u00e1rea de desenvolvimento mobile e atuando em um projeto de inicia\u00e7\u00e3o cient\u00edfica. Atualmente \u00e9 bolsista da Universidade Federal de Juiz de Fora.
quemSomosOsAutoresP19= Graduando em Ci\u00eancia da Computa\u00e7\u00e3o pela Universidade Federal de Juiz de Fora. Com experi\u00eancia pr\u00e1tica em desenvolvimento de software e participa\u00e7\u00e3o ativa em projetos acad\u00eamicos e de Inicia\u00e7\u00e3o Cient\u00edfica. Atualmente \u00e9 bolsista da Universidade Federal de Juiz de Fora.
quemSomosOsAutoresP20= Graduanda em Ci\u00eancia da Computa\u00e7\u00e3o pela Universidade Federal de Juiz de Fora. Atualmente \u00e9 bolsista da Universidade Federal de Juiz de Fora.
