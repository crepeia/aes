acompanhamento3P1= A seguir vamos avaliar novamente o seu consumo de \u00e1lcool. Algumas destas perguntas s\u00e3o relativas \u00e0 quantidade de \u00e1lcool que voc\u00ea consumiu no \u00faltimo ano:

# PHQ2
phq2R1= Nenhuma vez.
phq2R2= V\u00e1rios dias.
phq2R3= Mais da metade dos dias.
