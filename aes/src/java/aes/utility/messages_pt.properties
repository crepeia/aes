quantoVoceBebeSimGravidezAdolesTitle= Informa\u00e7\u00f5es para Gestantes menores de 18 anos | \u00c1lcool & Sa\u00fade
pregnantTeenDrink01= Informa\u00e7\u00f5es para Gestantes menores de 18 anos
quantoVoceBebeSimGravidezAdolesH31= Cuidado - voc\u00ea e seu futuro beb\u00ea est\u00e3o em risco !
quantoVoceBebeSimGravidezAdolesP1= Voc\u00ea relatou beber e que pode estar gr\u00e1vida - O consumo de \u00e1lcool \u00e9 muito prejudicial para adolescentes e extremamente prejudicial para o bom desenvolvimento do seu beb\u00ea.
quantoVoceBebeSimGravidezAdolesP2= Toda gravidez na adolesc\u00eancia pode ser considerada uma gravidez de risco - Procure um profissional de sa\u00fade para obter mais orienta\u00e7\u00f5es sobre quais cuidados deve tomar .
quantoVoceBebeSimGravidezAdolesP2a= \u00c9 fundamental que voc\u00ea permane\u00e7a sem beber durante toda a gravidez e mesmo durante o per\u00edodo em que estiver amamentando. Essa recomenda\u00e7\u00e3o \u00e9 v\u00e1lida inclusive para mulheres adultas.
quantoVoceBebeSimGravidezAdolesP2b= A recomenda\u00e7\u00e3o de n\u00e3o beber vale para todas as pessoas menores de 18 anos. O consumo de \u00e1lcool na adolesc\u00eancia pode gerar problemas importantes no desenvolvimento do seu c\u00e9rebro e traz riscos importantes para a sua sa\u00fade neste momento e no futuro.
quantoVoceBebeSimGravidezAdolesP4= Este site ainda n\u00e3o possui ferramentas espec\u00edficas para gestantes e para adolescentes.
quantoVoceBebeSimGravidezAdolesP5= Recomendamos que leia as perguntas e respostas sobre \u00e1lcool e gravidez na adolesc\u00eancia abaixo, elas podem lhe ajudar.
quantoVoceBebeSimGravidezAdolesP7= N\u00e3o consuma \u00e1lcool antes dos 18 anos, principalmente caso esteja ou possa estar gr\u00e1vida.
quantoVoceBebeSimGravidezAdolesP10= Toda a bebida que cont\u00e9m \u00e1lcool, mesmo que em menor quantidade, pode prejudicar voc\u00ea e o seu beb\u00ea
quantoVoceBebeSimGravidezAdolesP11= Por bebidas alco\u00f3licas estamos nos referindo \u00e0 todas, mesmo cerveja, vinho, coquet\u00e9is, "ice" ou qualquer outra mistura que contenha \u00e1lcool.
quantoVoceBebeSimGravidezAdolesP15= N\u00e3o, os problemas podem afetar o desenvolvimento de sua crian\u00e7a
quantoVoceBebeSimGravidezAdolesP16= Em alguns casos mais graves, mesmo quando adulto, sua crian\u00e7a precisar\u00e1 de cuidados especiais.
quantoVoceBebeSimGravidezAdolesP17= Caso tenha bebido \u00e1lcool antes de saber que estava gr\u00e1vida, pare de beber agora e procure um profissional de sa\u00fade


