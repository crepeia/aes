alcoholYesLowRisk03= Apesar do seu consumo poder ser considerado de baixo risco, voc\u00ea tem bebido em algumas ocasi\u00f5es acima do que \u00e9 recomendado pada voc\u00ea
alcoholYesLowRisk04= Muitos problemas de sa\u00fade relacionados ao uso do \u00e1lcool demoram para aparecer e dependem da quantidade que voc\u00ea bebe
alcoholYesLowRisk05= A Organiza\u00e7\u00e3o Mundial da sa\u00fade recomenda os seguintes limites:
alcoholYesLowRisk07= Dia: at\u00e9 2 doses por dia
alcoholYesLowRisk08= Semana: N\u00e3o mais que 10 doses por semana
alcoholYesLowRisk10= Dia: at\u00e9 1 dose por dia
alcoholYesLowRisk11= Semana: N\u00e3o mais que 5 doses por semana
alcoholYesUseRisk02= O seu consumo pode ser considerado de risco
alcoholYesUseRisk06= Recomendamos que continue no app e conhe\u00e7a algumas ferramentas que podem lhe ajudar a previnir estes problemas
