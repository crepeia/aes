alternativeDecrease05= Caso voc\u00ea n\u00e3o consiga fazer progresso depois de 2 ou 3 meses, voc\u00ea poder\u00e1 considerar tamb\u00e9m parar de beber, buscando a ajuda de um profissional de sa\u00fade.
alternativeDecrease08= Estrat\u00e9gias para diminuir!
alternativeDecrease09= Pequenas mudan\u00e7as podem fazer uma grande diferen\u00e7a. Sigas as etapas at\u00e9 a montagem do seu plano personalizado
