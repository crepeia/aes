estrategiaPararApoioDepreAnsiTitle1= Dejar de beber
estrategiaPararApoioDepreAnsiH31= Sentirse deprimido o ansioso
strategyStopSupportDepressionAndAnxiety01= Sentirse deprimido o ansioso es com\u00fan entre las personas que tienen alg\u00fan tipo de problema con el alcohol
estrategiaPararApoioDepreAnsiLi1= Los s\u00edntomas moderados pueden dejar de molestarte despu\u00e9s de que empieces a beber menos o dejes de beber
strategyStopSupportDepressionAndAnxiety03= Si los s\u00edntomas persisten o empeoran:
estrategiaPararApoioDepreAnsiLi2= Busca ayuda de un profesional de la salud
strategyStopSupportDepressionAndAnxiety05= Si has tenido pensamientos relacionados con el suicidio, busca servicios de emergencia cerca de ti (como bomberos, sala de emergencias o tu propio m\u00e9dico)
estrategiaPararApoioDepreAnsiLi3= Existen tratamientos disponibles que pueden ayudarte a superar esta situaci\u00f3n
strategyStopIntroduction07= Dejar de beber
estrategiaPararApoioIntroH41= Las siguientes sugerencias son m\u00e1s \u00fatiles para las personas que tienen una alta probabilidad de haberse vuelto adictas al alcohol
estrategiaPararApoioIntroLi1= Las personas que pueden estar adictas pueden encontrar dif\u00edcil dejar de beber sin ayuda
strategyStopIntroduction02= Recomendamos encarecidamente que si quieres dejar de beber, busques ayuda de un profesional de la salud
estrategiaPararApoioIntroLi2= Actualmente existen varios enfoques de tratamiento que han demostrado ayudar
strategyStopIntroduction04= Es importante enfatizar que no existe un solo tipo de tratamiento y que cada persona puede adaptarse mejor a uno espec\u00edfico
estrategiaPararApoioIntroLi3= Comenzar a buscar ayuda es una excelente forma
estrategiaPararApoioIntroLi4= Tus chances son mucho mayores cuando encuentras un tipo de tratamiento con el que te sientas c\u00f3modo
quittingDrinkingProfessionalSuport= Dejar de beber - Apoyo profesional
strategyStopProfessionalSupportTherapy01= Asesoramiento o "Terapia"
estrategiaPararApoioProfTerapiaP1= Existen diferentes tipos de asesoramiento/terapias que pueden ayudarte y que son efectivos
estrategiaPararApoioProfTerapiaLi1= Algunos ejemplos son el enfoque cognitivo-conductual, enfoque motivacional, 12 pasos o una combinaci\u00f3n de ellos
estrategiaPararApoioProfTerapiaLi2= A pesar de las diferencias entre los enfoques, recibir alg\u00fan tipo de ayuda en s\u00ed mismo es m\u00e1s importante que un enfoque espec\u00edfico, siempre que se te ofrezca un enfoque emp\u00e1tico, evite confrontaciones fuertes, aumente tu motivaci\u00f3n y te ofrezca m\u00faltiples metas para cambiar la forma de beber
strategyStopProfessionalSupportTherapy05= Programas de tratamiento intensivo especializados
estrategiaPararApoioProfTerapiaLi3= Algunas personas, no la mayor\u00eda, pueden necesitar programas m\u00e1s intensivos. Si necesitas una derivaci\u00f3n a un programa como este, busca un profesional de la salud
strategyStopProfessionalSupport01= Medicamentos para tratar el alcoholismo
estrategiaPararApoioProfissionalP1= Los avances en el tratamiento del alcoholismo significan que actualmente los pacientes tienen m\u00e1s alternativas de tratamiento y que los profesionales de la salud tienen m\u00e1s herramientas
estrategiaPararApoioProfissionalLi1= Nuevos medicamentos pueden ayudarte a dejar de beber actuando sobre las v\u00edas neuronales
estrategiaPararApoioProfissionalLi2= Estos nuevos medicamentos (por ejemplo, Naltrexona, Topiramato, etc.) no te hacen sentir n\u00e1useas como los medicamentos antiguos (por ejemplo, Disulfiram)
estrategiaPararApoioProfissionalLi3= Ninguno de estos medicamentos causa dependencia, lo que preocupa a algunos grupos de apoyo y servicios de asesoramiento para el alcohol.
estrategiaPararApoioProfissionalLi4= Los estudios han demostrado que los pacientes con dependencia del alcohol pueden recibir un tratamiento efectivo combinando estos nuevos medicamentos y visitas breves de un profesional de la salud para seguimiento.
estrategiaPararApoioProfissionalNaoDesistaTitle= Dejar de beber | Alcohol y Salud
changingYourBehaviorDontGiveUp= Cambiando tu comportamiento - No te rindas
estrategiaPararApoioProfissionalNaoDesistaP1= Cambiar comportamientos como fumar, comer en exceso o beber demasiado puede requerir mucho esfuerzo y puede no tener resultados positivos en el primer intento
estrategiaPararApoioProfissionalNaoDesistaLi1= Algunas fallas en el camino son comunes, pero siempre aprendes m\u00e1s cada vez que las superas
estrategiaPararApoioProfissionalNaoDesistaLi2= Cada uno de estos intentos te acercar\u00e1 m\u00e1s a tu meta
strategyStopSupportDoNotGiveUp04= Cualquiera que sea el camino que elijas - pru\u00e9balo de manera justa
estrategiaPararApoioProfissionalNaoDesistaLi3= Si este enfoque no funciona, prueba algo m\u00e1s
