aboutusPTelmo= Coordinador de CREPEIA, Profesor de la Universidad Federal de Juiz de Fora (Brasil). Maestr\u00eda en Psicolog\u00eda Social (UFMG, Brasil), Doctorado en Ciencias de la Salud (Unifesp, Brasil), Postdoctorado en Alcohol y Drogas (University of Connecticut Health Center, EE.UU., y USP, Brasil). Investigador CNPq.
aboutusLinkcv= Enlace al CV
aboutusH3Laisa= Dra. Laisa Sartes
aboutusPLaisa= Profesora del Departamento de Psicolog\u00eda de la Universidad Federal de Juiz de Fora (Brasil). Sus principales temas de trabajo e investigaci\u00f3n son el uso de sustancias psicotr\u00f3picas, estudios de evaluaci\u00f3n cl\u00ednica y validaci\u00f3n de instrumentos, tratamiento para la dependencia de sustancias basado en TCC y Terapia Familiar.
aboutusH3Heder= Dr. Heder Soares Bernardino
aboutusPHeder= Profesor del Departamento de Ciencias de la Computaci\u00f3n de la Universidad Federal de Juiz de Fora (Brasil). Trabaja con \u00e9nfasis en Inteligencia Computacional, especialmente para el descubrimiento de conocimiento. Tiene Maestr\u00eda y Doctorado en Modelado Computacional.
aboutusH3Henrique= Dr. Henrique Pinto Gomide
aboutusPHenrique= Psic\u00f3logo e investigador en CREPEIA en el grupo de e-health. Maestr\u00eda en Psicolog\u00eda dentro del proyecto "Alcohol y Salud". Realiz\u00f3 una pasant\u00eda en grupos de tratamiento para fumadores y desarrolla sitios web.
aboutusH3Leonardo= Dr. Leonardo Fernandes Martins
aboutusPLeonardo= Profesor y coordinador de curso en el Centro Regional de Referencia en Drogas de la Universidad Federal de Juiz de Fora y Universidad Federal de Sao Joao Del Rei. Maestr\u00eda en Psicolog\u00eda y especialista en Estad\u00edstica. Estudiante de Doctorado en Psicolog\u00eda en el \u00e1rea de e-health.
aboutusH3Thiago= Thiago Costa Rizuti da Rocha
aboutusPThiago= Estudiante de Ciencias de la Computaci\u00f3n en la Universidad Federal de Juiz de Fora. Actualmente es becario de la Universidad Federal de Juiz de Fora.
aboutusH3Andressa= Andressa Bianchi Gumier
