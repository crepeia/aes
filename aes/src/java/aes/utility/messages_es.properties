termoConsentimentoTitle1= T\u00e9rmino de consentimiento | Alcohol y Salud
tcleOptionTerm= T\u00e9rmino de Consentimiento Libre e Informado
termoConsentimentoP1A= Est\u00e1s siendo invitado como voluntario para participar en la investigaci\u00f3n \u201cInformalcool - Evaluaci\u00f3n de la efectividad de pasos de intervenci\u00f3n breve para reducir el consumo de alcohol asistida por computadora\u201d.
termoConsentimento03= Destacamos que tus datos ser\u00e1n tratados con la m\u00e1xima confidencialidad y no se compartir\u00e1n con terceros en ning\u00fan momento. Evaluar los datos de los usuarios del sitio web es importante para que podamos construir herramientas de intervenci\u00f3n cada vez m\u00e1s elaboradas.
termoConsentimento04= En este estudio, pretendemos evaluar la efectividad de diferentes intervenciones virtuales para la reducci\u00f3n del consumo de alcohol.
termoConsentimento05= La raz\u00f3n por la que estamos estudiando este tema es la relevancia para la salud p\u00fablica de los da\u00f1os relacionados con el alcohol que podr\u00edan evitarse a trav\u00e9s de intervenciones mediadas por computadora, como se ha demostrado en varios pa\u00edses del mundo (Pa\u00edses Bajos, Inglaterra, Suecia, M\u00e9xico, India y Bielorrusia).
termoConsentimentoP3= Los procedimientos se llevar\u00e1n a cabo de la siguiente manera: evaluaremos las respuestas proporcionadas por cada usuario durante la navegaci\u00f3n en el sitio web, las puntuaciones del AUDIT y los cuestionarios, y el uso del sitio web.
termoConsentimento07= Para participar en este estudio
termoConsentimentoP4b= no tendr\u00e1s ning\u00fan costo,
termoConsentimentoP4c= ni recibir\u00e1s ninguna ventaja financiera.
termoConsentimento08= Se te aclarar\u00e1 sobre el estudio en cualquier aspecto que desees y ser\u00e1s libre de participar o negarte a participar.
termoConsentimentoP5b= Puedes retirar tu consentimiento o interrumpir la participaci\u00f3n en cualquier momento.
termoConsentimento09= Tu participaci\u00f3n es voluntaria y negarte a participar no incurrir\u00e1 en ninguna penalidad o modificaci\u00f3n en la forma en que eres asistido por el investigador. El investigador tratar\u00e1 tu identidad con est\u00e1ndares profesionales de
termoConsentimento091= confidencialidad.
termoConsentimento10= Una vez m\u00e1s, enfatizamos que
termoConsentimento11= no ser\u00e1s identificado
termoConsentimentoP6d= en ninguna publicaci\u00f3n que pueda resultar de este estudio. Este estudio presenta un riesgo m\u00ednimo, es decir, el mismo riesgo existente en actividades rutinarias como hablar, ba\u00f1arse, leer, etc. A pesar de esto, se te ha garantizado el derecho a compensaci\u00f3n o indemnizaci\u00f3n en caso de cualquier da\u00f1o eventualmente producido por la investigaci\u00f3n.
termoConsentimentoP7= Los datos e instrumentos utilizados en la investigaci\u00f3n se archivar\u00e1n con el investigador responsable durante un per\u00edodo de 5 a\u00f1os, despu\u00e9s del cual se destruir\u00e1n.
termoConsentimento14= He sido informado de los objetivos del presente estudio de manera clara y detallada y se han aclarado mis dudas. S\u00e9 que en cualquier momento puedo solicitar nueva informaci\u00f3n y cambiar mi decisi\u00f3n de participar si lo deseo.
termoConsentimento15= Declaro que acepto participar en este estudio.
termoConsentimentoP9= REGISTRARSE
termosDeUsoP2= Este sitio web fue desarrollado para ser un servicio p\u00fablico, ofreciendo informaci\u00f3n y un programa para ayudar a las personas en riesgo de consumo de alcohol.
termosUso04= El programa es complementario a los enfoques tradicionales que buscan ayudar a las personas a beber menos y
termosUso05= No
termosUso06= sustituye la consulta con profesionales de la salud.
termosDeUsoP4= El programa es
termosDeUsoP41= experimental y se probar\u00e1 su efectividad cl\u00ednica
termosDeUsoP5= Algunas de las p\u00e1ginas del sitio web son de libre acceso para todos los visitantes. Sin embargo, el acceso al programa requiere un registro gratuito. Si hay inter\u00e9s por parte del usuario, es necesario elegir un nombre de usuario y una contrase\u00f1a. El nombre de usuario y la contrase\u00f1a deben mantenerse confidenciales y no deben compartirse con ning\u00fan otro usuario. Se solicita a los visitantes que no revelen su nombre de usuario y contrase\u00f1a a terceros.
termosDeUsoP6= Se han hecho todos los esfuerzos para garantizar que la informaci\u00f3n y los materiales contenidos en este sitio web sean completamente verdaderos y no da\u00f1inos. Los materiales y la informaci\u00f3n proporcionados fueron evaluados por expertos en prevenci\u00f3n del abuso de alcohol y por personas que ya han usado la estrategia de beber menos.
termosDeUsoObject1= gpl
quemSomosOsAutoresH13= Los autores
quemSomosOsAutoresH14= Ex-integrantes del equipo
quemSomosOsAutoresP1= El proyecto Alcohol y Salud fue creado por el grupo de investigaci\u00f3n en e-health de
quemSomosOsAutoresP1A= - en asociaci\u00f3n con el Departamento de Ciencias de la Computaci\u00f3n de
quemSomosOsAutoresP2A= y el
quemSomosOsAutoresP2A1= CNPQ - Ciencias sin Fronteras.
quemSomosOsAutoresP3= Coordinador de CREPEIA, Profesor de la Universidad Federal de Juiz de Fora (Brasil). Maestr\u00eda en Psicolog\u00eda Social (UFMG, Brasil), Doctorado en Ciencias de la Salud (Unifesp, Brasil), Postdoctorado en Alcohol y Drogas (University of Connecticut Health Center, EE.UU., y USP, Brasil). Investigador CNPq.
quemSomosOsAutoresP4= Profesora del Departamento de Psicolog\u00eda de la Universidad Federal de Juiz de Fora (Brasil). Sus principales temas de trabajo e investigaci\u00f3n son el uso de sustancias psicotr\u00f3picas, estudios de evaluaci\u00f3n cl\u00ednica y validaci\u00f3n de instrumentos, tratamiento para la dependencia de sustancias.
quemSomosOsAutoresP6= Psic\u00f3logo e investigador en CREPEIA en el grupo de e-health. Maestr\u00eda en Psicolog\u00eda dentro del proyecto "Alcohol y Salud". Realiz\u00f3 una pasant\u00eda en grupos de tratamiento para fumadores y desarrolla sitios web.
quemSomosOsAutoresP7= Profesor y coordinador de curso en el Centro Regional de Referencia en Drogas de la Universidad Federal de Juiz de Fora y Universidad Federal de Sao Joao Del Rei. Maestr\u00eda en Psicolog\u00eda y Especialista en Estad\u00edstica. Estudiante de Doctorado en Psicolog\u00eda en el \u00e1rea de e-health.
quemSomosOsAutoresP8= Psic\u00f3loga con formaci\u00f3n en Terapia Cognitivo-Conductual. Estudiante de Maestr\u00eda en Psicolog\u00eda con el proyecto "Comparaci\u00f3n de la eficiencia de la Psicoterapia breve v\u00eda internet y presencial para adictos al alcohol: un estudio aleatorizado".
quemSomosOsAutoresP9= Estudiante de Ciencias de la Computaci\u00f3n en la Universidad Federal de Juiz de Fora. Actualmente es becaria de la Universidad Federal de Juiz de Fora.
quemSomosOsAutoresP10= Estudiante de Ciencias de la Computaci\u00f3n de la Universidad Federal de Juiz de Fora. Actualmente es becario de la Universidad Federal de Juiz de Fora.
quemSomosOsAutoresP11= Investigadora en CREPEIA y estudiante de Maestr\u00eda en UFJF. Coordinadora territorial en el Centro Regional de Referencia en Drogas en UFJF. Psic\u00f3loga con grado sandwich en la University of Kansas Medical Center (KUMC, EE.UU.).
quemSomosOsAutoresP12= Estudiante de Ciencias de la Computaci\u00f3n de la Universidad Federal de Juiz de Fora. Actualmente es becario de la Universidad Federal de Juiz de Fora.
quemSomosOsAutoresP13= Graduada en Comunicaci\u00f3n Social - Periodismo por la Universidad Federal de Juiz de Fora (2013). Estudi\u00f3 Especializaci\u00f3n en Creaci\u00f3n Publicitaria en PUC Minas (2015). Actualmente es estudiante de Maestr\u00eda en el Programa de Posgrado en Comunicaci\u00f3n de la Universidad Federal de Juiz de Fora.
quemSomosOsAutoresP14= Profesor de Ciencias de la Computaci\u00f3n en la UFJF. Doctor en Inform\u00e1tica por la PUC-RJ y miembro del Laboratorio de Aplicaciones Innovadoras en Computaci\u00f3n (LApIC), donde investiga sobre Procesamiento de Lenguaje Natural, Recuperaci\u00f3n de Informaci\u00f3n e Inteligencia Artificial en la Educaci\u00f3n. Tiene actuaci\u00f3n en proyectos de desarrollo tecnol\u00f3gico e innovaci\u00f3n en el \u00e1rea de IA en la Educaci\u00f3n y es revisor de revistas y eventos cient\u00edficos en el \u00e1rea de Inform\u00e1tica en la Educaci\u00f3n e IA en la Educaci\u00f3n.
quemSomosOsAutoresP15= Estudiante de Maestr\u00eda en Psicolog\u00eda por el Programa de Posgrado en Psicolog\u00eda de la Universidad Federal de Juiz de Fora (UFJF), en la l\u00ednea de investigaci\u00f3n de Procesos Psicosociales en Salud y psic\u00f3loga por la misma universidad. Investigadora del Centro de Referencia en Investigaci\u00f3n, Intervenci\u00f3n y Evaluaci\u00f3n en Alcohol y Otras Drogas (CREPEIA), con foco en el \u00e1rea de intervenciones en l\u00ednea para el uso de alcohol.
quemSomosOsAutoresP16= Maestro en Modelado Computacional por la Universidad Federal de Juiz de Fora. Posee graduaci\u00f3n en Estad\u00edstica por la Universidad Federal de Juiz de Fora.
quemSomosOsAutoresP17= Estudiante de Ciencias Exactas y Ciencias de la Computaci\u00f3n por la Universidad Federal de Juiz de Fora. Posee 12 meses de experiencia en el \u00e1rea de desarrollo m\u00f3vil y actuando en un proyecto de iniciaci\u00f3n cient\u00edfica. Actualmente es becario de la Universidad Federal de Juiz de Fora.
quemSomosOsAutoresP19= Estudiante de Ciencias de la Computaci\u00f3n por la Universidad Federal de Juiz de Fora. Con experiencia pr\u00e1ctica en desarrollo de software y participaci\u00f3n activa en proyectos acad\u00e9micos y de Iniciaci\u00f3n Cient\u00edfica. Actualmente es becario de la Universidad Federal de Juiz de Fora.
quemSomosOsAutoresP20= Estudiante de Ciencias de la Computaci\u00f3n por la Universidad Federal de Juiz de Fora. Actualmente es becaria de la Universidad Federal de Juiz de Fora.
