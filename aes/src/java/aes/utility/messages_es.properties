pPageBlank3= Este sitio no sustituye el apoyo proporcionado por un profesional de la salud. Todo el contenido del sitio est\u00e1 siendo evaluado por una encuesta cl\u00ednica registrada en el Comit\u00e9 de \u00c9tica en Investigaci\u00f3n de la UFJF
h2Pesquisadores= Motivaci\u00f3n
pPesquisadores1= El abuso de alcohol est\u00e1 asociado con m\u00e1s de 60 tipos diferentes de problemas de salud con un alto costo econ\u00f3mico y social.
pPesquisadores2= Existe evidencia de que las intervenciones basadas en internet pueden ser efectivas para reducir el abuso de alcohol.
pPesquisadores3= El uso de internet en el pa\u00eds est\u00e1 creciendo exponencialmente, lo que caracteriza este espacio como oportuno para ofrecer informaci\u00f3n de salud de calidad.
pPesquisadores31= . Sin embargo, todav\u00eda hay pocos estudios que eval\u00faen la aceptabilidad y efectividad de estas intervenciones en pa\u00edses con caracter\u00edsticas socioecon\u00f3micas como Brasil.
pPesquisadores4= Aunque existen sitios en portugu\u00e9s que ofrecen informaci\u00f3n sobre alcohol, consideramos que todav\u00eda hay una importante
pPesquisadores5= "Disparidad entre la demanda y la oferta de calidad de intervenciones en l\u00ednea para varios comportamientos de salud."
h2Pesquisadores1= Nuestra metodolog\u00eda
pPesquisadores6= El contenido del sitio web se basa en las directrices de la Organizaci\u00f3n Mundial de la Salud para la identificaci\u00f3n de problemas relacionados con el uso de alcohol e intervenci\u00f3n breve para el uso de riesgo y uso perjudicial de alcohol. Parte del contenido tambi\u00e9n se basa en la gu\u00eda cl\u00e1sica de NIAAA "Helping Patients who Drink too much".
pPesquisadores7= Durante las etapas de desarrollo, se consult\u00f3 a personas que consumen alcohol a trav\u00e9s de entrevistas colectivas y pruebas de usabilidad. Despu\u00e9s del final de la primera versi\u00f3n, su contenido fue evaluado por especialistas en intervenciones breves.
pPesquisadores8= El contenido respeta las normas del Consejo Federal de Medicina, Consejo Federal de Psicolog\u00eda y Health on the Net Foundation
