teenDrink03= Has informado que consumes alcohol, lo cual puede tener consecuencias negativas para tu salud en el futuro. Por razones biol\u00f3gicas y legales, los menores de 18 a\u00f1os no deben usar alcohol.
teenDrink06= \u00bfPor qu\u00e9 no debo beber?
teenDrink07= Sabe que hay varias formas de ayudarte a dejar de beber. Si alguien te ofrece una bebida, siempre di 'no gracias', educada y directamente. Intenta mantenerte alejado de personas o lugares que te hagan beber. Si no puedes dejar de beber, busca un profesional de la salud y pide ayuda. Si no tienes acceso a un profesional de la salud, usa Viva Voz (Marca 132 - llamada gratuita).
teenDrink08= Si ya bebo, \u00bfqu\u00e9 debo hacer?
teenNotDrink02= \u00a1Felicitaciones por no consumir alcohol!
teenNotDrink03= La adolescencia es un per\u00edodo \u00fanico para el desarrollo del cerebro. Los estudios muestran que incluso los adolescentes que han estado consumiendo alcohol por poco tiempo pueden experimentar una disminuci\u00f3n del volumen del cerebro. Con el tiempo, los adolescentes que consumen alcohol tambi\u00e9n pueden tener mayores dificultades para resolver problemas que requieren razonamiento. Al evitar el consumo de alcohol, no solo preservas tu cerebro por m\u00e1s tiempo, sino que tambi\u00e9n evitas otros posibles da\u00f1os que pueden estar asociados con problemas de salud, accidentes, peleas y discusiones.
telaDescSugestao= \u00a1Aqu\u00ed puedes sugerir un cambio a nuestra aplicaci\u00f3n!
temporaryCode= Usando c\u00f3digo temporal.
termoConsentimento00= T\u00e9rmino de consentimiento
termoConsentimento02= Est\u00e1s invitado como voluntario para participar en parte de la investigaci\u00f3n \u201cInformalcool - Evaluaci\u00f3n de la efectividad de intervenciones breves asistidas por computadora para la reducci\u00f3n del consumo de alcohol\u201d.
termoConsentimento06= Los procedimientos se llevar\u00e1n a cabo de la siguiente manera: evaluaremos las respuestas proporcionadas por cada usuario durante la navegaci\u00f3n en el sitio web, las puntuaciones del AUDIT y los cuestionarios utilizados, as\u00ed como el tiempo dedicado al sitio web.
termoConsentimento0701= no incurrir\u00e1s en ning\u00fan costo.
termoConsentimento12= en ninguna publicaci\u00f3n que pueda resultar de este estudio. Este estudio presenta un riesgo m\u00ednimo, es decir, el mismo riesgo existente en actividades rutinarias como hablar, ducharse, leer, etc. A pesar de esto, se te garantiza el derecho a reembolso o compensaci\u00f3n en caso de cualquier da\u00f1o eventualmente producido por la investigaci\u00f3n.
termoConsentimento13= Los datos e instrumentos utilizados en la investigaci\u00f3n se archivar\u00e1n con el investigador responsable y pueden destruirse si lo solicita el usuario.
termosUso00= T\u00e9rminos de uso
termosUso01= Descargo de responsabilidad, pol\u00edtica de privacidad y t\u00e9rminos y condiciones de uso de Alcohol y Salud.
termosUso02= Bienvenido a "Alcohol y Salud". Para que el uso de Alcohol y Salud sea satisfactorio y no ofensivo para ti, es importante leer, entender y aceptar los siguientes t\u00e9rminos y condiciones.
termosUso03= Alcohol y Salud fue desarrollado con el objetivo de ser un servicio p\u00fablico, ofreciendo informaci\u00f3n y un programa para ayudar a las personas que realizan consumo riesgoso de alcohol.
termosUso08= Acceso a Alcohol y Salud
termosUso09= Algunas p\u00e1ginas de Alcohol y Salud son de libre acceso para todos los visitantes, sin embargo, el acceso al programa requiere un registro gratuito. Si el usuario est\u00e1 interesado, es necesario elegir un nombre de usuario y una contrase\u00f1a. El nombre de usuario y la contrase\u00f1a deben mantenerse confidenciales y no deben compartirse con ning\u00fan otro usuario. Se solicita a los visitantes que no revelen su nombre de usuario y contrase\u00f1a a terceros.
termosUso11= - Usar el nombre de otra persona, nombre de usuario o contrase\u00f1a al acceder a Alcohol y Salud, sin consentimiento previo;
termosUso12= - Escribir o transmitir cualquier material que pueda, de cualquier manera, difamar, ofender o causar incomodidad a cualquier persona; ser obsceno o de cualquier manera interferir con el uso de Alcohol y Salud por otros usuarios;
termosUso13= - Proporcionar cualquier informaci\u00f3n a Alcohol y Salud que sea confidencial o propiedad de terceros;
termosUso14= - Usar Alcohol y Salud de cualquier manera que pueda infringir leyes, reglas o regulaciones o los derechos de terceros; o
termosUso15= - Transmitir virus o cualquier contenido que interfiera con la funcionalidad de Alcohol y Salud.
termosUso17= Se han hecho todos los esfuerzos para garantizar que la informaci\u00f3n y los materiales contenidos en Alcohol y Salud sean completamente verdaderos e inofensivos. Los materiales y la informaci\u00f3n proporcionados han sido evaluados por especialistas en la prevenci\u00f3n del consumo abusivo de alcohol y personas que ya han usado la estrategia de beber menos.
termosUso18= Alcohol y Salud no garantiza que los servicios estar\u00e1n disponibles de forma ininterrumpida o constante.
termosUso19= Aunque los servicios propuestos por Alcohol y Salud tienen como objetivo proporcionar ayuda a los usuarios que est\u00e1n preocupados por su consumo de alcohol, son libres y se les anima a consultar a profesionales de la salud. Todos los usuarios deben usar esto bajo su propio riesgo.
termosUso21= La informaci\u00f3n contenida en Alcohol y Salud puede incluir servicios e informaci\u00f3n de terceros. El contenido y los servicios de terceros se pondr\u00e1n a disposici\u00f3n con aprobaci\u00f3n previa.
termosUso23= Alcohol y Salud contiene enlaces a otros sitios web que no est\u00e1n bajo nuestro control ni son mantenidos por nosotros. Los enlaces de terceros se proporcionan por conveniencia e informaci\u00f3n. Si el usuario accede a esta informaci\u00f3n, los riesgos de uso son de su exclusiva responsabilidad. El hecho de que un sitio web de terceros est\u00e9 vinculado a este proyecto no implica necesariamente una relaci\u00f3n de patrocinio o que el sitio web de terceros est\u00e9 afiliado a este.
termosUso25= La informaci\u00f3n, productos y servicios publicados en Alcohol y Salud est\u00e1n sujetos a cambios sin previo aviso.
termosUso26= Informaci\u00f3n proporcionada por Alcohol y Salud
termosUso27= Las personas registradas en el programa Alcohol y Salud proporcionan informaci\u00f3n relacionada con su contenido de forma involuntaria. Una vez proporcionada, la informaci\u00f3n es propiedad del usuario y puede ser reproducida, publicada, transmitida, puesta a disposici\u00f3n, sujeta a las obligaciones de la Pol\u00edtica de Privacidad
termosUso29= Todo el contenido de Alcohol y Salud, incluidos programas, dise\u00f1o, textos y gr\u00e1ficos, est\u00e1 licenciado bajo la Licencia P\u00fablica General - GNU, garantizando la libertad de usar el contenido del programa para cualquier prop\u00f3sito, modificar el programa, compartirlo con tus vecinos y amigos, y compartir los cambios que hagas.
termosUso32= Alcohol y Salud contiene marcas registradas y logotipos de terceros registrados, protegidos por la ley. Su uso no est\u00e1 permitido sin consentimiento previo.
termosUso34= Si el usuario no respeta los t\u00e9rminos y condiciones de Alcohol y Salud, su acceso puede ser limitado o prohibido.
