quantoVoceBebeNaoGravidezP2= Si tienes alguna duda o consumir\u00e1s alcohol en el futuro, habla con un profesional de la salud y habla sobre este tema:
quantoVoceBebeNaoGravidezP3= Consulta a continuaci\u00f3n algunas de las preguntas frecuentes entre los adolescentes:
quantoVoceBebeNaoGravidezP4= El consumo de alcohol est\u00e1 asociado con una serie de problemas
quantoVoceBebeNaoAdolesTitle= Informaci\u00f3n para menores de 18 a\u00f1os | Alcohol y Salud
quantoVoceBebeNaoAdolesH31= \u00a1Felicitaciones por no consumir alcohol!
quantoVoceBebeNaoAdolesP1= La adolescencia es un per\u00edodo \u00fanico para el desarrollo del cerebro.
quantoVoceBebeNaoAdolesP1a= Los estudios indican que incluso los adolescentes que consumen alcohol desde hace poco tiempo pueden tener una disminuci\u00f3n del volumen del cerebro. Con el tiempo, los adolescentes que consumen alcohol tambi\u00e9n pueden tener mayores dificultades para resolver problemas que requieren el uso de razonamiento.
quantoVoceBebeNaoAdolesP1b= Al evitar consumir alcohol no solo preservas tu cerebro por m\u00e1s tiempo, sino que tambi\u00e9n evitas otros posibles da\u00f1os que pueden estar asociados con problemas de salud, accidentes, peleas y discusiones.
quantoVoceBebeNaoAdolesP1c= \u00a1Aprender a divertirte y disfrutar la vida de forma m\u00e1s saludable es siempre una buena elecci\u00f3n!
quantoVoceBebeNaoAdolesP2= En caso de que tengas dudas o vayas a consumir alcohol en el futuro, busca un profesional de la salud y conversa sobre este asunto:
quantoVoceBebeNaoAdolesP3= Consulta a continuaci\u00f3n algunas de las dudas frecuentes entre adolescentes:
quantoVoceBebeNaoAdolesPtab1= 1. \u00bfPor qu\u00e9 debo continuar sin beber?
quantoVoceBebeNaoAdolesP4= El consumo de alcohol est\u00e1 asociado con una serie de problemas
quantoVoceBebeNaoAdolesP5= Muchos de estos problemas tardan en aparecer y otros son m\u00e1s visibles
quantoVoceBebeNaoAdolesP6= Problemas de salud, legales y accidentes est\u00e1n asociados con el consumo de alcohol
quantoVoceBebeNaoAdolesP7= Los adolescentes y adultos pueden ver su desarrollo perjudicado por el alcohol, reduciendo su rendimiento en deportes, estudio y trabajo
quantoVoceBebeNaoAdolesPtab2= 2. En caso de que no beba, pero est\u00e9 pensando en probar?
quantoVoceBebeNaoAdolesP8a= No recomendamos que comiences a beber en este momento, los adolescentes est\u00e1n mucho m\u00e1s expuestos a las consecuencias negativas relacionadas con el consumo de alcohol.
quantoVoceBebeNaoAdolesP8= Te recomendamos en tu caso que est\u00e9s considerando probar alcohol o comenzar a beber que busques un profesional de la salud para informarte mejor.
quantoVoceBebeNaoAdolesP10= Sabe que existen diversos medios para resistir la presi\u00f3n de beber. Siempre busca ayuda o apoyo cuando te sientas bajo presi\u00f3n en relaci\u00f3n a este asunto.
quantoVoceBebeNaoAdolesP11= En caso de que alguien te ofrezca bebida, siempre di "no gracias", de forma educada y directa. Esto demuestra fuerza y determinaci\u00f3n.
quantoVoceBebeNaoAdolesP12= Procura mantenerte lejos de personas o lugares que te presionen a comenzar a beber
quantoVoceBebeNaoAdolesP13= En caso de que no puedas resistir y llegues a consumir alcohol, cuanto antes logres parar menores ser\u00e1n los efectos negativos del consumo - busca un profesional de la salud y pide ayuda
quantoVoceBebeNaoAdolesP15= En caso de que quieras profundizar m\u00e1s en este asunto, hemos preparado un material para ti en este.
pregnantTeenNotDrink01= Informaci\u00f3n para embarazadas menores (menores de 18)
quantoVoceBebeNaoAdolesGravidezH31= \u00a1Felicitaciones por no beber! Cuidado: todo embarazo adolescente se considera de riesgo, incluso si no consumes alcohol.
quantoVoceBebeNaoAdolesGravidezP1= La adolescencia es un per\u00edodo \u00fanico para el desarrollo del cerebro y tu cuerpo.
quantoVoceBebeNaoAdolesGravidezP1a= Los estudios muestran que incluso los adolescentes que consumen alcohol por poco tiempo pueden disminuir el volumen del cerebro. Con el tiempo, los adolescentes que beben alcohol tambi\u00e9n pueden tener mayores dificultades para resolver problemas que requieren razonamiento.
quantoVoceBebeNaoAdolesGravidezP1b= Al evitar el alcohol, no solo preservas tu cerebro por m\u00e1s tiempo, sino que tambi\u00e9n evitas otros posibles da\u00f1os que pueden estar asociados con problemas de salud, accidentes, peleas y discusiones.
quantoVoceBebeNaoAdolesGravidezP1c= \u00a1Aprender a divertirte y disfrutar la vida de forma saludable es siempre una buena elecci\u00f3n!
