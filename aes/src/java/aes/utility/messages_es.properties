doseChatInformationStepControl06= \u2022 Estaba en casa, solo, viendo televisi\u00f3n.
doseChatInformationStepControl07= \u2022 Estaba en una fiesta con amigos.
doseChatInformationStepControl08= \u2022 Estaba triste despu\u00e9s de un d\u00eda dif\u00edcil.
doseChatInformationStepControl09= Registrar el contexto ayuda a entender los desencadenantes o patrones que influyen en tu consumo.
doseChatInformationStepControl10= \u1f7e5 Consecuencia
doseChatInformationStepControl11= La consecuencia es lo que sentiste o experimentaste despu\u00e9s de beber. Puede ser algo f\u00edsico, emocional o social.
doseChatInformationStepControl12= \u2022 Me sent\u00ed relajado y dorm\u00ed bien.
doseChatInformationStepControl13= \u2022 Tuve dolor de cabeza y n\u00e1useas.
doseChatInformationStepControl14= \u2022 Discut\u00ed con alguien.
doseChatInformationStepControl15= \u2022 Me arrepent\u00ed m\u00e1s tarde.
doseChatInformationStepControl16= Anotar las consecuencias te ayuda a reflexionar sobre los efectos del alcohol y c\u00f3mo impacta tu bienestar.
