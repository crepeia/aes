pregnantAdultDrink02= \u00a1Cuidado!
pregnantAdultDrink03= Has informado que consumes alcohol - lo cual es perjudicial para el desarrollo saludable de tu beb\u00e9. Es esencial que permanezcas sobria durante todo tu embarazo e incluso mientras amamantas. Recomendamos encarecidamente que dejes de beber y busques un profesional de la salud lo antes posible para que te ayude. Esta aplicaci\u00f3n a\u00fan no tiene herramientas espec\u00edficas para mujeres embarazadas.
pregnantAdultDrink05= No, no puedes. No consumas alcohol si est\u00e1s o puedes estar embarazada. El alcohol que consumes afecta el desarrollo de tu beb\u00e9.
pregnantAdultDrink06= \u00bfPuedo consumir bebidas alcoh\u00f3licas si estoy embarazada?
pregnantAdultDrink07= No, no existe. Cualquier bebida que contenga alcohol, incluso en cantidades menores, puede da\u00f1ar a tu beb\u00e9. Por bebidas alcoh\u00f3licas nos referimos a todas, incluso cerveza, vino, c\u00f3cteles, 'ice' o cualquier otra mezcla que contenga alcohol.
pregnantAdultDrink08= \u00bfExiste alg\u00fan tipo de bebida alcoh\u00f3lica que sea segura de usar durante el embarazo?
pregnantAdultDrink09= No, cada embarazo es diferente. El consumo de alcohol puede da\u00f1ar a un beb\u00e9 m\u00e1s que a otro. Podr\u00edas haber tenido un hijo que naci\u00f3 sano, pero tambi\u00e9n podr\u00edas haber tenido un hijo nacido con problemas.
pregnantAdultDrink10= Si beb\u00ed durante mi \u00faltimo embarazo y no tuve problemas, \u00bfest\u00e1 bien beber esta vez?
pregnantAdultDrink11= No, los problemas afectan el desarrollo de tu hijo. En algunos casos m\u00e1s graves, incluso como adulto, tu hijo necesitar\u00e1 cuidados especiales.
pregnantAdultDrink12= \u00bfLos problemas que mi beb\u00e9 podr\u00eda tener por mi bebida mejorar\u00e1n con el tiempo?
pregnantAdultDrink13= Si bebiste alcohol antes de saber que estabas embarazada, deja de beber ahora y busca un profesional de la salud. Te sentir\u00e1s mejor y tu beb\u00e9 tendr\u00e1 una gran chance de nacer sano. Si sospechas que est\u00e1s embarazada - no bebas alcohol. Incluso si est\u00e1s intentando quedar embarazada, no bebas alcohol, ya que podr\u00edas estar embarazada y no saberlo. Incluso en los primeros dos meses, el alcohol puede da\u00f1ar a tu beb\u00e9.
pregnantAdultDrink14= \u00bfQu\u00e9 debo hacer si estoy embarazada pero he estado bebiendo?
pregnantAdultDrink15= En tu caso, te recomendamos buscar un profesional de la salud para que te ayude. El contenido de este sitio no fue desarrollado espec\u00edficamente para mujeres embarazadas, pero algunos consejos pueden ser \u00fatiles: Sabe que hay varias formas de ayudarte a dejar de beber; Si alguien te ofrece una bebida, siempre di 'no gracias', educada y directamente; Intenta mantenerte alejada de personas o lugares que te hagan beber; No guardes bebidas alcoh\u00f3licas en casa; Si no puedes dejar de beber, busca un profesional de la salud y pide ayuda; Si no tienes acceso a un profesional de la salud, usa Viva Voz (Marca 132 - llamada gratuita).
pregnantAdultDrink16= \u00bfC\u00f3mo dejo de beber?
pregnantAdultNotDrink01= Informaci\u00f3n para mujeres embarazadas
pregnantAdultNotDrink03= Has informado que no consumes alcohol, lo cual es esencial para el desarrollo saludable de un beb\u00e9. Es fundamental permanecer sobria durante todo el embarazo e incluso mientras amamantas. Si tienes dudas, busca un profesional de la salud.
pregnantAdultNotDrink04= Preguntas frecuentes entre mujeres embarazadas:
pregnantTeenDrink02= \u00a1Cuidado - t\u00fa y tu futuro beb\u00e9 est\u00e1n en riesgo!
pregnantTeenDrink03= Has informado que bebes y que podr\u00edas estar embarazada - El consumo de alcohol es muy perjudicial para los adolescentes y extremadamente perjudicial para el desarrollo saludable de tu beb\u00e9. Todos los embarazos adolescentes pueden considerarse embarazos de alto riesgo - Busca un profesional de la salud para m\u00e1s orientaci\u00f3n sobre qu\u00e9 precauciones tomar. Recomendamos encarecidamente que dejes de beber y busques un profesional de la salud lo antes posible para que te ayude. Esta aplicaci\u00f3n a\u00fan no tiene herramientas espec\u00edficas para mujeres embarazadas y adolescentes.
pregnantTeenDrink04= Te recomendamos que leas las preguntas y respuestas sobre el alcohol y el embarazo adolescente a continuaci\u00f3n; pueden ayudarte.
pregnantTeenNotDrink02= \u00a1Felicitaciones por no consumir alcohol! Cuidado: todos los embarazos adolescentes se consideran de alto riesgo, incluso si no consumes alcohol.
pregnantTeenNotDrink03= La adolescencia es un per\u00edodo \u00fanico para el desarrollo del cerebro. Los estudios muestran que incluso los adolescentes que han estado consumiendo alcohol por poco tiempo pueden experimentar una disminuci\u00f3n del volumen del cerebro. Con el tiempo, los adolescentes que consumen alcohol tambi\u00e9n pueden tener mayores dificultades para resolver problemas que requieren razonamiento. Al evitar el consumo de alcohol, no solo preservas tu cerebro por m\u00e1s tiempo, sino que tambi\u00e9n evitas otros posibles da\u00f1os que pueden estar asociados con problemas de salud, accidentes, peleas y discusiones.
pregnantTeenNotDrink04= \u00a1Aprender a divertirte y disfrutar la vida de forma saludable es siempre una buena elecci\u00f3n!
pregnantTeenNotDrink05= Si tienes dudas o consideras consumir alcohol en el futuro, busca un profesional de la salud y discute este asunto.
pregnantTeenNotDrink06= Preguntas frecuentes entre adolescentes
pregnantTeenNotDrink07= El consumo de alcohol est\u00e1 asociado con una serie de problemas. Muchos de estos problemas tardan en aparecer y otros son m\u00e1s visibles. Los problemas de salud, legales y accidentes est\u00e1n asociados con el consumo de alcohol. Los adolescentes y adultos pueden ver su desarrollo perjudicado por el alcohol, reduciendo su rendimiento en deportes, estudios y trabajo.
pregnantTeenNotDrink08= \u00bfPor qu\u00e9 debo continuar sin beber?
pregnantTeenNotDrink09= En tu caso, si est\u00e1s considerando probar alcohol o comenzar a beber, te recomendamos buscar un profesional de la salud para m\u00e1s informaci\u00f3n. No recomendamos comenzar a beber en este momento; los adolescentes est\u00e1n mucho m\u00e1s expuestos a las consecuencias negativas relacionadas con el consumo de alcohol. El contenido de este sitio no fue desarrollado espec\u00edficamente para adolescentes, pero algunos consejos pueden ser \u00fatiles: \n Sabe que hay varias formas de resistir la presi\u00f3n para beber; Siempre busca ayuda o apoyo cuando te sientas presionado en relaci\u00f3n a este asunto; \n Si alguien te ofrece una bebida, siempre di 'no gracias', educada y directamente. Esto demuestra fuerza y determinaci\u00f3n. Intenta mantenerte alejado de personas o lugares que te presionen a comenzar a beber. Si no puedes resistir y llegas a consumir alcohol, cuanto antes pares, menores ser\u00e1n los efectos negativos del consumo - busca un profesional de la salud y pide ayuda.
pregnantTeenNotDrink10= \u00bfQu\u00e9 pasa si no bebo pero estoy pensando en probarlo?
preparingDecreaseOrStop01= \u00bfTe gustar\u00eda dejar de beber o reducir la cantidad que bebes?
preparingDecreaseOrStop04= \u00bfListo para cambiar?
preparingDecreaseOrStop05= En este momento puedes elegir reducir o dejar de beber.
preparingDecreaseStopNo02= Sigue prestando atenci\u00f3n a cu\u00e1nto has estado bebiendo, considerando frecuencia y cantidad.
preparingDecreaseStopNo03= Intenta entender cu\u00e1nto te afecta el alcohol.
preparingDecreaseStopNo04= Aborda otras prioridades que pueden estar obstaculizando tu cambio.
preparingDecreaseStopNo05= Pide ayuda a un amigo, profesional de la salud o alguien m\u00e1s de confianza.
preparingDecreaseStopNo06= Vuelve a evaluar en el sitio web, principalmente considerando los pros y contras de cambiar.
preparingDecreaseStopNo08= Cuanto antes cambiemos, mayores ser\u00e1n nuestras chances de \u00e9xito y menores ser\u00e1n los da\u00f1os para el individuo y sus familias.
preparingDecreaseStopNo12= \u00a1Todav\u00eda no est\u00e1s pensando en cambiar!
preparingDecreaseStopNo13= Aunque el alcohol puede causar problemas, respondiste que todav\u00eda no est\u00e1s listo para cambiar.
