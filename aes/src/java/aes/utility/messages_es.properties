alcoholYesDependence06= Los problemas relacionados con el consumo de alcohol se consideran importantes problemas de salud y requieren atenci\u00f3n.
alcoholYesDependence08= Recomendamos encarecidamente que busques ayuda de un profesional de la salud o llames al programa gratuito 132 "Viva Voz".\n\nSi lo prefieres, tambi\u00e9n puedes hablar con nosotros. \u00a1Estamos disponibles para ayudarte y responder tus preguntas con psic\u00f3logos de forma r\u00e1pida y en l\u00ednea!
