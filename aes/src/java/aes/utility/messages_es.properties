privacidadeTitlepage= Pol\u00edtica de Privacidad | Alcohol y Salud
privacidadeH1= Pol\u00edtica de Privacidad
privacidadeIntro= Esta Pol\u00edtica de Privacidad describe c\u00f3mo la aplicaci\u00f3n <strong>Alcohol y Salud</strong> recopila, utiliza y protege los datos de los participantes voluntarios, en el contexto del proyecto de investigaci\u00f3n <em>"Predi\u00e7\u00e3o de Consumo de \u00c1lcool no Aplicativo \u00c1lcool &amp; Sa\u00fade via Aprendizado de M\u00e1quina e Dados Multimodais"</em>, aprobado por el Comit\u00e9 de \u00c9tica en Investigaci\u00f3n de la Universidad Federal de Juiz de Fora (CEP/UFJF).
privacidadeParecerNumero= N\u00famero de Dictamen: 8.508.969
privacidadeCaae= CAAE: 95623726.9.0000.5147
privacidadeSituacao= Estado: Aprobado
privacidadeDadosH2= Qu\u00e9 datos recopilamos
privacidadeDadosLocalizacao= <strong>Ubicaci\u00f3n (GPS)</strong> \u2014 incluso cuando la aplicaci\u00f3n est\u00e1 en segundo plano, mientras el participante tenga la recopilaci\u00f3n avanzada activada.
privacidadeDadosAcelerometro= <strong>Aceler\u00f3metro</strong> \u2014 utilizado para extraer caracter\u00edsticas del patr\u00f3n de marcha (caminata), como intensidad de movimiento y cadencia.
privacidadeDadosEma= <strong>Respuestas al cuestionario diario (EMA)</strong> \u2014 registros de autoinforme completados por el participante a lo largo del d\u00eda.
privacidadeDadosNota= No recopilamos fotos, contactos, mensajes ni archivos del dispositivo.
privacidadeFinalidadeH2= Para qu\u00e9 usamos estos datos
privacidadeFinalidadeTexto= Los datos se utilizan exclusivamente con fines de investigaci\u00f3n cient\u00edfica: construir una base de datos multimodal y entrenar modelos de aprendizaje autom\u00e1tico capaces de identificar patrones asociados a episodios de consumo de alcohol, con el objetivo futuro de ofrecer un apoyo preventivo m\u00e1s personalizado a los usuarios de la aplicaci\u00f3n.
privacidadeConsentimentoH2= Consentimiento
privacidadeConsentimentoTexto= La recopilaci\u00f3n avanzada de datos (ubicaci\u00f3n y aceler\u00f3metro) solo se activa despu\u00e9s de que el participante lea y acepte el Formulario de Consentimiento Informado (TCLE) directamente en la aplicaci\u00f3n. El participante puede retirar este consentimiento en cualquier momento, sin ning\u00fan perjuicio para el uso normal de la aplicaci\u00f3n.
privacidadeArmazenamentoH2= C\u00f3mo se almacenan y protegen los datos
privacidadeArmazenamentoItem1= Los datos se transmiten con cifrado (HTTPS).
privacidadeArmazenamentoItem2= Se almacenan en servidores de la Universidad Federal de Juiz de Fora (UFJF).
privacidadeArmazenamentoItem3= El acceso est\u00e1 restringido exclusivamente al equipo de investigaci\u00f3n.
privacidadeArmazenamentoItem4= No compartimos datos con terceros.
privacidadeArmazenamentoItem5= Para cualquier an\u00e1lisis o divulgaci\u00f3n de resultados, las coordenadas de ubicaci\u00f3n se convierten en m\u00e9tricas de comportamiento abstractas (por ejemplo, patrones de desplazamiento), sin exponer rutas o direcciones precisas.
privacidadeRetencaoH2= Por cu\u00e1nto tiempo guardamos los datos
privacidadeRetencaoTexto= Los datos de la investigaci\u00f3n permanecen archivados bajo la responsabilidad del investigador principal durante un per\u00edodo de 5 (cinco) a\u00f1os, de acuerdo con la Resoluci\u00f3n CNS 466/2012.
privacidadeDireitosH2= Sus derechos
privacidadeDireitosItem1= Rechazar o retirar su consentimiento en cualquier momento, sin penalizaci\u00f3n.
privacidadeDireitosItem2= Solicitar aclaraciones sobre los datos recopilados.
privacidadeDireitosItem3= Solicitar la eliminaci\u00f3n de sus datos, contactando al correo electr\u00f3nico a continuaci\u00f3n.
privacidadeContatoH2= Contacto
privacidadeContatoTexto= Si tiene preguntas sobre esta Pol\u00edtica de Privacidad o sobre la investigaci\u00f3n, p\u00f3ngase en contacto:
privacidadeContatoEmailLabel= Correo electr\u00f3nico:
privacidadeAtualizacao= \u00daltima actualizaci\u00f3n: julio de 2026.

politicaDoSiteH4Pesquisa= 1.3. Datos recopilados por la aplicaci\u00f3n m\u00f3vil, en el \u00e1mbito de la investigaci\u00f3n cient\u00edfica
politicaDoSitePesquisaIntro= En el \u00e1mbito del proyecto de investigaci\u00f3n cient\u00edfica realizado a trav\u00e9s de la aplicaci\u00f3n m\u00f3vil Alcohol y Salud, aprobado por el Comit\u00e9 de \u00c9tica en Investigaci\u00f3n de la UFJF (Dictamen n.\u00ba 8.508.969, CAAE 95623726.9.0000.5147), tambi\u00e9n recopilamos los siguientes datos adicionales, mediante el consentimiento previo y espec\u00edfico del participante a trav\u00e9s del Formulario de Consentimiento Informado (TCLE) presentado en la propia aplicaci\u00f3n:
politicaDoSiteLiPesquisaGps= Ubicaci\u00f3n (GPS) del dispositivo, incluso cuando la aplicaci\u00f3n est\u00e1 en segundo plano;
politicaDoSiteLiPesquisaAcel= Datos del aceler\u00f3metro, utilizados para identificar caracter\u00edsticas del patr\u00f3n de marcha (caminata);
politicaDoSiteLiPesquisaEma= Respuestas al cuestionario diario de autoinforme (EMA - Ecological Momentary Assessment).
politicaDoSitePesquisaFinalidade= Estos datos adicionales se utilizan para entrenar modelos de aprendizaje autom\u00e1tico capaces de identificar patrones asociados a episodios de consumo de alcohol. El participante puede retirar el consentimiento para esta recopilaci\u00f3n espec\u00edfica en cualquier momento, directamente en la aplicaci\u00f3n, sin ning\u00fan perjuicio para el uso de las dem\u00e1s funcionalidades. Para esta categor\u00eda de datos, el per\u00edodo de almacenamiento es de 5 (cinco) a\u00f1os, bajo la responsabilidad del investigador principal, de acuerdo con la Resoluci\u00f3n CNS 466/2012, que puede diferir del plazo general descrito en la Secci\u00f3n 5 de esta Pol\u00edtica.