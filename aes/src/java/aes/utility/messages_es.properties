tcleAlert= \u00a1Por favor selecciona una de las opciones!!
tcleAlertAgreeBody= \u00a1Gracias por aceptar participar en la investigaci\u00f3n! La hora en que se env\u00edan las preguntas se puede cambiar en Opciones.
tcleAlertAgreeTitle= \u00a1Gracias por tu ayuda!!
tcleAlertNotAgreeBody= Oh, es una pena que no quieras participar. Si cambias de opini\u00f3n, puedes cambiar tu respuesta en la pantalla "Opciones".
tcleAlertNotAgreeTitle= Tal vez la pr\u00f3xima vez
tcleBody11= Nos gustar\u00eda invitarte a participar como voluntario en la investigaci\u00f3n
tcleBody12= \u201cAplicaci\u00f3n m\u00f3vil con elementos de juego en una intervenci\u00f3n para el consumo excesivo de alcohol\u201d.
tcleBody13= La raz\u00f3n por la que realizamos esta investigaci\u00f3n es la importancia de un sistema que asista en intervenciones para usuarios de alcohol de alto riesgo. En esta investigaci\u00f3n, pretendemos evaluar la satisfacci\u00f3n y experiencia del usuario con el uso de una aplicaci\u00f3n m\u00f3vil que asiste en tales intervenciones.
tcleBody21= Si aceptas participar, aparecer\u00e1n algunas preguntas cerradas durante el uso de la aplicaci\u00f3n. Estas preguntas se har\u00e1n para evaluar tu grado de satisfacci\u00f3n y tu experiencia con el sistema y con los elementos de juego
tcleBody22= (nivel, insignia, tablero de l\u00edderes y ranking)
tcleBody23= presentes en la aplicaci\u00f3n. Te pedimos que respondas estas preguntas seriamente para no afectar el resultado final de la investigaci\u00f3n. Si aceptas participar, tambi\u00e9n recopilaremos algunos datos obtenidos a trav\u00e9s de tu interacci\u00f3n con la aplicaci\u00f3n.
tcleBody3= Las preguntas aparecer\u00e1n todos los d\u00edas a una hora que definas. Puedes elegir esta hora despu\u00e9s de este documento, en caso de una respuesta positiva para la participaci\u00f3n en la investigaci\u00f3n. Tambi\u00e9n puedes cambiar la hora en que recibir\u00e1s las preguntas a trav\u00e9s de una opci\u00f3n en la configuraci\u00f3n.
tcleBody4= Esta investigaci\u00f3n tiene un riesgo, que es la aparici\u00f3n de situaciones psicol\u00f3gicamente inc\u00f3modas. Para reducir la chance de que este riesgo ocurra, las preguntas que se har\u00e1n se han desarrollado para evitar en la medida de lo posible la aparici\u00f3n de situaciones inc\u00f3modas y problemas psicol\u00f3gicos pasados. La investigaci\u00f3n puede ayudarte a tener mayor satisfacci\u00f3n y compromiso en el uso de la aplicaci\u00f3n y en los procesos de intervenci\u00f3n que ofrece.
tcleBody5= Para participar en este estudio, no tendr\u00e1s ning\u00fan costo y no recibir\u00e1s ninguna ventaja financiera. Sin embargo, si sufres alg\u00fan da\u00f1o debido a las actividades que realizamos contigo en esta investigaci\u00f3n, tienes derecho a buscar compensaci\u00f3n. Tendr\u00e1s toda la informaci\u00f3n que quieras sobre esta investigaci\u00f3n y ser\u00e1s libre de participar o negarte a participar. Incluso si quieres participar ahora, puedes cambiar de opini\u00f3n o dejar de participar en cualquier momento, a trav\u00e9s de una opci\u00f3n en la configuraci\u00f3n que te permite entrar y salir de la investigaci\u00f3n en cualquier momento. Tu participaci\u00f3n es voluntaria y no querer participar no traer\u00e1 ninguna penalidad. El investigador no divulgar\u00e1 tu nombre. Los resultados de la investigaci\u00f3n estar\u00e1n disponibles para ti cuando se finalicen. Tu nombre o material que indique tu participaci\u00f3n no se publicar\u00e1 sin tu permiso. No ser\u00e1s identificado en ninguna publicaci\u00f3n que pueda resultar de esta investigaci\u00f3n.
tcleBody61= Los investigadores tratar\u00e1n tu identidad con est\u00e1ndares profesionales de secreto, cumpliendo con la legislaci\u00f3n brasile\u00f1a
tcleBody62= (Resoluci\u00f3n No. 466/12 del Consejo Nacional de Salud)
tcleBody63= , y usando la informaci\u00f3n solo para fines acad\u00e9micos y cient\u00edficos. Los investigadores tambi\u00e9n tratar\u00e1n tus datos obtenidos en la investigaci\u00f3n de una manera que proteja tus derechos fundamentales a la libertad y privacidad y siguiendo los principios expresados por la
tcleBody64= Ley General de Protecci\u00f3n de Datos (LGPD, Ley No. 13.709/2018).
tcleBody71= Si tienes alguna pregunta sobre el proceso, te responderemos por correo electr\u00f3nico
tcleBody72= projeto.alcoolesaude@ufjf.br
tcleBody73= y si tienes alguna pregunta sobre \u00e9tica en la investigaci\u00f3n, puedes contactarnos por tel\u00e9fono
tcleBody74= (32) 2102-3788
tcleBody75= o por correo electr\u00f3nico
tcleBody76= cep.propp@ufjf.br.
