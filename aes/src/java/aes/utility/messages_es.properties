politicaDoSiteH43= 2.1. Consentimiento
politicaDoSiteP10= Algunas formas de usar la informaci\u00f3n descrita anteriormente pueden ser proporcionadas por terceros autorizados para usar esta informaci\u00f3n con estos fines.
politicaDoSiteP102= tratar tus datos.
politicaDoSiteP11= La informaci\u00f3n recopilada para este sitio tambi\u00e9n puede usarse para determinar patrones demogr\u00e1ficos de uso. La informaci\u00f3n personal no se usa para este prop\u00f3sito. Esta informaci\u00f3n an\u00f3nima se usa entonces para mejorar el sitio web y nuestros servicios. Esta informaci\u00f3n no se transmitir\u00e1 a terceros.
politicaDoSiteP111= Ley General de Protecci\u00f3n de Datos
politicaDoSiteP112= tus datos solo se recopilar\u00e1n, tratar\u00e1n y almacenar\u00e1n mediante previo y expreso consentimiento.
politicaDoSiteP12= Adem\u00e1s de los fines descritos anteriormente, el sitio no usar\u00e1 tu informaci\u00f3n sin consentimiento previo. La excepci\u00f3n a esta regla ser\u00e1 cuando el prop\u00f3sito de prevenir cualquier da\u00f1o a la salud o la justicia sea evidente.
politicaDoSiteP122= con sus voluntarios, siguiendo las regulaciones legislativas pertinentes.
politicaDoSiteP13= El sitio implementa procedimientos para garantizar la seguridad de los datos recopilados, evitando que la informaci\u00f3n se pierda, destruya, use o acceda de manera no autorizada. La informaci\u00f3n que proporciones solo ser\u00e1 accedida por personal autorizado.
politicaDoSiteP132= y proporcionar tus datos personales, est\u00e1s consciente y consintiendo con las disposiciones de esta Pol\u00edtica de Privacidad, adem\u00e1s de conocer tus derechos y c\u00f3mo ejercerlos.
politicaDoSiteP14= Sin embargo, ninguna transmisi\u00f3n de datos en internet o informaci\u00f3n contenida en nuestros servidores accedida a trav\u00e9s de internet es completamente segura. Estas actividades son de tu exclusiva responsabilidad.
politicaDoSiteP15= La informaci\u00f3n recopilada a trav\u00e9s del sitio web no se revelar\u00e1 ni se pasar\u00e1 a terceros a menos que sea de acuerdo con esta pol\u00edtica de privacidad. La informaci\u00f3n solo se proporcionar\u00e1 a terceros con autorizaci\u00f3n y para un prop\u00f3sito espec\u00edfico.
politicaDoSiteH33= 3. Seguridad de tus datos
politicaDoSiteP161= asegura a sus voluntarios sus derechos como titulares de los datos previstos en el art\u00edculo 18 de la
politicaDoSiteP163= De esta forma, puedes, de manera gratuita y en cualquier momento:
politicaDoSiteLi20= Confirmar la existencia de tratamiento de datos, de manera simplificada o en formato claro y completo;
politicaDoSiteLi21= Acceder a tus datos, pudiendo solicitarlos en una copia legible bajo forma impresa o por medio electr\u00f3nico, seguro e id\u00f3neo.
politicaDoSiteLi22= Corregir tus datos, al solicitar la edici\u00f3n, correcci\u00f3n o actualizaci\u00f3n de estos.
politicaDoSiteLi23= Limitar tus datos cuando sean innecesarios, excesivos o tratados en disconformidad con la legislaci\u00f3n mediante la anonimizaci\u00f3n, bloqueo o eliminaci\u00f3n.
politicaDoSiteLi24= Solicitar la portabilidad de tus datos, a trav\u00e9s de un informe de datos registrales que los sistemas
politicaDoSiteLi242= tratan respecto a ti.
politicaDoSiteLi25= Eliminar tus datos tratados a partir de tu consentimiento, excepto en los casos previstos en la ley.
politicaDoSiteLi26= Revocar tu consentimiento, desautorizando el tratamiento de tus datos.
politicaDoSiteLi27= Informarte sobre la posibilidad de no proporcionar tu consentimiento y sobre las consecuencias de la negativa.
politicaDoSiteH34= 4. Incumplimiento de la confidencialidad de la informaci\u00f3n
politicaDoSiteP17= Este sitio web puede cambiar el t\u00e9rmino de privacidad colocando una nueva versi\u00f3n en el sitio. Debes consultar esta p\u00e1gina ocasionalmente para familiarizarte con posibles cambios. Esta pol\u00edtica de privacidad puede cambiar con la introducci\u00f3n de nuevas regulaciones y leyes.
politicaDoSiteP18= Si tienes alguna pregunta, cont\u00e1ctanos desde la direcci\u00f3n projeto.alcoolesaude@ufjf.br
politicaDoSiteH35= 5. Enlaces a sitios web de terceros
politicaDoSiteP19= Tus datos personales recopilados por los sistemas
politicaDoSiteP192= ser\u00e1n utilizados y almacenados durante el tiempo necesario para la prestaci\u00f3n del servicio, para evaluaci\u00f3n de la investigaci\u00f3n o para que se alcancen los fines enumerados en la presente Pol\u00edtica de Privacidad, considerando los derechos de los titulares de los datos (voluntarios) y de los controladores.
politicaDoSiteP20= En general, tus datos se mantendr\u00e1n mientras dure la relaci\u00f3n contractual entre t\u00fa y los sistemas
politicaDoSiteP202= perdure. Finalizado el per\u00edodo de almacenamiento de los datos personales, estos ser\u00e1n eliminados de nuestras bases de datos o anonimizados, salvo las hip\u00f3tesis legalmente previstas en el art\u00edculo 16 de la Ley General de Protecci\u00f3n de Datos, a saber:
politicaDoSiteLi28= Cumplimiento de obligaci\u00f3n legal o regulatoria por el controlador;
politicaDoSiteLi29= Estudio por \u00f3rgano de investigaci\u00f3n, garantizada, siempre que sea posible, la anonimizaci\u00f3n de los datos personales;
politicaDoSiteLi30= Transferencia a tercero, siempre que se respeten los requisitos de tratamiento de datos dispuestos en esta Ley; o
politicaDoSiteLi31= Uso exclusivo del controlador, vedado su acceso por tercero, y siempre que se anonimicen los datos.
politicaDoSiteP21= Es decir, informaci\u00f3n personal sobre ti que sea imprescindible para el cumplimiento de determinaciones legales, judiciales y administrativas y/o para el ejercicio del derecho de defensa en procesos judiciales y administrativos se mantendr\u00e1, a pesar de la eliminaci\u00f3n de los dem\u00e1s datos.
politicaDoSiteP22= El almacenamiento de datos recopilados por los sistemas
politicaDoSiteP222= refleja nuestro compromiso con la seguridad y privacidad de tus datos. Empleamos medidas y soluciones t\u00e9cnicas de protecci\u00f3n aptas para garantizar la confidencialidad, integridad e inviolabilidad de tus datos. Adem\u00e1s, tambi\u00e9n contamos con medidas de seguridad apropiadas a los riesgos y con control de acceso a la informaci\u00f3n almacenada.
politicaDoSiteH36= 6. Cambios en la Declaraci\u00f3n de Privacidad
politicaDoSiteP23= Para mantener tu informaci\u00f3n personal segura, usamos herramientas f\u00edsicas, electr\u00f3nicas y gerenciales orientadas a la protecci\u00f3n de tu privacidad.
politicaDoSiteP24= Aplicamos estas herramientas teniendo en cuenta la naturaleza de los datos personales recopilados, el contexto y la finalidad del tratamiento y los riesgos que eventuales violaciones generar\u00edan para los derechos y libertades del titular de los datos recopilados y tratados.
politicaDoSiteP25= Entre las medidas que adoptamos, destacamos las siguientes:
politicaDoSiteLi32= Solo personas autorizadas tienen acceso a tus datos personales;
politicaDoSiteLi33= El acceso a tus datos personales se hace solo despu\u00e9s del compromiso de confidencialidad;
politicaDoSiteLi34= Tus datos personales se almacenan en un entorno seguro e id\u00f3neo.
politicaDoSiteP261= se compromete a adoptar las mejores posturas para evitar incidentes de seguridad. Sin embargo, es necesario destacar que ninguna p\u00e1gina virtual es completamente segura y libre de riesgos. Es posible que, a pesar de todos nuestros protocolos de seguridad, ocurran problemas de culpa exclusivamente de terceros, como ataques cibern\u00e9ticos de
politicaDoSiteP262= hackers
politicaDoSiteP263= o tambi\u00e9n como consecuencia de la negligencia o imprudencia del propio usuario/cliente.
politicaDoSiteP27= En caso de incidentes de seguridad que puedan generar riesgo o da\u00f1o relevante para ti o cualquiera de nuestros usuarios/clientes, comunicaremos a los afectados y a la Autoridad Nacional de Protecci\u00f3n de Datos sobre lo ocurrido, en consonancia con las disposiciones de la
politicaDoSiteP271= Ley General de Protecci\u00f3n de Datos.
politicaDoSiteH37= 7. Contacto
politicaDoSiteP28= Teniendo en vista la preservaci\u00f3n de tu privacidad, los sistemas
politicaDoSiteP282= no compartir\u00e1n tus datos personales con ning\u00fan tercero no autorizado.
politicaDoSiteP29= Adem\u00e1s, tambi\u00e9n existen otras hip\u00f3tesis en las que tus datos podr\u00e1n ser compartidos, que son:
politicaDoSiteLi35= Determinaci\u00f3n legal, requerimiento, requisici\u00f3n u orden judicial, con autoridades judiciales, administrativas o gubernamentales competentes.
politicaDoSiteLi36= Protecci\u00f3n de los derechos de
politicaDoSiteLi362= en cualquier tipo de conflicto, incluso los de car\u00e1cter judicial.
politicaDoSiteH38= 8. Cookies o datos de navegaci\u00f3n
politicaDoSiteP30= Los sistemas
politicaDoSiteP302= hacen uso de Cookies, que son archivos de texto enviados por la plataforma a tu computadora y que en ella se almacenan, que contienen informaci\u00f3n relacionada con la navegaci\u00f3n de los sitios.
politicaDoSiteP303= Las cookies no almacenan datos personales sensibles, solo datos anonimizados referentes a la navegaci\u00f3n de los sitios
politicaDoSiteP304= En resumen, las Cookies se utilizan para mejorar la experiencia de uso del respectivo sistema.
politicaDoSiteP31= Al acceder a nuestros sistemas y consentir con el uso de Cookies, manifiestas conocer y aceptar la utilizaci\u00f3n de un sistema de recolecci\u00f3n de datos de navegaci\u00f3n con el uso de Cookies en tu dispositivo.
politicaDoSiteP322= utilizan los siguientes Cookies:
politicaDoSiteLi37= Cookies esenciales: Son cookies referentes a la informaci\u00f3n de uso y navegaci\u00f3n por el usuario, recopiladas por los propios sistemas con la finalidad de mejorar la experiencia, el uso y el rendimiento del uso de los mismos. Todas las cookies recopiladas por los sistemas
politicaDoSiteLi372= son Cookies persistentes, es decir, que poseen un tiempo de vida predefinido y expiran despu\u00e9s de llegar a su fecha de validez; y Cookies de sesi\u00f3n, que solo existen y perduran mientras el usuario est\u00e9 con el navegador abierto.
politicaDoSiteP33= Nuestros sistemas poseen enlaces y productos que redirigen al usuario a otros dominios de sitio web o que ofrecen al usuario un servicio de terceros dentro de nuestros propios sistemas. Al interactuar con estos enlaces y productos de terceros, se generan cookies por medio de estos terceros.
politicaDoSiteP331= \u00c1lcool e Sa\u00fade no se responsabiliza por el compartimiento de datos del usuario a terceros, as\u00ed como la generaci\u00f3n de cookies por estos
politicaDoSiteP332= Recomendamos que leas sobre la pol\u00edtica de privacidad y uso de los datos de estos terceros antes de usar sus servicios o acceder a sus dominios.
politicaDoSiteP34= Puedes, en cualquier momento y sin ning\u00fan costo, alterar los permisos, bloquear o rechazar las Cookies. Sin embargo, la revocaci\u00f3n del consentimiento de determinadas Cookies puede imposibilitar el funcionamiento correcto de algunos recursos de la plataforma. Puedes gestionar los permisos de Cookies en tu navegador o aplicaci\u00f3n.
politicaDoSiteH39= 9. Modificaci\u00f3n de esta Pol\u00edtica de Privacidad
politicaDoSiteP35= La versi\u00f3n actual de la Pol\u00edtica de Privacidad fue formulada y actualizada por \u00faltima vez en:
politicaDoSiteP351= 15 de enero de 2025
politicaDoSiteP36= Nos reservamos el derecho de modificar esta Pol\u00edtica de Privacidad en cualquier momento, principalmente en funci\u00f3n de la adecuaci\u00f3n a eventuales cambios realizados en nuestros sistemas o en el \u00e1mbito legislativo. Recomendamos que la revises con frecuencia.
politicaDoSiteP37= Las eventuales modificaciones entrar\u00e1n en vigor a partir de su publicaci\u00f3n en nuestros sistemas y te notificaremos acerca de los cambios ocurridos.
politicaDoSiteP38= Al utilizar nuestros servicios y proporcionar tus datos personales despu\u00e9s de tales modificaciones, consientes las mismas.
politicaDoSiteH310= 10. Responsabilidad
politicaDoSiteP392= prev\u00e9n la responsabilidad de los agentes que act\u00faan en los procesos de tratamiento de datos, en conformidad con los art\u00edculos 42 al 45 de la Ley General de Protecci\u00f3n de Datos.
politicaDoSiteP40= Nos comprometemos a mantener esta Pol\u00edtica de Privacidad actualizada, observando sus disposiciones y velando por su cumplimiento.
politicaDoSiteP421= Autoridad Nacional de Protecci\u00f3n de Datos
politicaDoSiteP422= exija la adopci\u00f3n de providencias en relaci\u00f3n al tratamiento de datos realizado por
politicaDoSiteP424= nos comprometemos a seguirlas.
politicaDoSiteH44= 10.1 Exenci\u00f3n de responsabilidad
politicaDoSiteP432= no se responsabiliza por:
politicaDoSiteLi38= Cualesquiera consecuencias derivadas de la negligencia, imprudencia o impericia de los usuarios en relaci\u00f3n a sus datos individuales. Garantizamos y nos responsabilizamos solo por la seguridad de los procesos de tratamiento de datos y del cumplimiento de los fines descritos en el presente instrumento.
politicaDoSiteP44= Destacamos que la responsabilidad en relaci\u00f3n a la confidencialidad de los datos de acceso es del usuario.
politicaDoSiteLi39= Acciones maliciosas de terceros, como ataques de hackers, excepto si se comprueba conducta culposa o deliberada de
politicaDoSiteP45= Destacamos que en caso de incidentes de seguridad que puedan generar riesgo o da\u00f1o relevante para ti o cualquiera de nuestros usuarios/clientes, comunicaremos a los afectados y a la
politicaDoSiteP452= sobre lo ocurrido y cumpliremos las providencias necesarias.
politicaDoSiteLi40= Inexactitud de la informaci\u00f3n insertada por el usuario/cliente en los registros necesarios para la utilizaci\u00f3n de los servicios de
politicaDoSiteLi402= cualesquiera consecuencias derivadas de informaci\u00f3n falsa o insertada de mala fe son de entera responsabilidad del voluntario.
