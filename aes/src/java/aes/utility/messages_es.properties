alternativePlanFissureText01= Plan para resistir el deseo de beber (antojo)
estrategiaDimAltPlanFisLi1= Algunos eventos a tu alrededor pueden hacerte sentir muchas ganas de beber
alternativePlanFissureText03= Cuando esto sucede, debes considerar estas tres opciones:
estrategiaDimAltPlanFisL12= Recuerda las razones que te llevaron a cambiar la forma de beber (mant\u00e9nlo por escrito o grabado en tu tel\u00e9fono/computadora)
