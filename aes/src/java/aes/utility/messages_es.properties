alternativePlanFissureText07= Acepta tu antojo
alternativePlanFissureText08= En lugar de luchar contra lo que sientes, ac\u00e9ptalo y espera a que tu deseo pase.
estrategiaDimAltPlanFisP4= Incluso el deseo m\u00e1s intenso de beber pasar\u00e1 - generalmente en unos minutos. Recordar esto te ayudar\u00e1
alternativePlanFissureText10= Piensa en este deseo como una ola que golpea fuertemente una playa pero pierde fuerza despu\u00e9s de un tiempo.
