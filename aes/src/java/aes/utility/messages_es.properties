doseChatInformationStepControl02= Aqu\u00ed hay alguna informaci\u00f3n sobre lo que significan los t\u00e9rminos contexto y consecuencia del consumo de alcohol:
doseChatInformationStepControl03= \u1f7e6 Contexto
doseChatInformationStepControl04= El contexto es la situaci\u00f3n en la que ocurri\u00f3 el consumo de alcohol. Esto incluye el entorno f\u00edsico, las personas a tu alrededor e incluso tu estado emocional en ese momento.
