welcome= Hola, \u00a1bienvenido al programa Alcohol y Salud! Siempre puedes volver al programa, acceder a informaci\u00f3n y herramientas que pueden ayudarte.<br/><h1>Tu opini\u00f3n es muy importante - accede al enlace a continuaci\u00f3n para hacernos saber qu\u00e9 piensas del programa - \u00a1es r\u00e1pido! <h1/><form action= "http://www.alcoolesaude.com.br/pesquisa-satisfacao.xhtml"><input type= "hidden" name= "hid" value= "#id#"/><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px">Encuesta de Satisfacci\u00f3n</button></form>
emailMsgSubjectDiaryStarted= Hola #user#, \u00bfhas usado el registro electr\u00f3nico esta semana? El registro se puede hacer r\u00e1pidamente y te ayuda a monitorear si est\u00e1s alcanzando tus metas. Accede a tu registro en el enlace a continuaci\u00f3n: <br/> <form action= "http://www.alcoolesaude.com.br/mantendo-resultados-introducao.xhtml"><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px">Manteniendo mis resultados</button></form>
progressPersistchallengesReduce= Hola #user#, hemos verificado en nuestro sistema que has elegido disminuir tu consumo de alcohol. Accediendo al enlace a continuaci\u00f3n, puedes revisar estrategias que ayudan a las personas a beber menos. <br/> <form action= "http://www.alcoolesaude.com.br/mantendo-resultados-introducao.xhtml"><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px">Manteniendo mis resultados</button></form>
progressPersistchallengesQuit= Hola #user#, hemos verificado en nuestro sistema que has elegido dejar de beber alcohol. Accediendo al enlace a continuaci\u00f3n, puedes aprender m\u00e1s sobre estrategias que pueden ayudar a las personas a dejar de beber. <br/> <form action= "http://www.alcoolesaude.com.br/mantendo-resultados-introducao.xhtml"><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px">Manteniendo mis resultados</button></form>
progressKeepingresultReduce= Hola #user#, las personas que intentan dejar o reducir la cantidad que beben pueden tener un momento dif\u00edcil y pueden terminar recayendo (es decir, no pudiendo mantener su meta). Ve a la fase Manteniendo tus Resultados de Alcohol y Salud para m\u00e1s informaci\u00f3n. <br/> <form action= "http://www.alcoolesaude.com.br/mantendo-resultados-introducao.xhtml"><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px">Manteniendo mis resultados</button></form>
progressKeepingresultQuit= Hola #user#, las personas que intentan dejar o reducir la cantidad que beben pueden tener un momento dif\u00edcil y pueden terminar recayendo (es decir, no pudiendo mantener su meta). <br/><form action= "http://www.alcoolesaude.com.br/"><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px">Accede a Alcohol y Salud aqu\u00ed y conoce m\u00e1s</button></form>
annualscreening= Hola #user#, ha pasado un a\u00f1o desde que te registraste en el programa Alcohol y Salud! Te recomendamos que hagas tu evaluaci\u00f3n nuevamente, aprovecha esta oportunidad para aprender m\u00e1s sobre el impacto del alcohol en tu salud. Accede al enlace del sitio web a continuaci\u00f3n: <br/><form action= "http://www.alcoolesaude.com.br/"><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px">Alcohol y Salud</button></form>
week1= Hola #user#, esta es la primera semana despu\u00e9s de registrarte en el programa Alcohol y Salud. \u00bfEst\u00e1s pensando en cambiar la forma en que bebes? Las primeras semanas pueden ser dif\u00edciles, y un buen consejo es registrar tu consumo. Puedes hacerlo accediendo al enlace a continuaci\u00f3n: <br/><form action= "http://www.alcoolesaude.com.br/pesquisa-acompanhamento.xhtml"><input type= "hidden" name= "hid" value= "#id#" /><input type= "hidden" name= "hwk" value= "1357" /><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px"> Evaluando mi consumo.</button></form>
week2= Hola #user#, han pasado dos semanas desde que te registraste en el programa Alcohol y Salud. Las primeras semanas pueden ser m\u00e1s dif\u00edciles. Si necesitas ayuda o m\u00e1s informaci\u00f3n sobre c\u00f3mo beber menos, vuelve al programa y revisa nuestros consejos. Accede al enlace para tu evaluaci\u00f3n de la segunda semana a continuaci\u00f3n: <br/><form action= "http://www.alcoolesaude.com.br/pesquisa-acompanhamento.xhtml"><input type= "hidden" name= "hid" value= "#id#" /><input type= "hidden" name= "hwk" value= "2714" /><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px"> Evaluando mi consumo.</button></form>
week3= Hola #user#, han pasado tres semanas desde que te registraste en el programa Alcohol y Salud. El primer mes es uno de los pasos m\u00e1s desafiantes para cambiar el comportamiento. Accede al enlace para tu evaluaci\u00f3n de la tercera semana a continuaci\u00f3n: <br/><form action= "http://www.alcoolesaude.com.br/pesquisa-acompanhamento.xhtml"><input type= "hidden" name= "hid" value= "#id#" /><input type= "hidden" name= "hwk" value= "4071" /><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px"> Evaluando mi consumo.</button></form>
week4= Hola #user#, ha pasado un mes desde que comenzaste tu plan para beber menos y cuidar mejor tu salud! El primer mes es uno de los pasos m\u00e1s dif\u00edciles para modificar el comportamiento. Nos gustar\u00eda aprovechar esta oportunidad para conocer tu experiencia hasta ahora. A trav\u00e9s del enlace a continuaci\u00f3n, puedes contarnos c\u00f3mo has enfrentado este desaf\u00edo y ayudar a mejorar el programa.<br/><form action= "http://www.alcoolesaude.com.br/pesquisa-acompanhamento.xhtml"><input type= "hidden" name= "hid" value= "#id#" /><input type= "hidden" name= "hwk" value= "5428" /><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px">Eval\u00faa c\u00f3mo ha ido el proceso hasta ahora.</button></form>
week8= Hola #user#, han pasado dos meses desde que comenzaste tu plan para beber menos y cuidar mejor tu salud! Nos gustar\u00eda aprovechar esta oportunidad para conocer tu experiencia hasta ahora. A trav\u00e9s del enlace a continuaci\u00f3n, puedes contarnos c\u00f3mo has enfrentado este desaf\u00edo. <br/><form action= "http://www.alcoolesaude.com.br/pesquisa-acompanhamento.xhtml"><input type= "hidden" name= "hid" value= "#id#" /><input type= "hidden" name= "hwk" value= "10856" /><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px">Eval\u00faa c\u00f3mo ha ido el proceso hasta ahora.</button></form>
week12= Hola #user#, han pasado tres meses desde que comenzaste tu plan para beber menos y cuidar mejor tu salud! Nos gustar\u00eda aprovechar esta oportunidad para conocer tu experiencia hasta ahora. A trav\u00e9s del enlace a continuaci\u00f3n, puedes contarnos c\u00f3mo has enfrentado este desaf\u00edo.<br/><form action= "http://www.alcoolesaude.com.br/pesquisa-acompanhamento.xhtml"><input type= "hidden" name= "hid" value= "#id#" /><input type= "hidden" name= "hwk" value= "16284" /><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px">Eval\u00faa c\u00f3mo ha ido el proceso hasta ahora.</button></form>
week24= Hola #user#, han pasado seis meses desde que comenzaste tu plan para beber menos y cuidar mejor tu salud! Nos gustar\u00eda aprovechar esta oportunidad para conocer tu experiencia hasta ahora. A trav\u00e9s del enlace a continuaci\u00f3n, puedes contarnos c\u00f3mo has enfrentado este desaf\u00edo. <br/><form action= "http://www.alcoolesaude.com.br/pesquisa-acompanhamento.xhtml"><input type= "hidden" name= "hid" value= "#id#" /><input type= "hidden" name= "hwk" value= "32568" /><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px">Eval\u00faa c\u00f3mo ha ido el proceso hasta ahora.</button></form>
week48= Hola #user#, ha pasado un a\u00f1o desde que comenzaste tu plan para beber menos y cuidar mejor tu salud! Nos gustar\u00eda aprovechar esta oportunidad para conocer tu experiencia hasta ahora. A trav\u00e9s del enlace a continuaci\u00f3n, puedes contarnos c\u00f3mo has enfrentado este desaf\u00edo. <br/><form action= "http://www.alcoolesaude.com.br/pesquisa-acompanhamento.xhtml"><input type= "hidden" name= "hid" value= "#id#" /><input type= "hidden" name= "hid" value= "#id#" /><input type= "hidden" name= "hwk" value= "65136" /><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px">Eval\u00faa c\u00f3mo ha ido el proceso hasta ahora.</button></form>
tipTitleTitle= T\u00edtulo
tipDescriptionTitle= Descripci\u00f3n en ingl\u00e9s
tip1= Bebe un vaso de agua o un refresco despu\u00e9s de cada bebida alcoh\u00f3lica. Sentir\u00e1s menos deseo de beber.
tip2= Nunca bebas directamente de la botella. De esa forma, no puedes controlar cu\u00e1nto est\u00e1s bebiendo.
tip3= \u00bfQuieres dejar de beber? Pide a las personas que no te ofrezcan bebidas alcoh\u00f3licas.
tip4= Siempre bebe en sorbos peque\u00f1os. Esto har\u00e1 que bebas menos.
tip5= \u00a1No hay nada de malo en rechazar una bebida alcoh\u00f3lica! Recuerda que...
tip6= Decide el n\u00famero m\u00e1ximo de bebidas est\u00e1ndar que consumir\u00e1s por semana - Sigue tu meta para obtener mejores resultados.
tip7= Decide d\u00f3nde beber\u00e1s y d\u00f3nde no. Decidir esto de antemano aumenta tus chances de evitar problemas.
tip8= Permanece sin beber bebidas alcoh\u00f3licas durante al menos 2 d\u00edas a la semana. Esto reduce el h\u00e1bito de beber y ayuda a tu cuerpo a recuperarse.
tipDescription9= Cuando tu vaso est\u00e9 medio lleno, toma un descanso y deja de beber durante 15 minutos. Notar\u00e1s que bebes menos usando esta estrategia.
tipDescription10= Cada vez que empieces a sentir el deseo de beber, comienza a hacer algo divertido que no involucre alcohol. Con el tiempo beber\u00e1s menos.
tip11= No bebas alcohol cuando te sientas triste o enojado. El consumo de alcohol puede contribuir a empeorar tus problemas.
tip12= Si est\u00e1s tomando medicamentos, considera no beber - la mayor\u00eda interact\u00faa con el alcohol, lo que puede tener efectos peligrosos en tu cuerpo.
tipDescription13= Si sientes un fuerte deseo de beber, habla con alguien que pueda ayudarte. Te beneficiar\u00e1s al compartir tus sentimientos y pensamientos.
tip14= Intenta cambiar tu estilo de vida, evitando beber y aumentando h\u00e1bitos saludables. Tu salud mejorar\u00e1, aumentando tu calidad de vida.
tipDescription15= Comunica a tus amigos tu decisi\u00f3n de reducir la frecuencia y cantidad de consumo de alcohol \u2013 pueden ayudarte a mantener tu decisi\u00f3n al no ofrecerte bebidas.
tip16= A las personas les gusta y admiran saber que alguien est\u00e1 intentando ser m\u00e1s saludable. No te averg\u00fcences de decir que est\u00e1s reduciendo tu consumo de alcohol, pensando en tu salud.
tip17= Intenta estar en compa\u00f1\u00eda de personas que no beban en exceso. Descubrir\u00e1s una amplia gama de nuevas oportunidades para divertirte.
tip18= Evita lugares, personas y alimentos fuertemente asociados con el uso de alcohol. Evitar este tipo de situaciones aumenta tus chances de beber menos.
tipDescription19= \u00a1Mantente alerta! Si necesitas cantidades mayores que antes para sentir los mismos efectos del alcohol, esto indica un problema significativo, pero se puede resolver si intentas dejar de beber, al menos por un tiempo.
tip20= Presta atenci\u00f3n a los comentarios de otras personas sobre tus h\u00e1bitos de bebida \u2013 pueden tener raz\u00f3n cuando comentan sobre tu consumo excesivo de alcohol.
tip21= No te rindas en tus metas; cuanto m\u00e1s persistamos, mayores ser\u00e1n nuestras chances de \u00e9xito. Contin\u00faa en el camino para beber menos; si has tenido un desliz, usa esta ocasi\u00f3n como recordatorio de lo importante que es seguir bebiendo menos.
tip22= Evita guardar bebidas alcoh\u00f3licas en casa. En su lugar, intenta guardar jugos, refrescos u otras bebidas sin alcohol para que puedas consumirlas cuando te apetezca.
tip23= Si sientes un fuerte deseo de beber, intenta hacer algo de ejercicio en lugar de beber - te sentir\u00e1s mejor.
tip24= Usa al menos seis sorbos para vaciar tu vaso. Esto crea una regla que har\u00e1 que tarde m\u00e1s en vaciar tu vaso, lo que te llevar\u00e1 a beber menos como resultado.
tip25= Evita las bebidas alcoh\u00f3licas y, especialmente, evita mezclar diferentes tipos de bebidas. Cuando mezclas diferentes tipos de bebidas, es m\u00e1s dif\u00edcil contar y planificar el n\u00famero de bebidas est\u00e1ndar que consumir\u00e1s.
tip26= Accede a tu diario electr\u00f3nico cada vez que sientas ganas de beber y considera las metas que has establecido. Recordar tus metas siempre ser\u00e1 muy \u00fatil.
tip27= Evita consumir alcohol para relajarte; intenta encontrar alternativas, como ejercicio y hobbies.
tipDescription28= \u00bfQuieres beber menos? Intenta seguir las estrategias de reducci\u00f3n que mejor se adapten a ti.
tipDescription29= Cuando tu vaso est\u00e9 vac\u00edo, piensa en las consecuencias de beber un poco m\u00e1s. Superar las dosis que planeaste puede llevar a problemas para controlar tu consumo.
tip30= Las personas que realmente se preocupan por ti se quedar\u00e1n a tu lado incluso si eliges beber menos. No necesitas beber para estar con tus amigos.
tip31= Siempre registra con qu\u00e9 frecuencia y cu\u00e1nto bebes durante una semana. Evita beber "autom\u00e1ticamente" sin darte cuenta de cu\u00e1nto est\u00e1s bebiendo. Contar la cantidad de bebida que consumes es la mejor forma de alcanzar tu meta de beber menos.
tip32= Reducir tu consumo de alcohol puede no ser una tarea f\u00e1cil, pero si te esfuerzas por alcanzar esta meta, tendr\u00e1s una mayor chance de \u00e9xito.
tipDescription33= Aprende que es tu derecho rechazar una bebida cuando alguien te la ofrece. Siempre di no, \u00a1muchas gracias! Esta f\u00f3rmula es simple y puede ayudar en varias situaciones.
tipDescription34= Si quieres dejar de beber pero te ha resultado dif\u00edcil, busca un profesional de la salud que pueda ayudarte. Pedir ayuda puede ser un paso dif\u00edcil, pero traer\u00e1 importantes recompensas en el futuro.
tip35= Si pasas demasiado tiempo bebiendo, piensa en mejores alternativas: como qu\u00e9 hacer con tu familia, padres y amigos.
tipDescription36= Incluso si est\u00e1s bebiendo menos, nunca conduzcas despu\u00e9s de beber. Pensar en tu salud tambi\u00e9n implica pensar en evitar accidentes.
tipDescription37= Siempre piensa en las consecuencias y tu salud antes de comenzar a beber. Crea este h\u00e1bito de pensar en las consecuencias antes de comenzar a beber.
tip38= No bebas con el est\u00f3mago vac\u00edo. Siempre ten una buena comida antes de comenzar a beber; esto te ayudar\u00e1 a beber menos.
tip39= Evita la compa\u00f1\u00eda de personas con las que usualmente bebes mucho. Esto puede ser dif\u00edcil al principio, pero puede contribuir mucho a alcanzar tu meta de beber menos.
tip40= Siempre recuerda discutir y pedir apoyo para beber menos a tus colegas, amigos y familia. Cuando compartimos nuestros problemas, es m\u00e1s f\u00e1cil enfrentar nuestras dificultades.
tip41= Practica c\u00f3mo decir NO de forma simple. No necesitas explicaciones largas para evitar beber en situaciones donde las personas te presionan.
tipDescription42= Evita participar en juegos o concursos de bebida. Estos juegos a menudo involucran grandes cantidades de bebida, consumidas muy r\u00e1pidamente, aumentando el riesgo de problemas resultantes del consumo.
tip43= Cuando vayas a una fiesta o un espect\u00e1culo, evita beber antes de llegar a ese lugar. Beber antes de la fiesta puede aumentar tus chances de tener problemas durante la fiesta.
tip44= Evita actividades sociales que involucren beber. Especialmente evita aquellas enfocadas exclusivamente en el consumo de alcohol.
tipDescription45= Un ejercicio que puede ayudarte es evitar tomar el primer sorbo. Espera alrededor de 1 o 2 horas antes de comenzar a beber; este tiempo puede ayudarte a controlar el deseo de beber y pensar en las consecuencias negativas del consumo.
tip46= Evita beber antes o durante el desayuno. Si sientes un fuerte deseo o necesidad de beber por la ma\u00f1ana, busca ayuda de un profesional que pueda asistirte.
tip47= Recuerda comer antes y/o mientras est\u00e1s bebiendo. Cuanto mejor nutrido est\u00e9s, menores ser\u00e1n tus chances de beber en mayores cantidades.
tip48= Decide tus l\u00edmites y no los excedas. Esta es una regla de oro que puede ayudarte mucho.
tipDescription49= Evita participar en rondas. Estas ocasiones pueden contribuir a que consumas alcohol m\u00e1s all\u00e1 de lo que hab\u00edas planeado.
tip50= No te rindas si no logras alcanzar tus metas en el primer intento. Sigue intent\u00e1ndolo, \u00a1es el paso m\u00e1s importante!
tip51= No te preocupes si en alg\u00fan momento consumes m\u00e1s de lo planeado. Entiende esto como una se\u00f1al de que a\u00fan necesitas persistir en tu meta.
tip52= Cuando notes los primeros signos de que te est\u00e1s mareando por beber, toma un descanso. Pide a un amigo que te lo recuerde.
tip53= La mejor forma de evitar una resaca es bebiendo menos. Una resaca indica que tu cuerpo est\u00e1 intoxicado por el alcohol y est\u00e1 expuesto a da\u00f1os para la salud.
tipDescription54= Bebe mucha agua antes de consumir cualquier bebida alcoh\u00f3lica. Considera este consejo especialmente si tienes sed.
tipDescription55= Identifica las cosas, im\u00e1genes y pensamientos que contribuyen a tu bienestar. Muchas personas se exceden con el alcohol porque est\u00e1n tristes o enojadas.
tip56= Incluye una actividad f\u00edsica de ocio en alguna parte de tu d\u00eda. Las actividades f\u00edsicas, adem\u00e1s de contribuir a tu salud, pueden ayudarte en el proceso de beber menos.
tip57= Intenta desarrollar un hobby que te mantenga interesado y ocupado en tu tiempo libre. Esta es una buena estrategia para ocupar tu d\u00eda y ayudarte a sentirte mejor.
tip58= Intenta hacer ejercicios de respiraci\u00f3n o alguna forma de relajaci\u00f3n todos los d\u00edas. Buscar momentos en tu d\u00eda para relajarte puede tener un impacto positivo en tu salud.
tip59= Evita quedarte cerca de bares, restaurantes o caf\u00e9s que sirvan alcohol. Estos lugares pueden hacerte sentir m\u00e1s ganas de beber.
tip60= No olvides recompensarte, incluso por peque\u00f1os cambios positivos. Cada d\u00eda y cada semana que logres alcanzar tus metas, aprovecha para recompensarte con peque\u00f1os premios.
tip61= El estr\u00e9s puede ser una gran excusa para consumir m\u00e1s alcohol. Encuentra cosas que ayuden a reducir tu estr\u00e9s que no involucren consumo de alcohol.
tipDescription62= Involucra a un amigo o familiar de confianza para que te ayude a mantenerte motivado. Comparte con ellos las metas que has alcanzado y tambi\u00e9n los momentos de dificultad.
tip63= Habla con un amigo o familiar cuando sientas la necesidad de beber.
tip64= Siempre bebe mucha agua. Mantenerte hidratado puede ayudar a reducir tu deseo de beber alcohol.
tip65= Mant\u00e9n pensamientos positivos. Intenta visualizar una vida m\u00e1s saludable con mayor calidad de vida.
tip66= Recuerda tu meta todos los d\u00edas. Cree que puedes alcanzar tus metas.
tip67= Establece metas realistas. Ser demasiado ambicioso, queriendo un cambio muy abrupto, puede ser menos ventajoso que un cambio gradual y continuo.
