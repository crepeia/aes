preparandoDiminuirPararFacet1= \u00bfTe gustar\u00eda dejar de beber o disminuir la cantidad que bebes?
preparingDecreaseOrStop02= Reducir
preparingDecreaseOrStop03= Dejar de beber
preparandoDiminuirPararNaoTitle1= \u00bfTodav\u00eda no est\u00e1s pensando en cambiar? | Alcohol y Salud
preparandoDiminuirH11= Todav\u00eda no est\u00e1s pensando en cambiar
preparandoDiminuirP1= Aunque el alcohol puede causar problemas, respondiste que todav\u00eda no est\u00e1s listo para cambiar
preparingDecreaseStopNo01= Considera las siguientes sugerencias durante este per\u00edodo
preparandoDiminuirLi1= Sigue prestando atenci\u00f3n a cu\u00e1nto has estado bebiendo, considerando frecuencia y cantidad
preparandoDiminuirLi2= Intenta entender cu\u00e1nto te afecta el alcohol
preparandoDiminuirLi3= Aborda otras prioridades que pueden estar obstaculizando tu cambio
preparandoDiminuirLi4= Pide ayuda a un amigo, profesional de la salud u otra persona de confianza
preparandoDiminuirLi5= Vuelve a hacer la evaluaci\u00f3n en el sitio web, principalmente considera los pros y contras de cambiar
preparingDecreaseStopNo07= Prevenci\u00f3n - no esperes un problema mayor o m\u00e1s grave
preparandoDiminuirLi7= Cuanto antes cambiemos, mayores ser\u00e1n nuestras chances de \u00e9xito y menores ser\u00e1n los da\u00f1os para el individuo y la familia
