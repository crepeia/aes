tip= Consejo
tip10= Cada vez que empieces a sentir ganas de beber, comienza a hacer algo divertido que no involucre alcohol. Con el tiempo, beber\u00e1s menos.
tip13= Si sientes un fuerte deseo de beber, habla con alguien que pueda ayudarte. Te beneficiar\u00e1s al compartir tus sentimientos y pensamientos.
tip15= Comunica a tus amigos tu decisi\u00f3n de reducir la frecuencia y cantidad de consumo de alcohol \u2013 pueden ayudarte a mantener tu decisi\u00f3n al no ofrecerte bebidas.
tip19= \u00a1Mantente alerta! Si necesitas cantidades mayores que antes para sentir los mismos efectos del alcohol, esto indica un problema significativo, pero se puede resolver si intentas dejar de beber, al menos por un tiempo.
tip28= \u00bfQuieres beber menos? Intenta seguir las estrategias de reducci\u00f3n que mejor se adapten a ti.
tip29= Cuando tu vaso est\u00e9 vac\u00edo, piensa en las consecuencias de beber un poco m\u00e1s. Superar las bebidas est\u00e1ndar que planeaste puede llevar a problemas para controlar tu consumo.
tip33= Aprende que es tu derecho rechazar una bebida cuando alguien te la ofrece. Siempre di no, \u00a1muchas gracias! Esta f\u00f3rmula es simple y puede ayudar en varias situaciones.
tip34= Si quieres dejar de beber pero te ha resultado dif\u00edcil, busca ayuda de un profesional de la salud que pueda asistirte. Pedir ayuda puede ser un paso dif\u00edcil, pero traer\u00e1 importantes recompensas en el futuro.
tip36= Incluso si est\u00e1s bebiendo menos, nunca conduzcas despu\u00e9s de beber. Pensar en tu salud tambi\u00e9n implica pensar en evitar accidentes.
tip37= Siempre piensa en las consecuencias y tu salud antes de comenzar a beber. Crea este h\u00e1bito de pensar en las consecuencias antes de comenzar a beber.
tip42= Evita participar en juegos o concursos de bebida. Estos juegos a menudo involucran grandes cantidades de bebida, consumidas muy r\u00e1pidamente, aumentando el riesgo de problemas resultantes del consumo.
tip45= Un ejercicio que puede ayudarte es evitar tomar el primer sorbo. Espera alrededor de 1 o 2 horas antes de comenzar a beber; este tiempo puede ayudarte a controlar el deseo de beber y pensar en las consecuencias negativas del consumo.
tip49= Evita participar en rondas. Estas ocasiones pueden llevarte a consumir alcohol m\u00e1s all\u00e1 de lo que hab\u00edas planeado.
tip54= Bebe mucha agua antes de consumir cualquier bebida alcoh\u00f3lica. Considera este consejo especialmente si tienes sed.
tip55= Identifica las cosas, im\u00e1genes y pensamientos que contribuyen a tu bienestar. Muchas personas se exceden con el alcohol porque est\u00e1n tristes o enojadas.
tip62= Involucra a un amigo o familiar de confianza para que te ayude a mantenerte motivado. Comparte con ellos las metas que has alcanzado y tambi\u00e9n los momentos de dificultad.
tip9= \u00bfTu vaso est\u00e1 medio vac\u00edo? Toma un descanso y deja de beber durante 15 minutos. Notar\u00e1s que beber\u00e1s menos usando esta estrategia.
