tcleHelpText1= \u00a1Participa en la investigaci\u00f3n de recolecci\u00f3n de datos y ay\u00fadanos!!
tcleHelpText2= Al participar, recibir\u00e1s diariamente una notificaci\u00f3n que contiene una pregunta.
tcleHelpText3= Para participar, solo haz clic en el bot\u00f3n "Participar en investigaci\u00f3n" y elige a qu\u00e9 hora quieres recibir notificaciones para comenzar a participar.
tcleHelpText4= Para m\u00e1s informaci\u00f3n y para acceder al T\u00e9rmino de Consentimiento Libre e Informado, haz clic en las palabras "T\u00e9rmino de Consentimiento Libre e Informado".
