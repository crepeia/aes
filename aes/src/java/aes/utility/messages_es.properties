vivasemtabacoTitle= Alcohol y Salud | Programa gratuito para prevenir el abuso de alcohol
prontoIntroP1= \u00a1Felicitaciones por tu decisi\u00f3n! Te ayudaremos a crear un plan personalizado.
prontoIntroP2= Aqu\u00ed encontrar\u00e1s informaci\u00f3n tomada de estudios cient\u00edficos y escrita por expertos.
prontoIntroP3= Este programa no sustituye una consulta m\u00e9dica tradicional. Te recomendamos que tambi\u00e9n busques ayuda de un profesional de la salud.
adultNotDrink01= Recomendaciones
prontoIntroLi1= Construir\u00e1s un plan para dejar de fumar. Intenta hacer los pasos en orden.
prontoIntroLi2= Puedes cambiarlo en cualquier momento. Haz clic en el elemento deseado en la barra lateral.
prontoIntroLi3a= Si no quieres dejar de fumar, te recomendamos volver al primer paso:
prontoIntroLi3b= "Prepar\u00e1ndose para dejarlo"
prontoIntroNextH2= Siguiente paso
imgRef= Cr\u00e9dito de la foto:
prontoIntroNextP= \u00bfQu\u00e9 es la abstinencia y c\u00f3mo lidiar con ella? Conoce m\u00e1s.
next= siguiente
prontoAbsTitlepage= Abstinencia - qu\u00e9 es y c\u00f3mo lidiar
prontoAbsImg= La abstinencia es un obst\u00e1culo
prontoAbsP1= La abstinencia es una reacci\u00f3n natural del organismo a la ausencia de nicotina presente en los cigarrillos.
prontoAbsP2= Los s\u00edntomas comunes de abstinencia son: dolores de cabeza, mareos, alteraciones del sue\u00f1o e irritaci\u00f3n.
prontoAbsP3= Es importante reconocer y aceptar estos s\u00edntomas, sabiendo que durar\u00e1n un promedio de 1 a 3 semanas.
prontoAbsP4= Aunque parezca mucho tiempo, es importante reconocer que los s\u00edntomas de abstinencia pasar\u00e1n con el tiempo.
prontoAbsP5= Durante el per\u00edodo de abstinencia, puedes sentir un deseo intenso de fumar - o fisura.
prontoAbsNextP= Aprende c\u00f3mo superar el deseo de fumar o fisura.
back= atr\u00e1s
prontoAbsRefP1= Fuentes: U.S Department of Health and Human Services (2008). Treating Tobacco Use and Dependence: 2008 Update: Clinical Practice Guideline. DIANE Publishing.
prontoFisTitlepage= Fisura - T\u00e9cnicas para enfrentar la fisura
prontoFisImg= Fisura
prontoFisP1= El deseo de fumar - o fisura - es muy com\u00fan en personas que est\u00e1n dejando de fumar.
