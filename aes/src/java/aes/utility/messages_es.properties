quantoVoceBebeSimGravidezTitle= Cu\u00e1nto bebes - Informaci\u00f3n para mujeres embarazadas | Alcohol y Salud
pregnantAdultDrink01= Informaci\u00f3n para mujeres embarazadas
quantoVoceBebeSimGravidezH31= \u00a1Cuidado!
quantoVoceBebeSimGravidezH32= M\u00e1s informaci\u00f3n sobre el alcohol
quantoVoceBebeSimGravidezH33= Seguimiento anual
quantoVoceBebeSimGravidezP1= Has informado que bebes alcohol - lo cual es muy perjudicial para el desarrollo de tu beb\u00e9.
quantoVoceBebeSimGravidezP2= Es esencial que permanezcas sin beber durante todo tu embarazo e incluso mientras est\u00e1s amamantando.
quantoVoceBebeSimGravidezP3= Recomendamos encarecidamente que dejes de beber y que busques, lo antes posible, un profesional de la salud que pueda ayudarte.
quantoVoceBebeSimGravidezP4= Esta aplicaci\u00f3n a\u00fan no tiene herramientas espec\u00edficas para mujeres embarazadas.
pregnantAdultDrink04= Te recomendamos que leas las preguntas y respuestas sobre el alcohol y el embarazo a continuaci\u00f3n; pueden ayudarte.
quantoVoceBebeSimGravidezP6= No, no puedes
quantoVoceBebeSimGravidezP7= No consumas alcohol si est\u00e1s o puedes estar embarazada
quantoVoceBebeSimGravidezP8= El alcohol que consumes afecta el desarrollo de tu beb\u00e9
quantoVoceBebeSimGravidezP9= No, no existe
quantoVoceBebeSimGravidezP10= Cualquier bebida que contenga alcohol, incluso en peque\u00f1a cantidad, puede da\u00f1ar a tu beb\u00e9
quantoVoceBebeSimGravidezP11= Por bebidas alcoh\u00f3licas, nos referimos a todas, incluso cerveza, vino, c\u00f3cteles, "Ice" o cualquier otra mezcla que contenga alcohol.
quantoVoceBebeSimGravidezP12= No, cada embarazo es diferente
quantoVoceBebeSimGravidezP13= El consumo de alcohol puede da\u00f1ar a un beb\u00e9 m\u00e1s que a otro
quantoVoceBebeSimGravidezP14= Podr\u00edas haber tenido un hijo que naci\u00f3 sano, pero tambi\u00e9n podr\u00edas haber tenido un hijo nacido con problemas
quantoVoceBebeSimGravidezP15= No, los problemas afectan el desarrollo de tu hijo
quantoVoceBebeSimGravidezP16= En algunos casos m\u00e1s graves, incluso como adulto, tu hijo necesitar\u00e1 cuidados especiales
quantoVoceBebeSimGravidezP17= Si bebiste alcohol antes de saber que estabas embarazada, deja de beber ahora y consulta con un profesional de la salud
quantoVoceBebeSimGravidezP18= Te sentir\u00e1s mejor y tu beb\u00e9 tendr\u00e1 una gran chance de nacer sano
quantoVoceBebeSimGravidezP19= Si sospechas que est\u00e1s embarazada - no bebas alcohol
quantoVoceBebeSimGravidezP20= Incluso si est\u00e1s intentando quedar embarazada, no bebas alcohol, ya que podr\u00edas estar embarazada y no saberlo
quantoVoceBebeSimGravidezP21= Incluso en los primeros dos meses, el alcohol puede da\u00f1ar a tu beb\u00e9
quantoVoceBebeSimGravidezP22= Te recomendamos, en tu caso, que consultes con un profesional de la salud para que te asista
quantoVoceBebeSimGravidezP23= El contenido de este sitio web no fue desarrollado especialmente para mujeres embarazadas, pero algunos consejos pueden ser \u00fatiles:
quantoVoceBebeSimGravidezP24= Sabe que hay varias formas de ayudarte a dejar de beber
quantoVoceBebeSimGravidezP25= Si alguien te ofrece una bebida, siempre di "no gracias", educada y directamente
quantoVoceBebeSimGravidezP26= Intenta mantenerte alejada de personas o lugares que te hagan beber
quantoVoceBebeSimGravidezP27= No guardes bebidas alcoh\u00f3licas en casa
quantoVoceBebeSimGravidezP28= Si no puedes dejar de beber, consulta con un profesional de la salud y pide ayuda
quantoVoceBebeSimGravidezP29= Si no tienes acceso a un profesional de la salud, usa Viva Voz (Marca 132 - llamada gratuita)
quantoVoceBebeSimGravidezP30= Si deseas profundizar en el tema, hemos preparado material para ti en este
quantoVoceBebeSimGravidezP30Link= enlace.
quantoVoceBebeSimGravidezP31= Podemos contactarte dentro de un a\u00f1o para una nueva evaluaci\u00f3n y otra informaci\u00f3n si lo deseas. Ingresa tu correo electr\u00f3nico en el campo a continuaci\u00f3n.
quantoVoceBebeSimGravidezPTabTitle1= 1. \u00bfPuedo beber alcohol si estoy embarazada?
quantoVoceBebeSimGravidezPTabTitle2= 2. \u00bfExiste alg\u00fan tipo de bebida alcoh\u00f3lica que sea segura de usar durante el embarazo?
quantoVoceBebeSimGravidezPTabTitle3= 3. Si beb\u00ed durante mi \u00faltimo embarazo y no tuve problemas. \u00bfEst\u00e1 bien que beba esta vez?
quantoVoceBebeSimGravidezPTabTitle4= 4. \u00bfLos problemas que mi beb\u00e9 pueda tener porque beb\u00ed mejorar\u00e1n con el tiempo?
quantoVoceBebeSimGravidezPTabTitle5= 5. \u00bfQu\u00e9 hago si estoy embarazada pero todav\u00eda he estado bebiendo?
quantoVoceBebeSimGravidezPTabTitle6= 6. \u00bfC\u00f3mo dejo de beber?
quantoVoceBebeSimGravidezAdolesTitle= Informaci\u00f3n para mujeres embarazadas menores de 18 a\u00f1os | Alcohol y Salud
pregnantTeenDrink01= Informaci\u00f3n para embarazadas menores (menores de 18)
quantoVoceBebeSimGravidezAdolesH31= \u00a1Cuidado - t\u00fa y tu beb\u00e9 por nacer est\u00e1n en riesgo!
quantoVoceBebeSimGravidezAdolesP1= Has informado que bebes y que puedes estar embarazada - El consumo de alcohol es muy perjudicial para los adolescentes y altamente peligroso para el desarrollo de tu beb\u00e9.
quantoVoceBebeSimGravidezAdolesP2= Todo embarazo adolescente puede considerarse un embarazo de riesgo - Consulta con un profesional de la salud para m\u00e1s orientaci\u00f3n sobre qu\u00e9 cuidados se deben tener.
quantoVoceBebeSimGravidezAdolesP2a= Es esencial que permanezcas sin beber durante todo tu embarazo e incluso durante el per\u00edodo en que est\u00e1s amamantando. Esta recomendaci\u00f3n es v\u00e1lida incluso para mujeres adultas.
quantoVoceBebeSimGravidezAdolesP2b= La recomendaci\u00f3n de no beber se aplica a todas las personas menores de 18 a\u00f1os. El consumo de alcohol en la adolescencia puede causar grandes problemas en el desarrollo de tu cerebro y representa riesgos importantes para tu salud ahora y en el futuro.
quantoVoceBebeSimGravidezAdolesP4= Este sitio web a\u00fan no tiene herramientas espec\u00edficas para mujeres embarazadas y adolescentes.
quantoVoceBebeSimGravidezAdolesP5= Te recomendamos que leas las preguntas y respuestas sobre el alcohol y el embarazo adolescente a continuaci\u00f3n. Pueden ayudarte.
quantoVoceBebeSimGravidezAdolesP7= No consumas alcohol antes de los 18 a\u00f1os, especialmente si est\u00e1s o podr\u00edas estar embarazada.
quantoVoceBebeSimGravidezAdolesP10= Cualquier bebida que contenga alcohol, incluso en peque\u00f1as cantidades, puede da\u00f1arte a ti y a tu beb\u00e9
