politicaDoSiteTitle1= Pol\u00edtica del sitio | Alcohol y Salud
politicaDoSiteP2= V.1.0
politicaDoSiteP3= Nos preocupa proteger la privacidad de los usuarios y adoptamos la pol\u00edtica de proteger la informaci\u00f3n sobre las personas. Esta pol\u00edtica describe la informaci\u00f3n recopilada por el sitio, c\u00f3mo se usa esta informaci\u00f3n, c\u00f3mo se revela, la seguridad de la informaci\u00f3n y c\u00f3mo se puede acceder y corregir con respecto a la privacidad de los usuarios.
politicaDoSiteP41= Al utilizar nuestros servicios, entiendes que recopilaremos y usaremos tus datos personales de las formas descritas en esta Pol\u00edtica, bajo las
politicaDoSiteP42= normas de Protecci\u00f3n de Datos
politicaDoSiteP42Link= LGPD, Ley Federal 13.709/2018
politicaDoSiteP43= de las disposiciones consumeristas de la Ley Federal 8078/1990 y las dem\u00e1s normas del ordenamiento jur\u00eddico brasile\u00f1o aplicables.
politicaDoSiteP5= La elecci\u00f3n de la informaci\u00f3n proporcionada depende completamente del usuario del sitio. Usamos la informaci\u00f3n para generar datos y mejorar la calidad de los servicios ofrecidos.
politicaDoSiteP51= \u00c1lcool e Sa\u00fade
