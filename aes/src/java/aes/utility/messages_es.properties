strategyStopIntroduction01= Las personas que pueden estar adictas pueden encontrar dif\u00edcil dejar de beber sin ayuda.
strategyStopIntroduction03= Actualmente existen varios enfoques de tratamiento que han demostrado ayudarte.
strategyStopIntroduction05= Comenzar buscando ayuda es un excelente camino.
strategyStopIntroduction06= Tus chances son mucho mayores cuando encuentras un tipo de tratamiento con el que te sientas c\u00f3modo.
strategyStopIntroduction08= Las siguientes sugerencias son m\u00e1s \u00fatiles para las personas que tienen un alto riesgo de volverse dependientes del alcohol.
strategyStopProfessionalSupport02= Los avances en el tratamiento del alcoholismo significan que los pacientes ahora tienen m\u00e1s opciones de tratamiento y los profesionales tienen m\u00e1s herramientas.
strategyStopProfessionalSupport03= Los nuevos medicamentos pueden ayudarte a dejar de beber actuando sobre las v\u00edas neuronales.
strategyStopProfessionalSupport04= Estos medicamentos m\u00e1s nuevos (por ejemplo, Naltrexona, Topiramato, etc.) no te hacen sentir n\u00e1useas como los medicamentos antiguos (por ejemplo, Disulfiram).
strategyStopProfessionalSupport05= Ninguno de estos medicamentos causa adicci\u00f3n, lo que preocupa a algunos grupos de apoyo para el alcohol y servicios de asesoramiento.
strategyStopProfessionalSupport06= Los estudios han demostrado que los pacientes con dependencia del alcohol pueden recibir un tratamiento efectivo combinando estos nuevos medicamentos y visitas breves a un profesional de la salud para seguimiento.
strategyStopProfessionalSupportTherapy02= Existen diferentes tipos de asesoramiento/terapias que pueden ayudarte y son efectivos:
strategyStopProfessionalSupportTherapy03= Algunos ejemplos son el enfoque cognitivo-conductual, enfoque motivacional, 12 pasos o una combinaci\u00f3n de estos.
strategyStopProfessionalSupportTherapy04= A pesar de las diferencias en los enfoques, recibir alg\u00fan tipo de ayuda en s\u00ed mismo es m\u00e1s importante que un enfoque espec\u00edfico, siempre que se te ofrezca un enfoque que sea emp\u00e1tico, evite confrontaciones fuertes, aumente tu motivaci\u00f3n y te ofrezca m\u00e9todos objetivos para cambiar tu forma de beber.
strategyStopProfessionalSupportTherapy06= Algunas personas, pero no la mayor\u00eda, pueden requerir programas m\u00e1s intensivos. Si necesitas una derivaci\u00f3n a un programa como este, consulta a un profesional de la salud.
strategyStopSocialSupport01= En este caso es importante:
strategyStopSocialSupport02= Hablar de tu cambio con la familia y amigos.
strategyStopSocialSupport03= Buscar desarrollar nuevos intereses y nuevos grupos sociales.
strategyStopSocialSupport04= Encontrar una forma agradable de usar tu tiempo para que el alcohol no est\u00e9 involucrado.
strategyStopSocialSupport05= Recomendamos encarecidamente que si quieres dejar de beber busques ayuda de un profesional de la salud.
strategyStopSocialSupport06= Pedir ayuda a otras personas.
strategyStopSocialSupport07= Cuando las personas dejan de beber, a menudo enfrentan el desaf\u00edo de reconstruir sus vidas sin alcohol.
strategyStopSocialSupportAA02= Las personas en recuperaci\u00f3n que asisten regularmente a grupos como AA tienden a tener mejores resultados que aquellos que no lo hacen.
strategyStopSocialSupportAA04= Encuentra un grupo donde te sientas m\u00e1s c\u00f3modo.
strategyStopSocialSupportAA05= En un grupo donde te sientas m\u00e1s c\u00f3modo, tendr\u00e1s m\u00e1s chances de involucrarte, e incluso puedes poder ayudar a otras personas en el futuro.
strategyStopSocialSupportOthers02= No te ofrezcan alcohol.
strategyStopSocialSupportOthers03= Eviten usar alcohol cuando est\u00e9s presente.
strategyStopSocialSupportOthers04= Te ofrezcan apoyo y eviten cr\u00edticas.
strategyStopSocialSupportOthers05= No te pidan que asumas nuevas demandas en este momento.
strategyStopSocialSupportOthers07= Tambi\u00e9n busca ayuda de un profesional o grupos como Al-Anon.
strategyStopSupportDepressionAndAnxiety02= Los s\u00edntomas moderados pueden dejar de molestarte una vez que comiences a beber menos o dejes de beber por completo.
strategyStopSupportDepressionAndAnxiety04= Busca consejo m\u00e9dico.
strategyStopSupportDepressionAndAnxiety06= Existen tratamientos disponibles que pueden ayudarte a superar esta situaci\u00f3n.
strategyStopSupportDoNotGiveUp01= Cambiar comportamientos como fumar, comer en exceso o beber demasiado puede requerir mucho esfuerzo y puede no dar resultados positivos la primera vez.
strategyStopSupportDoNotGiveUp02= Algunas fallas en el camino son comunes, pero siempre aprendes m\u00e1s cada vez que las atraviesas.
strategyStopSupportDoNotGiveUp03= Cada uno de estos intentos te acercar\u00e1 m\u00e1s a tu meta.
strategyStopSupportDoNotGiveUp05= Si este enfoque no funciona, prueba algo m\u00e1s.
strategyStopSupportDoNotGiveUp06= Si algo sale mal en el camino, intenta volver al camino lo m\u00e1s r\u00e1pido posible.
strategyStopSupportDoNotGiveUp08= Aunque este es un viaje largo, tienes una buena chance de \u00e9xito.
strategyStopSupportDoNotGiveUp09= Cuanto m\u00e1s persistas en intentarlo, mayores ser\u00e1n tus chances de \u00e9xito.
strategyStopSupportDoNotGiveUp10= Varios estudios respaldan esto, mostrando que es posible cambiar tu comportamiento con respecto al alcohol.
