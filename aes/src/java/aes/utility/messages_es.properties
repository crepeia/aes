termsTitleH1= T\u00e9rmino de responsabilidad, pol\u00edtica de privacidad y t\u00e9rminos y condiciones de uso del sitio web.
termsPVersion= Versi\u00f3n: 1.0
termsDescriptionP1= Bienvenido al sitio web Alcohol y Salud. Para que el uso del sitio sea satisfactorio y no ofensivo para ti, es importante leer, entender y aceptar los siguientes t\u00e9rminos y condiciones.
termsDescriptionP2= Este sitio web fue desarrollado para ser un servicio p\u00fablico que ofrece informaci\u00f3n y un programa para prevenir el abuso de alcohol.
termsDescriptionP3= El programa es complementario a otros programas para prevenir el abuso de alcohol, y su uso no sustituye el apoyo de atenci\u00f3n m\u00e9dica.
termosUso07= El programa es experimental y se probar\u00e1 su eficacia cl\u00ednica.
termsAccessH3= Acceso al sitio
termsAccessP= Algunas p\u00e1ginas del sitio web son de libre acceso para todos los visitantes. Sin embargo, el acceso al programa de tratamiento requiere un registro gratuito. Para registrarse, es necesario elegir un nombre de usuario y una contrase\u00f1a. El nombre de usuario y la contrase\u00f1a deben mantenerse confidenciales y no deben compartirse con ning\u00fan otro usuario. Se solicita a los visitantes que no revelen su nombre de usuario y contrase\u00f1a a terceros.
termosUso10= Prohibiciones
termsRestrainsLi1= Usar el nombre de otra persona, nombre de usuario o contrase\u00f1a al acceder a este sitio web, sin consentimiento previo;
termsRestrainsLi2= Escribir o transmitir cualquier material que pueda, de alguna manera, difamar, ofender o causar incomodidad a alguien; ser obsceno o que de alguna manera interfiera con el uso de otros usuarios en este sitio web;
termsRestrainsLi3= Proporcionar cualquier informaci\u00f3n al sitio web que sea confidencial o propiedad de terceros;
termsRestrainsLi4= Usar este sitio web de cualquier manera que pueda violar leyes, reglas o regulaciones o los derechos de terceros; o
termsRestrainsLi5= Transmitir virus o cualquier contenido que interfiera con la funcionalidad del sitio web.
termosUso16= Garant\u00edas
termsGarantiesP1= Se han hecho todos los esfuerzos para garantizar que la informaci\u00f3n y los materiales contenidos en este sitio web sean completamente verdaderos y no da\u00f1inos. Los materiales e informaci\u00f3n puestos a disposici\u00f3n fueron evaluados por especialistas en el campo del tratamiento del tabaco y por exfumadores.
termsGarantiesP2= El sitio web no garantiza que los servicios estar\u00e1n disponibles de forma ininterrumpida o constante.
termsGarantiesP3= Aunque los servicios propuestos por el sitio web tienen como objetivo ayudar a los fumadores, se anima a los fumadores a buscar apoyo de profesionales de la salud. Todos los usuarios deben usar este sitio web bajo su propio riesgo.
termosUso20= Servicios y materiales de terceros
termsThirdpartyP= La informaci\u00f3n en este sitio puede incluir servicios e informaci\u00f3n de terceros. El contenido y los servicios de terceros se pondr\u00e1n a disposici\u00f3n con aprobaci\u00f3n previa.
termosUso22= Enlaces
termsLinksP= Este sitio contiene enlaces a otros sitios que no est\u00e1n bajo nuestro control ni son mantenidos por nosotros. Los enlaces de terceros se proporcionan por conveniencia e informaci\u00f3n. Si el usuario accede a esta informaci\u00f3n, los riesgos de uso son de su exclusiva responsabilidad. El hecho de que un sitio web de terceros est\u00e9 vinculado a \u00e9l no implica necesariamente patrocinio o que el sitio web de terceros est\u00e9 afiliado a este sitio web.
termosUso24= Cambios en la informaci\u00f3n, productos y servicios
termsChangesP= La informaci\u00f3n, productos y servicios publicados en este sitio web est\u00e1n sujetos a cambios sin previo aviso.
termsInfoH3= Informaci\u00f3n puesta a disposici\u00f3n por el sitio web
termsInfoP= Las personas inscritas en el programa Alcohol y Salud ponen a disposici\u00f3n informaci\u00f3n relacionada con su contenido de forma involuntaria. Una vez puesta a disposici\u00f3n, la informaci\u00f3n propiedad del usuario puede ser reproducida, publicada, transmitida, puesta a disposici\u00f3n, sujeta a las obligaciones de la Pol\u00edtica de Privacidad.
termosUso28= Licencia
termsLicensePa= Todo el contenido del sitio, incluidos programas, dise\u00f1o, textos y gr\u00e1ficos, est\u00e1 licenciado bajo la Licencia P\u00fablica General - GNU, garantizando la libertad de usar el contenido del programa para cualquier prop\u00f3sito, modificar el programa, compartirlo con tus colegas y amigos y compartir los cambios que hagas.
termosUso30= Ver la licencia completa de GNU GPL.
termosUso31= Marcas registradas
termsTrademarkP= Este sitio web contiene marcas registradas y logotipos de terceros protegidos por la ley. No est\u00e1 permitido usarlos sin consentimiento previo.
termosUso33= Terminaci\u00f3n
termsEndP= Si el usuario no respeta los t\u00e9rminos y condiciones del sitio web, su acceso puede ser limitado o prohibido.
polTitlepage= Pol\u00edtica del sitio | Alcohol y Salud
Vers\u00e3o\:\ 1.0=pol.version
polPrivacyH1= Pol\u00edtica de Privacidad
polPrivacyP= Nos preocupa la protecci\u00f3n de la privacidad de los usuarios y adoptamos la pol\u00edtica de proteger la informaci\u00f3n sobre las personas. Esta pol\u00edtica describe la informaci\u00f3n recopilada por el sitio, c\u00f3mo se usa la informaci\u00f3n, c\u00f3mo se revela, la seguridad de la informaci\u00f3n y c\u00f3mo se puede acceder y corregir con respecto a la privacidad de los usuarios.
polPdataH3= 1. Recolecci\u00f3n de informaci\u00f3n personal
polPdataP1= Puedes proporcionar informaci\u00f3n personal mientras usas los servicios ofrecidos por este sitio web. Esta informaci\u00f3n personal puede incluir detalles como tu nombre, edad, g\u00e9nero y datos de contacto. Los productos y servicios pueden requerir otros tipos de informaci\u00f3n.
polPdataP2= La elecci\u00f3n de la informaci\u00f3n proporcionada depende completamente del usuario del sitio. Usamos la informaci\u00f3n para generar conocimiento y mejorar la calidad de los servicios ofrecidos.
polPdataP3= Este sitio web tambi\u00e9n puede recopilar y archivar informaci\u00f3n sobre la visita al sitio web, incluyendo:
polPdataLi1= Nombre y dominio donde accediste a internet;
polPdataLi2= Fecha y hora de tu acceso;
polPdataLi3= La direcci\u00f3n de internet del sitio web desde donde fuiste dirigido a este sitio web;
polPdataLi4= Las p\u00e1ginas que accediste mientras usabas el sitio.
polPdataP4= Esta informaci\u00f3n no identifica a los usuarios y se usa para medir el n\u00famero de visitantes del sitio web y c\u00f3mo se navega. Esta informaci\u00f3n se usa para hacer el sitio m\u00e1s f\u00e1cil para ti.
polPdataP5= Este sitio web tambi\u00e9n recopila informaci\u00f3n de personas registradas o visitantes para mejorar la calidad y efectividad. El administrador agradece cualquier tipo de comentario sobre cualquier aspecto.
polDatauseH3= 2. \u00bfC\u00f3mo se usa tu informaci\u00f3n personal?
polDatauseP1= La informaci\u00f3n personal obtenida a trav\u00e9s del sitio web se usa para:
polDatauseLi1= Proporcionarte servicios;
polDatauseLi2= Proporcionar informaci\u00f3n y otros tipos de comunicaciones;
polDatauseLi3= Involucrarte en iniciativas del sitio web;
polDatauseLi4= Analizar patrones y tendencias de uso del sitio web.
polDatauseP2= El uso de la informaci\u00f3n descrita anteriormente puede ser proporcionado por terceros autorizados para usar esta informaci\u00f3n con estos fines.
polDatauseP3= La informaci\u00f3n recopilada para este sitio web tambi\u00e9n puede usarse para determinar patrones demogr\u00e1ficos de uso. La informaci\u00f3n personal no se usa para este prop\u00f3sito. Esta informaci\u00f3n an\u00f3nima se usa entonces para mejorar el sitio web y nuestros servicios. Esta informaci\u00f3n no se transmitir\u00e1 a terceros.
polDatauseP4= Adem\u00e1s de los fines descritos anteriormente, el sitio web no usar\u00e1 tu informaci\u00f3n sin consentimiento previo. La excepci\u00f3n a esta regla ser\u00e1 cuando el prop\u00f3sito de prevenir cualquier da\u00f1o a la salud o la justicia sea evidente.
polDatasecH3= 3. Seguridad de tus datos
polDatasecP1= El sitio web implementa procedimientos para garantizar la seguridad de la informaci\u00f3n recopilada, evitando que los datos se pierdan, destruyan, usen o accedan de manera no autorizada. La informaci\u00f3n que proporciones solo ser\u00e1 accedida por personal autorizado.
polDatasecP2= Sin embargo, ninguna transmisi\u00f3n de datos en internet o informaci\u00f3n contenida en nuestros servidores accedida a trav\u00e9s de internet es completamente segura. Estas actividades son de tu exclusiva responsabilidad.
polSecrecyH3= 4. Incumplimiento de la confidencialidad de la informaci\u00f3n
polSecrecyP= La informaci\u00f3n recopilada a trav\u00e9s del sitio web no se revelar\u00e1 ni se pasar\u00e1 a terceros a menos que sea de acuerdo con esta pol\u00edtica de privacidad. La informaci\u00f3n solo se proporcionar\u00e1 a terceros con autorizaci\u00f3n y para un prop\u00f3sito espec\u00edfico.
polLinks3rdH3= 5. Enlaces a sitios de terceros
polLinks3rdP= Este sitio contiene enlaces a otros sitios. No somos responsables de las pr\u00e1cticas de privacidad y el contenido de los sitios web de terceros. Es tu responsabilidad investigar la pol\u00edtica de privacidad de estos sitios.
polChangesH3= 6. Cambios en la Declaraci\u00f3n de Privacidad
polChangesP= Este sitio puede cambiar el t\u00e9rmino de privacidad colocando una nueva versi\u00f3n en el sitio. Debes consultar esta p\u00e1gina ocasionalmente para familiarizarte con posibles cambios. Esta pol\u00edtica de privacidad puede cambiar con la introducci\u00f3n de nuevas regulaciones y leyes.
polContactH3= 7. Contacto
polContactP= Si tienes alguna pregunta, cont\u00e1ctanos desde la direcci\u00f3n encontrada en este sitio web.
