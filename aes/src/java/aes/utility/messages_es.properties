keepDrinking01= Registra cu\u00e1nto bebes
estrategiaDimRegistroLi1= Registrar cu\u00e1nto est\u00e1s bebiendo es una de las tareas que m\u00e1s puede ayudarte a reducir tu consumo
estrategiaDimRegistroLi2= Es importante que elijas la forma m\u00e1s pr\u00e1ctica de hacer este registro
alternativeDecreaseRegist01= A continuaci\u00f3n hay algunas sugerencias para registrar
