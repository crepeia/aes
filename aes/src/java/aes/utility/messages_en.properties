doseChatInformationStepControl01= I need information!
doseChatInformationStepControl02= Here is some information about what the terms context and consequence of alcohol consumption mean:
doseChatInformationStepControl03= \u1f7e6 Context
doseChatInformationStepControl04= Context is the situation in which alcohol consumption occurred. This includes the physical environment, the people around you, and even your emotional state at the time.
doseChatInformationStepControl05= For example:
doseChatInformationStepControl06= \u2022 I was at home, alone, watching TV.
doseChatInformationStepControl07= \u2022 I was at a party with friends.
doseChatInformationStepControl08= \u2022 I was sad after a difficult day.
doseChatInformationStepControl09= Logging the context helps understand the triggers or patterns that influence your consumption.
doseChatInformationStepControl10= \u1f7e5 Consequence
doseChatInformationStepControl11= Consequence is what you felt or experienced after drinking. It can be something physical, emotional, or social.
doseChatInformationStepControl12= \u2022 I felt relaxed and slept well.
doseChatInformationStepControl13= \u2022 I had a headache and nausea.
doseChatInformationStepControl14= \u2022 I argued with someone.
doseChatInformationStepControl15= \u2022 I regretted it later.
doseChatInformationStepControl16= Noting the consequences helps you reflect on the effects of alcohol and how it impacts your well-being.
doseChatPlaceHolder01= E.g.: at home, with friends
doseChatPlaceHolder02= E.g.: I yelled at someone
