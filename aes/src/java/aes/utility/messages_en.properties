estrategiaDimAltDizeNaoTitle1= Decreasing your consumption - Saying no | Alcohol & Health
estrategiaDimAltDizeNaoH31= Searching for Alternatives
alternativePlanPlanSayNoText01= Learning to say no
estrategiaDimAltDizeNaoL11= Have you noticed that there is a greater chance that someone will offer you a drink when you are not drinking?
alternativePlanPlanSayNoText03= Always have a "no, thank you very much" ready on the tip of your tongue - said politely and confidently.
estrategiaDimAltDizeNaoL12= The secret lies in saying no quickly and directly! This prevents you from thinking of excuses to allow yourself to drink.
alternativePlanPlanSayNoText05= "No, thank you very much" - nothing more complex than that.
