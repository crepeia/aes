vivasemtabacoTitle= Alcohol & Health | Free program to prevent alcohol abuse
prontoIntroP1= Congratulations on your decision! We will assist you with creating a personalized plan.
prontoIntroP2= Here you will find information taken from scientific studies and written by experts.
prontoIntroP3= This program is not a substitute for traditional medical consultation. We recommend that you also seek help from a health professional.
adultNotDrink01= Recommendations
prontoIntroLi1= You will build a plan to quit smoking. Try to do the steps in order.
prontoIntroLi2= You can change it at any time. Click on the desired item in the sidebar.
prontoIntroLi3a= If you do not want to quit, we recommend going back to the first step:
prontoIntroLi3b= "Preparing to quit"
prontoIntroNextH2= Next step
imgRef= Photo credit:
prontoIntroNextP= What is abstinence, and how to deal with it? Know more.
next= next
prontoAbsTitlepage= Abstinence - what is it and how to deal
prontoAbsImg= Abstinence is an obstacle
prontoAbsP1= Abstinence is a natural reaction of the organism to the absence of nicotine present in cigarettes.
prontoAbsP2= Common abstinence symptoms are: headaches, dizziness, sleep disturbances, and irritation.
prontoAbsP3= It is important to recognize and accept these symptoms, knowing that they will last for an average of 1 to 3 weeks.
prontoAbsP4= Although it seems like a long time, it is important to recognize that abstinence symptoms will pass with time.
prontoAbsP5= During the abstinence period, you may feel an intense urge to smoke - or fissure.
prontoAbsNextP= Learn how to overcome the urge to smoke or fissure.
back= back
prontoAbsRefP1= Sources: U.S Department of Health and Human Services (2008). Treating Tobacco Use and Dependence: 2008 Update: Clinical Practice Guideline. DIANE Publishing.
prontoFisTitlepage= Fissure - Techniques to face the fissure
prontoFisImg= Fissure
prontoFisP1= The urge to smoke - or fissure - is very common in people who are quitting smoking.
prontoFisP2= Each episode lasts an average of 5 minutes, decreasing a lot or disappearing afterward.
prontoFisP3= There are techniques that can help you to face the fissure.
prontoFisH3= Techniques to deal with the fissure
prontoFisP4= The techniques below, although simple, show results. Choose the ones you prefer to build your plan:
prontoFisLab1= Drink a glass of water slowly.
prontoFisLab2= Eating low-calorie foods like candied fruits (raisins), diet candies, and diet gum.
prontoFisLab3= Do relaxation exercise - in MP3 audio - download link in the stop plan.
prontoFisLab4= Reading a card with your reasons for quitting smoking.
prontoFisNextP= Can the use of medications increase your chances of quitting? Know more.
prontoFisNextT= Learn more about medicines
prontoFisRefP1= Source: U.S Department of Health and Human Services (2008). Treating Tobacco Use and Dependence: 2008 Update: Clinical Practice Guideline. DIANE Publishing.
