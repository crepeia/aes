privacidadeTitlepage= Privacy Policy | Alcohol and Health
privacidadeH1= Privacy Policy
privacidadeIntro= This Privacy Policy describes how the <strong>Alcohol and Health</strong> app collects, uses, and protects the data of volunteer participants, in the context of the research project <em>"Predi\u00e7\u00e3o de Consumo de \u00c1lcool no Aplicativo \u00c1lcool &amp; Sa\u00fade via Aprendizado de M\u00e1quina e Dados Multimodais"</em>, approved by the Research Ethics Committee of the Federal University of Juiz de Fora (CEP/UFJF).
privacidadeParecerNumero= Approval Number: 8.508.969
privacidadeCaae= CAAE: 95623726.9.0000.5147
privacidadeSituacao= Status: Approved
privacidadeDadosH2= What data we collect
privacidadeDadosLocalizacao= <strong>Location (GPS)</strong> \u2014 including while the app is running in the background, as long as the participant has advanced data collection enabled.
privacidadeDadosAcelerometro= <strong>Accelerometer</strong> \u2014 used to extract gait (walking pattern) features, such as movement intensity and cadence.
privacidadeDadosEma= <strong>Daily questionnaire responses (EMA)</strong> \u2014 self-report check-ins completed by the participant throughout the day.
privacidadeDadosNota= We do not collect photos, contacts, messages, or files from the device.
privacidadeFinalidadeH2= What we use this data for
privacidadeFinalidadeTexto= The data is used exclusively for scientific research purposes: building a multimodal dataset and training machine learning models capable of identifying patterns associated with drinking episodes, with the future goal of offering more personalized preventive support to app users.
privacidadeConsentimentoH2= Consent
privacidadeConsentimentoTexto= Advanced data collection (location and accelerometer) is only activated after the participant reads and accepts the Informed Consent Form (TCLE) directly in the app. The participant may withdraw this consent at any time, with no impact on normal use of the app.
privacidadeArmazenamentoH2= How the data is stored and protected
privacidadeArmazenamentoItem1= Data is transmitted with encryption (HTTPS).
privacidadeArmazenamentoItem2= Data is stored on servers at the Federal University of Juiz de Fora (UFJF).
privacidadeArmazenamentoItem3= Access is restricted exclusively to the research team.
privacidadeArmazenamentoItem4= We do not share data with third parties.
privacidadeArmazenamentoItem5= For any analysis or publication of results, location coordinates are converted into abstract behavioral metrics (e.g., movement patterns), without exposing precise routes or addresses.
privacidadeRetencaoH2= How long we keep the data
privacidadeRetencaoTexto= Research data remains archived under the responsibility of the principal investigator for a period of 5 (five) years, in accordance with CNS Resolution 466/2012.
privacidadeDireitosH2= Your rights
privacidadeDireitosItem1= Decline or withdraw your consent at any time, without penalty.
privacidadeDireitosItem2= Request clarification about the data collected.
privacidadeDireitosItem3= Request deletion of your data by contacting the email below.
privacidadeContatoH2= Contact
privacidadeContatoTexto= If you have questions about this Privacy Policy or about the research, please get in touch:
privacidadeContatoEmailLabel= Email:
privacidadeAtualizacao= Last updated: July 2026.