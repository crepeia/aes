quantoVoceBebeSimGravidezAdolesH31= Caution - you and your unborn baby are at risk!
quantoVoceBebeSimGravidezAdolesP1= You reported drinking and that you may be pregnant - Alcohol consumption is very harmful to teenagers and highly dangerous for your baby's development.
quantoVoceBebeSimGravidezAdolesP2= Every teenage pregnancy can be considered a risky pregnancy - Consult with a healthcare professional for more guidance on what care should be taken.
quantoVoceBebeSimGravidezAdolesP2a= It is essential that you remain without drinking throughout your pregnancy and even during the period you are breastfeeding. This recommendation is valid even for adult women.
quantoVoceBebeSimGravidezAdolesP2b= The recommendation for not drinking applies to all people under 18 years of age. Alcohol consumption in adolescence can cause major problems in your brain's development and poses important risks to your health now and in the future.
quantoVoceBebeSimGravidezAdolesP4= This website does not have specific tools for pregnant women and teenagers yet.
quantoVoceBebeSimGravidezAdolesP5= We recommend that you read the questions and answers about alcohol and teenage pregnancy below. They can help you.
quantoVoceBebeSimGravidezAdolesP7= Do not consume alcohol before the age of 18, especially if you are or could be pregnant.
quantoVoceBebeSimGravidezAdolesP10= Any drink that contains alcohol, even if in small amounts, can harm you and your baby
quantoVoceBebeSimGravidezAdolesP11= By alcoholic beverages, we refer to all, even beer, wine, cocktails, "Ice" or any other mixture containing alcohol.
quantoVoceBebeSimGravidezAdolesP15= No, problems can affect your child's development
quantoVoceBebeSimGravidezAdolesP16= In some more serious cases, even as an adult, your child will need special care.
