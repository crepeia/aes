estrategiaDimAltGatiTitle1= Decreasing your consumption? | Alcohol & Health
estrategiaDimAltGatiH31= Avoiding Risk Situations - Triggers
alternativePlanTriggers01= Have you ever stopped to think about what makes you drink more than planned?
alternativePlanTriggers02= Some people or places make you drink, even when you don't want to.
alternativePlanTriggers03= Activities, times of day, or feelings increase your desire to drink.
estrategiaDimAltGatiB1= Important tip!
estrategiaDimAltGatiP1= Try to avoid these situations above - Always think about options that do not involve drinking alcohol.
alternativePlanTriggers06= If drinking at home is a problem, keep little or no alcohol in your home.
estrategiaDimAltGatiImage= Strategy Triggers
