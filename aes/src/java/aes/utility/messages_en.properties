quantoVoceBebeNaoAdolesGravidezH31= Congratulations on not drinking! Caution: every teenage pregnancy is considered risky, even if you do not consume alcohol.
quantoVoceBebeNaoAdolesGravidezP1= Adolescence is a unique period for the development of the brain and your body.
quantoVoceBebeNaoAdolesGravidezP1a= Studies show that even teenagers who consume alcohol for a short time can decrease brain volume. Over time, adolescents who drink alcohol may also have greater difficulties in solving problems that require rationalizing.
quantoVoceBebeNaoAdolesGravidezP1b= By avoiding alcohol, you not only preserve your brain for longer but also prevent other possible damage that can be associated with health problems, accidents, fights, and discussions.
quantoVoceBebeNaoAdolesGravidezP1c= Learning to have fun and enjoy life healthier is always a good choice!

