welcome= Hello, welcome to the Alcohol & Health program! You can always come back to the program, access information, and tools that can help you.<br/><h1>Your opinion is very important - access the link below to let us know what you think of the program - it is quick! <h1/><form action= "http://www.alcoolesaude.com.br/pesquisa-satisfacao.xhtml"><input type= "hidden" name= "hid" value= "#id#"/><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px">Satisfaction Survey</button></form>
emailMsgSubjectDiaryStarted= Hello #user#, have you used the electronic registration this week? Registration can be done quickly and helps you to monitor if you are achieving your goals. Access your register at the link below: <br/> <form action= "http://www.alcoolesaude.com.br/mantendo-resultados-introducao.xhtml"><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px">Mantaining my results</button></form>
progressPersistchallengesReduce= Hello #user#, we have verified on our system that you have chosen to decrease your alcohol consumption. By accessing the link below, you can review strategies that help people drink less. <br/> <form action= "http://www.alcoolesaude.com.br/mantendo-resultados-introducao.xhtml"><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px">Mantaining my results</button></form>
progressPersistchallengesQuit= Hello #user#, we have verified on our system that you have chosen to stop drinking alcohol. Accessing the link below, you can learn more about strategies that can help people stop drinking. <br/> <form action= "http://www.alcoolesaude.com.br/mantendo-resultados-introducao.xhtml"><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px">Mantaining my results</button></form>
progressKeepingresultReduce= Hello #user#, people who are trying to stop or reduce the amount they drink may have a difficult time and can end up relapsing (i.e., not being able to maintain their goal). Go to the Maintaining Your Results Alcohol & Health Results phase for more information. <br/> <form action= "http://www.alcoolesaude.com.br/mantendo-resultados-introducao.xhtml"><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px">Mantaining my results</button></form>
progressKeepingresultQuit= Hello #user#, people who are trying to stop or reduce the amount they drink may have a difficult time and can end up relapsing (i.e., not being able to maintain their goal). <br/><form action= "http://www.alcoolesaude.com.br/"><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px">Access Alcohol & Health here and learn more</button></form>
annualscreening= Hello #user#, it has been a year since you signed up for the Alcohol & Health program! We recommend that you do your assessment again, take this opportunity to learn more about the impact of alcohol on your health. Access the link to the website below: <br/><form action= "http://www.alcoolesaude.com.br/"><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px">Alcohol and Health</button></form>
week1= Hello #user#, this is the first week after being registered in the Alcohol & Health program. Are you thinking about changing the way you drink? The first few weeks can be difficult, and a good tip is to record your consumption. You can do this by accessing the link below: <br/><form action= "http://www.alcoolesaude.com.br/pesquisa-acompanhamento.xhtml"><input type= "hidden" name= "hid" value= "#id#" /><input type= "hidden" name= "hwk" value= "1357" /><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px"> Evaluating my consumption.</button></form>
week2= Hello #user#, it's been two weeks since you signed up for the Alcohol & Health program. The first few weeks can be more difficult. If you need help or more information on how to drink less, go back to the program and review our tips. Access the link for your second-week evaluation below: <br/><form action= "http://www.alcoolesaude.com.br/pesquisa-acompanhamento.xhtml"><input type= "hidden" name= "hid" value= "#id#" /><input type= "hidden" name= "hwk" value= "2714" /><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px"> Evaluating my consumption.</button></form>
week3= Hello #user#, it's been three weeks since you signed up for the Alcohol & Health program. The first month is one of the most challenging steps to change the behavior. Access the link for your third-week evaluation below: <br/><form action= "http://www.alcoolesaude.com.br/pesquisa-acompanhamento.xhtml"><input type= "hidden" name= "hid" value= "#id#" /><input type= "hidden" name= "hwk" value= "4071" /><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px"> Evaluating my consumption.</button></form>
week4= Hello #user#, it's been a month since you started your plan to drink less and take better care of your health! The first month is one of the hardest steps to modifying the behavior. We would like to take this opportunity to find out about your experience so far. Through the link below, you can tell us how you have been facing this challenge and help to improve the program.<br/><form action= "http://www.alcoolesaude.com.br/pesquisa-acompanhamento.xhtml"><input type= "hidden" name= "hid" value= "#id#" /><input type= "hidden" name= "hwk" value= "5428" /><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px">Evaluate how the process has gone so far.</button></form>
week8= Hello #user#, it's been two months since you started your plan to drink less and take better care of your health! We would like to take this opportunity to find out about your experience so far. Through the link below, you can tell us how you have faced this challenge. <br/><form action= "http://www.alcoolesaude.com.br/pesquisa-acompanhamento.xhtml"><input type= "hidden" name= "hid" value= "#id#" /><input type= "hidden" name= "hwk" value= "10856" /><button style= "background-color:#1A54BA; border: none; color: white; margin:15px;padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size:16px">Evaluate how the process has gone so far.</button></form>
