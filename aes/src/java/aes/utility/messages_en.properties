polPrivacyP= We care about the protection of users' privacy and adopt the policy of protecting information about individuals. This policy describes the information collected by the site, such as the information used, how the information is revealed, the security of the information, and how the information can be accessed and corrected regarding the users' privacy.
polPdataH3= 1. Personal Information Collection
polPdataP1= You can provide personal information while using the services offered by this website. This personal information may include details such as your name, age, gender, and contact details. Products and services may require other types of information.
polPdataP2= The choice of the information provided is entirely up to the user of the site. We use the information to generate knowledge and improve the quality of services offered.
polPdataP3= This website can also collect and archive information regarding the website visit, including:
polPdataLi1= Name and domain where you accessed the internet;
polPdataLi2= Date and time of your access;
polPdataLi3= The internet address of the website where you were directed to the website;
polPdataLi4= The pages you accessed while using the site.
polPdataP4= This information does not identify users, and it is used to measure the website's visitors' number and how it is navigated. This information is used to make the site easier for you.
polPdataP5= This website also collects information from registered people or visitors to improve quality and effectiveness. The administrator appreciates any kind of feedback on any aspect.
polDatauseH3= 2. How is your personal information used?
polDatauseP1= Personal information obtained through the website is used to:
polDatauseLi1= Provide services to you;
polDatauseLi2= Provide information and other types of communications;
polDatauseLi3= Involve you in website initiatives;
polDatauseLi4= Analyze website usage patterns and trends.
polDatauseP2= Using the information described above can be provided by third parties authorized to use this information for these proposals.
polDatauseP3= The information collected for this website can also be used to determine demographic patterns of use. Personal information is not used for this purpose. This anonymous information, then, is used to improve the website and our services. This information will not be transmitted to third parties.
polDatauseP4= In addition to the purposes described above, the website will not use your information without prior consent. The exception to this rule will be when the purpose of preventing any harm to health or justice is evident.
polDatasecH3= 3. Security of your data
polDatasecP1= The website implements procedures to ensure the security of the information collected, preventing data from being lost, destroyed, used, or accessed in an unauthorized manner. The information provided by you will only be accessed by authorized personnel.
polDatasecP2= However, no data transmission on the internet or information contained on our servers accessed via the internet is completely secure. These activities are your sole responsibility.
polSecrecyH3= 4. Breach of confidentiality of information
polSecrecyP= Information collected through the website will not be revealed or passed on to third parties unless it is in accordance with this privacy policy. Information may be provided to third parties only with authorization and for a particular purpose.
polLinks3rdH3= 5. Links to third party sites
polLinks3rdP= This site contains links to other sites. We are not responsible for the privacy practices and content of third-party websites. It is your responsibility to research the privacy policy of these sites.
polChangesH3= 6. Changes to the Privacy Statement
polChangesP= This site can change the privacy term by placing a new version on the site. You should refer to this page occasionally to familiarize yourself with possible changes. This privacy policy may change with the introduction of new regulations and laws.
polContactH3= 7. Contact
polContactP= If you have any questions, please contact us from the address found on this website.
