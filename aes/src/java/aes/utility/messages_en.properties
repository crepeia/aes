tip.description.1=Drink a glass of water or soda after each alcoholic drink. You'll feel less urge to drink.
tip.description.2=Never drink straight from the bottle. This way, you can't control how much you're drinking.
tip.description.5=There's nothing wrong with refusing an alcoholic drink! Remember that\u2026
tip.description.6=Decide on the maximum number of drinks you'll have per week - Stick to your goal to achieve better results.
tip.description.8=Go without drinking alcohol for at least 2 days a week. This reduces the habit of drinking and helps your body recover.
tip.description.11=Don't drink alcohol when you feel sad or angry. Alcohol consumption can contribute to making your problems worse.
tip.description.16=People like and admire it when someone is trying to be healthier. Don't feel ashamed to say you are cutting down on your alcohol consumption, thinking about your health.
tip.description.17=Try to be with people who don't drink excessively. You will discover a large set of new opportunities to have fun.
tip.description.18=Avoid places, people, and foods strongly associated with alcohol use. By avoiding this type of situation, you increase your chances of drinking less.
tip.description.20=Pay attention to other people's comments about your drinking habits \u2013 they may be right when they comment on your excess regarding alcohol.
tip.description.21=Don't give up on your goals; the more we persist, the greater our chances of success. Continue on the path of drinking less; if you have made a slip-up, use this occasion as a reminder of how important it is for you to continue drinking less.
tip.description.22=Avoid keeping alcoholic beverages at home. Instead, try to keep juices, sodas, or other non-alcoholic drinks so you can consume them when you feel like it.
tip.description.24=Use at least six sips to empty your glass. This creates a rule that will make you take longer to empty your glass, drinking less as a result.
tip.description.25=Avoid alcoholic beverages and, especially, avoid mixing different types of drinks. When you mix different types of drinks, it's harder to count and plan the number of servings you'll have.
tip.description.26=Access your electronic diary whenever you feel like drinking, and consider the goals you have set. Remembering your goals will always be very useful.
tip.description.30=People who genuinely like you will stand by you even if you choose to drink less. You don't have to drink to be with your friends.
tip.description.31=Always record how many times and how much you drink during a week. Avoid drinking "automatically" without realizing how much you are drinking. Counting the amount of alcohol you consume is the best way to achieve your goal of drinking less.
tip.description.32=Reducing your alcohol consumption may not be an easy task, but if you strive to achieve this goal, you will have a greater chance of being successful.
tip.description.35=If you spend a lot of time drinking, think about better alternatives: like what to do with your family, parents, and friends.
tip.description.39=Avoid being in the company of people with whom you usually drink a lot. This may be difficult at first, but it can contribute a lot to you achieving your goal of drinking less.
tip.description.40=Always remember to comment and ask for support from your colleagues, friends, and family to drink less. When we share our problems, it is easier to face our difficulties.
tip.description.41=Practice how to say NO in a simple way. You don't need long explanations to avoid drinking in situations where people pressure you.
tip.description.44=Avoid social activities that involve drinking. Especially avoid those that are exclusively focused on the consumption of alcoholic beverages.
tip.description.46=Avoid drinking before or during breakfast. If you feel a strong urge or need to drink in the morning, seek the help of a professional who can assist you.
tip.description.47=Remember to eat before and/or while you are drinking. The better fed you are, the lower your chances of drinking in larger quantities.
tip.description.48=Decide on your limits and don't exceed them. This is a golden rule that can help you a lot.
tip.description.50=Don't give up if you are unable to achieve your goals on the first try. Continuing to try is the most important step!
tip.description.52=When you notice the first signs that you're getting dizzy from drinking, take a break. Ask a friend to remind you of this.
tip.description.53=The best way to avoid a hangover is to drink less. A hangover indicates that your body is intoxicated with alcohol and is exposed to health damage.
tip.description.56=Include a leisure physical activity in some part of your day. Physical activities, besides contributing to your health, can help you in the process of drinking less.
tip.description.57=Try to develop a hobby that keeps you interested and busy in your free time. This is a good strategy to occupy the day and help you feel better.
tip.description.58=Try to do breathing exercises or some form of relaxation every day. Finding moments in your day to relax can have a positive impact on your health.
tip.description.59=Avoid being near bars, restaurants, or cafes that serve alcohol. These places can make you feel more like drinking.
tip.description.60=Don't forget to reward yourself, even for small positive changes. Each day and each week that you manage to achieve your goals, take the opportunity to reward yourself with small treats made to yourself.
tip.description.61=Stress can be a great excuse to consume more alcohol. Find things that help reduce your stress and that don't involve alcohol consumption.
tip.description.65=Stay with positive thoughts. Try to visualize a healthier life with more quality of life.
tip.description.67=Set realistic goals. Being too ambitious, wanting a very sudden change can be less advantageous than a gradual and continuous change.
