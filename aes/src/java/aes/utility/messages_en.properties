termosUso01= Disclaimer, privacy policy and terms and conditions of use for Alcohol & Health.
termosUso02= Welcome to "Alcohol & Health". For the use of Alcohol & Health to be satisfactory and not offensive to you, it is important to read, understand and agree to the following terms and conditions.
termosUso03= Alcohol & Health was developed with the aim of being a public service, offering information and a program to help people who engage in risky alcohol consumption.
termosUso08= Access to Alcohol & Health
termosUso09= Some pages of Alcohol & Health are freely accessible to all visitors, however, access to the program requires free registration. If the user is interested, it is necessary to choose a username and password. The username and password must be kept confidential and should not be shared with any other user. Visitors are asked not to disclose their username and password to third parties.
termosUso11= - Use another person's name, username or password when accessing Alcohol & Health, without prior consent;
termosUso12= - Write or transmit any material that may, in any way, defame, offend or cause discomfort to any person; be obscene or in any way interfere with the use of Alcohol & Health by other users;
termosUso13= - Provide any information to Alcohol & Health that is confidential or property of third parties;
termosUso14= - Use Alcohol & Health in any way that may infringe laws, rules or regulations or the rights of third parties; or
termosUso15= - Transmit viruses or any content that interferes with the functionality of Alcohol & Health.
termosUso17= Every effort has been made to ensure that the information and materials contained in Alcohol & Health are completely true and harmless. The materials and information provided have been evaluated by specialists in the prevention of abusive alcohol consumption and people who have already used the strategy of drinking less.
termosUso18= Alcohol & Health does not guarantee that the services will be available uninterruptedly or constantly.
termosUso19= Although the services proposed by Alcohol & Health aim to provide help to users who are concerned about their alcohol consumption, they are free and encouraged to consult health professionals. All users should use this at their own risk.
termosUso21= Information contained in Alcohol & Health may include third-party services and information. Third-party content and services will be made available with prior approval.
termosUso23= Alcohol & Health contains links to other websites that are not under our control or maintained by us. Third-party links are provided for convenience and information. If the user accesses this information, the risks of use are the sole responsibility of the user. The fact that a third-party website is linked to this project does not necessarily imply a sponsorship relationship or that the third-party website is affiliated with this one.
termosUso25= Information, products and services published on Alcohol & Health are subject to change without prior notice.
