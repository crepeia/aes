tipTitleTitle= Title
tipDescriptionTitle= English description
tip1= Drink a glass of water or a soft drink after each alcoholic beverage. You will feel less desire to drink.
tip2= Never drink directly from the bottle. That way, you cannot control how much you are drinking.
tip3= Do you want to stop drinking? Ask people not to offer you alcoholic beverages.
tip4= Always drink in small sips. This will make you drink less.
tip5= There's nothing wrong with refusing an alcoholic drink! Remember that...
tip6= Decide the maximum number of standard drinks you will consume per week - Follow your goal to achieve better results.
tip7= Decide where you will drink and where you won't. Deciding this beforehand increases your chances of avoiding problems.
tip8= Go without drinking alcoholic beverages for at least 2 days a week. This reduces the habit of drinking and helps your body recover.
tipDescription9= When your glass is half-full, take a break and stop drinking for 15 minutes. You'll notice that you drink less using this strategy.
tipDescription10= Whenever you start to feel the urge to drink, start doing something fun that doesn't involve alcohol. Over time you will drink less.
tip11= Don't drink alcohol when you feel sad or angry. Alcohol consumption can contribute to worsening your problems.
tip12= If you are taking medication, consider not drinking - most of them interact with alcohol, which can have dangerous effects on your body.
tipDescription13= If you feel a strong urge to drink, talk to someone who can help. You'll benefit from sharing your feelings and thoughts.
tip14= Try to change your lifestyle, avoiding drinking and increasing healthy habits. Your health will improve, increasing your quality of life.
tipDescription15= Tell your friends about your decision to reduce the frequency and amount of consumption \u2013 they can help you stick to your decision by not offering you drinks.
tip16= People like and admire knowing that someone is trying to be healthier. Don't be ashamed to say that you are reducing your alcohol consumption, thinking about your health.
tip17= Try to be around company that does not drink excessively. You will discover a wide range of new opportunities to have fun.
tip18= Avoid places, people, and foods strongly associated with alcohol use. Avoiding these types of situations increases your chances of drinking less.
tipDescription19= Stay alert! If you need larger quantities than before to feel the same effects of alcohol, this points to a significant problem, but one that can be solved if you try to stop drinking, at least for a while.
tip20= Pay attention to other people's comments about your drinking habits \u2013 they may be right when they comment on your excessive alcohol consumption.
tip21= Don't give up on your goals; the more we persist, the greater our chances of success. Continue on the path to drinking less; if you've had a slip, use this occasion as a reminder of how important it is to keep drinking less.
tip22= Avoid keeping alcoholic beverages at home. Instead, try to keep juices, soft drinks, or other non-alcoholic beverages so you can consume them when you feel like it.
tip23= If you feel a strong urge to drink, try doing some exercise instead of drinking - you'll feel better.
tip24= Use at least six sips to empty your glass. This creates a rule that will make it take longer to empty your glass, leading you to drink less as a result.
tip25= Avoid alcoholic beverages and, especially, avoid mixing different types of drinks. When you mix different types of drinks, it's harder to count and plan the number of standard drinks you will consume.
tip26= Access your electronic diary whenever you feel like drinking, and consider the goals you have set. Remembering your goals will always be very helpful.
tip27= Avoid consuming alcohol to relax; try to find alternatives, such as exercise and hobbies.
tipDescription28= Want to drink less? Try to follow the reduction strategies that best suit you.
tipDescription29= When your glass is empty, think about the consequences of drinking a little more. Going beyond the doses you planned can lead to problems in controlling your consumption.
tip30= People who truly care about you will stay by your side even if you choose to drink less. You don't need to drink to be with your friends.
tip31= Always record how often and how much you drink during a week. Avoid drinking "automatically" without realizing how much you are drinking. Counting the amount of drink you consume is the best way to reach your goal of drinking less.
tip32= Reducing your alcohol consumption may not be an easy task, but if you strive to achieve this goal, you will have a greater chance of success.
tipDescription33= Learn that it is your right to refuse a drink when someone offers you one. Always say no, thank you very much! This formula is simple and can help in various situations.
tipDescription34= If you want to stop drinking but have found it difficult, seek a healthcare professional who can help. Asking for help can be a difficult step, but it will bring important rewards in the future.
tip35= If you spend too much time drinking, think of better alternatives: like what to do with your family, parents, and friends.
tipDescription36= Even if you are drinking less, never drive after drinking. Thinking about your health also involves thinking about avoiding accidents.
tipDescription37= Always think about the consequences and your health before starting to drink. Create this habit of thinking about the consequences before you start drinking.
tip38= Don't drink on an empty stomach. Always have a good meal before you start drinking; this will help you drink less.
tip39= Avoid the company of people with whom you usually drink a lot. This may be difficult at first, but it can contribute a lot to achieving your goal of drinking less.
tip40= Always remember to discuss and ask for support to drink less from your colleagues, friends, and family. When we share our problems, it's easier to face our difficulties.
tip41= Practice how to say NO simply. You don't need long explanations to avoid drinking in situations where people pressure you.
tipDescription42= Avoid participating in drinking games or contests. These games often involve large amounts of alcohol, consumed very quickly, increasing the risk of problems resulting from consumption.
tip43= When you go to a party or a show, avoid drinking before arriving at this place. Drinking before the party can increase your chances of having problems during the party.
tip44= Avoid social activities that involve drinking. Especially avoid those exclusively focused on alcohol consumption.
tipDescription45= An exercise that can help you is to avoid taking the first sip. Wait about 1 or 2 hours to start drinking; this time can help you control the urge to drink and think about the negative consequences of consumption.
tip46= Avoid drinking before or during breakfast. If you feel a strong urge or need to drink in the morning, seek help from a professional who can assist you.
tip47= Remember to eat before and/or while you are drinking. The better nourished you are, the lower your chances of drinking in larger quantities.
tip48= Decide on your limits and do not exceed them. This is a golden rule that can help you a lot.
tipDescription49= Avoid participating in rounds. These occasions can contribute to you consuming alcohol beyond what you had planned.
tip50= Don't give up if you are unable to achieve your goals on the first try. Keep trying, it's the most important step!
tip51= Don't worry if at some point you consume more than planned. Understand this as a sign that you still need to persist in your goal.
tip52= When you notice the first signs that you are getting dizzy from drinking, take a break. Ask a friend to remind you of this.
tip53= The best way to avoid a hangover is by drinking less. A hangover indicates that your body is intoxicated by alcohol and is exposed to health damage.
tipDescription54= Drink plenty of water before any alcoholic beverage. Consider this tip, especially if you are thirsty.
tipDescription55= Identify the things/images/thoughts that contribute to your well-being. Many people overdo it with alcohol because they are sad or angry.
tip56= Include a leisure physical activity in some part of your day. Physical activities, in addition to contributing to your health, can help you in the process of drinking less.
tip57= Try to develop a hobby that keeps you interested and busy in your free time. This is a good strategy to occupy your day and help you feel better.
tip58= Try breathing exercises or some form of relaxation every day. Seeking moments in your day to relax can have a positive impact on your health.
tip59= Avoid staying near bars, restaurants, or cafes that serve alcohol. These places can make you feel more like drinking.
tip60= Don't forget to reward yourself, even for small positive changes. Each day and each week that you manage to achieve your goals, take the opportunity to reward yourself with small treats.
tip61= Stress can be a great excuse to consume more alcohol. Find things that help reduce your stress that don't involve alcohol consumption.
tipDescription62= Involve a trusted friend or family member to help you stay motivated. Share with them the goals you have achieved and also the difficult moments.
tip63= Talk to a friend or family member when you feel the need to drink.
tip64= Always drink plenty of water. Staying hydrated can help reduce your urge to drink alcohol.
tip65= Maintain positive thoughts. Try to visualize a healthier life with more quality of life.
tip66= Remember your goal every day. Believe that you can achieve your goals.
tip67= Set realistic goals. Being too ambitious, wanting a very abrupt change, can be less advantageous than a gradual and continuous change.
