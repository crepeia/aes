quantoVoceBebeNaoAdolesTitle= Information for under 18s | Alcohol & Health
quantoVoceBebeNaoAdolesH31= Congratulations on not consuming alcohol!
quantoVoceBebeNaoAdolesP1= Adolescence is a unique period for brain development.
quantoVoceBebeNaoAdolesP1a= Studies show that even adolescents who consume alcohol for a short time may have a decrease in brain volume. Over time, adolescents who consume alcohol may also have greater difficulties in solving problems that require reasoning.
quantoVoceBebeNaoAdolesP1b= By avoiding alcohol consumption, you not only preserve your brain for longer, but also avoid other possible damages that may be associated with health problems, accidents, fights and arguments.
quantoVoceBebeNaoAdolesP1c= Learning to have fun and enjoy life in a healthier way is always a good choice!
quantoVoceBebeNaoAdolesP2= If you have any doubts or come to consume alcohol in the future, seek a health professional and talk about this subject:
quantoVoceBebeNaoAdolesP3= Check below some of the frequent doubts among adolescents:
quantoVoceBebeNaoAdolesPtab1= 1. Why should I continue without drinking?
quantoVoceBebeNaoAdolesP4= Alcohol consumption is associated with a series of problems
quantoVoceBebeNaoAdolesP5= Many of these problems take time to appear and others are more visible
quantoVoceBebeNaoAdolesP6= Health problems, legal issues and accidents are associated with alcohol consumption
quantoVoceBebeNaoAdolesP7= Adolescents and adults can have their development impaired by alcohol, reducing their performance in sports, studies and work
quantoVoceBebeNaoAdolesPtab2= 2. What if I don't drink, but I'm thinking about trying?
quantoVoceBebeNaoAdolesP8a= We do not recommend that you start drinking at the moment, adolescents are much more exposed to the negative consequences related to alcohol consumption.
quantoVoceBebeNaoAdolesP8= We recommend that if you are considering trying alcohol or starting to drink, seek a health professional to get better informed.
quantoVoceBebeNaoAdolesP10= Know that there are several ways to resist the pressure to drink. Always seek help or support when you feel pressured about this matter.
quantoVoceBebeNaoAdolesP11= If someone offers you a drink, always say "no thank you", politely and directly. This demonstrates strength and determination.
quantoVoceBebeNaoAdolesP12= Try to stay away from people or places that pressure you to start drinking
quantoVoceBebeNaoAdolesP13= If you cannot resist and end up consuming alcohol, the sooner you can stop, the fewer negative effects the consumption will have - seek a health professional and ask for help
quantoVoceBebeNaoAdolesP15= If you want to delve deeper into this subject, we have prepared material for you here.
