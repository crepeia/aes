politicaDoSiteTitle1= Site policy | Alcohol & Health
politicaDoSiteP2= V.1.0
politicaDoSiteP3= We concern about protecting users' privacy and adopt the policy of protecting information about individuals. This policy describes the information collected by the site, how this information is used, how this is revealed, the information security, and how it can be accessed and corrected regarding the privacy of users.
politicaDoSiteP5= The choice of the information provided is entirely up to the user of the site. We use the information to generate data and improve the quality of services offered.
politicaDoSiteH31= 1. Collection of Personal Information
politicaDoSiteP6= This site can also collect and archive information regarding the website visit, including:
politicaDoSiteP7= This information
politicaDoSiteLi1= Name and domain where you accessed the internet;
politicaDoSiteLi3= The internet address of the website where you were directed to this website;
politicaDoSiteLi4= The pages you accessed while using the website.
politicaDoSiteP8= This site also collects information from registered people or visitors in order to improve quality and effectiveness. The administrator welcomes all kinds of feedback on all aspects.
politicaDoSiteLi5= Provide services to you;
politicaDoSiteLi6= Provide information and other types of communications;
politicaDoSiteLi7= Involve you in website initiatives;
politicaDoSiteLi8= Analyze patterns and trends of website use.
politicaDoSiteH32= 2. How is your personal information used?
politicaDoSiteP9= Personal information obtained through the site is used to:
politicaDoSiteP10= Some ways of using the information described above can be provided by third parties authorized to use this information for these proposals.
politicaDoSiteP11= The information collected for this site can also be used to determine demographic patterns of use. Personal information is not used for this purpose. This anonymous information, then, is used to improve the website and our services. This information will not be transmitted to third parties.
politicaDoSiteP12= In addition to the purposes described above, the site will not use your information without prior consent. The exception to this rule will be when the purpose of preventing any harm to health or justice is evident.
politicaDoSiteP13= The site implements procedures to ensure the security of the data collected, preventing the information from being lost, destroyed, used, or accessed in an unauthorized manner. The information provided by you will only be accessed by authorized personnel.
politicaDoSiteP14= However, no data transmission on the internet or information contained on our servers accessed via the internet is completely secure. These activities are your sole responsibility.
politicaDoSiteP15= Information collected through the website will not be revealed or passed on to third parties unless it is in accordance with this privacy policy. Information may be provided to third parties only with authorization and for a particular purpose.
politicaDoSiteH33= 3. Security of your data
politicaDoSiteH34= 4. Breach of confidentiality of information
politicaDoSiteP17= This website can change the privacy term by placing a new version on the site. You should refer to this page occasionally to familiarize yourself with possible changes. This privacy policy may change with the introduction of new regulations and laws.
politicaDoSiteP18= If you have any questions, please contact us from the address projeto.alcoolesaude@ufjf.br
politicaDoSiteH35= 5. Links to third party websites
politicaDoSiteH36= 6. Changes to the Privacy Statement
politicaDoSiteH37= 7. Contact

