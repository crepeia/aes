estrategiaDimAlterTitle1= Strategies to decrease drinking | Alcohol & Health
estrategiaDimAlterH31= Doing something different
alternativeReduceAlter01= Leisure Alternatives
estrategiaDimAlterLi1= Have you ever thought that drinking can occupy a large part of your free or leisure time?
estrategiaDimAlterL12= Look for new healthier activities, such as exercise (e.g., hiking, cycling, walking outdoors, etc.)
estrategia.dim.alter.h4.2= Com o tempo voc\u00ea ser\u00e1 mais saud\u00e1vel e mais confiante, caso evite beber para:
estrategia.dim.alter.li.3= Se sentir confort\u00e1vel em conversas, festas, churrascos, etc
estrategia.dim.alter.li.4= Melhorar o seu humor 
estrategia.dim.alter.li.5= Lidar com problemas


estrategiaDimDevTitle1= Controlling the Alcohol Intake | Alcohol & Health
estrategiaDimDevH31= Controlling the Alcohol Intake
alternativeDecreaseSlow01= Pace
estrategiaDimDevLi1= Always try to drink slowly
estrategiaDimDevLi2= Avoid drinking more than one drink per hour
estrategiaDimDevLi3= Always consume a non-alcoholic drink before and after a drink, with space between alcoholic drinks
estrategiaDimDevLi4= As for non-alcoholic drinks, you can drink water, juices, or soft drinks
alternativeDecreaseSlow06= Include food
estrategiaDimDevLi5= Never drink on an empty stomach
estrategiaDimDevLi6= Always try to eat during the period that you are drinking
estrategiaDimDevLi7= Having eaten causes alcohol to be absorbed into your body more slowly


estrategiaDimIntroP1= Small changes can make a big difference. Follow the steps until the construction of your personalized plan!
alternativeDecrease00= Learn about strategies that can help you reduce your alcohol consumption
estrategiaDimIntroLi1= Choose among them which ones you believe could help you
estrategiaDimIntroLi2= Initially, choose between two or three strategies that would be best suited to your routine
estrategiaDimIntroLi3= Try to use these strategies this week and in the next week
estrategiaDimIntroLi4= Choose others if necessary
estrategiaDimIntroLi5= If you are unable to make progress after 2 or 3 months, you may also want to consider quitting drinking, seeking the help of a healthcare professional
alternativeDecrease06= We will repeat this information at the end of your plan

record03= Setting a goal
estrategiaDimRegistroEletMetaHomP1= This is one of the most important steps to help you reduce your consumption
estrategiaDimRegistroEletMetaHomLi1= The ideal for your health would be to reach a low-risk consumption goal
