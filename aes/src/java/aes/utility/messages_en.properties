quantoVoceBebeSimGravidezTitle= How much do you drink - Information for Pregnant Women | Alcohol & Health
pregnantAdultDrink01= Information for Pregnant Women
quantoVoceBebeSimGravidezH31= Watch out!
quantoVoceBebeSimGravidezH32= More information about alcohol
quantoVoceBebeSimGravidezH33= Annual follow-up
quantoVoceBebeSimGravidezP1= You have reported drinking alcohol - which is highly harmful to the development of your baby.
quantoVoceBebeSimGravidezP2= It is essential that you remain without drinking throughout your pregnancy and even while you are breastfeeding.
quantoVoceBebeSimGravidezP3= We strongly recommend that you stop drinking and that you seek, as soon as possible, a health professional who can help you.
quantoVoceBebeSimGravidezP4= This one does not have specific tools for pregnant women yet.
pregnantAdultDrink04= We recommend that you read the questions and answers about alcohol and pregnancy below; they may help you.
quantoVoceBebeSimGravidezP6= No, you cannot
quantoVoceBebeSimGravidezP7= Do not consume alcohol if you are or may be pregnant
quantoVoceBebeSimGravidezP8= The alcohol you consume affects the development of your baby
quantoVoceBebeSimGravidezP9= No, it does not exist
quantoVoceBebeSimGravidezP10= Any drink that contains alcohol, even if in a small amount, can harm your baby
quantoVoceBebeSimGravidezP11= By alcoholic beverages, we refer to all, even beer, wine, cocktails, "Ice" or any other mixture containing alcohol.
quantoVoceBebeSimGravidezP12= No, every pregnancy is different
quantoVoceBebeSimGravidezP13= Alcohol consumption can harm one baby more than another
quantoVoceBebeSimGravidezP14= You could have had a child who was born healthy, but you could also have had a child born with problems
quantoVoceBebeSimGravidezP15= No, the problems affect your child development
quantoVoceBebeSimGravidezP16= In some more serious cases, even as an adult, your child will need special care
quantoVoceBebeSimGravidezP17= If you drank alcohol before knowing you were pregnant, stop drinking now and consult with a healthcare professional
quantoVoceBebeSimGravidezP18= You will feel better, and your baby will have a great chance of being born healthy
quantoVoceBebeSimGravidezP19= If you are suspected of being pregnant - do not drink alcohol
quantoVoceBebeSimGravidezP20= Even if you are trying to get pregnant, do not drink alcohol, as you may already be pregnant and not know it
quantoVoceBebeSimGravidezP21= Even in the first two months, alcohol can harm your baby
quantoVoceBebeSimGravidezP22= We recommend, in your case, that you consult with a healthcare professional to assist you
quantoVoceBebeSimGravidezP23= The content of this website was not developed especially for pregnant women, but some tips can be helpful:
quantoVoceBebeSimGravidezP24= Know that there are several ways to help you stop drinking
quantoVoceBebeSimGravidezP25= If someone offers you a drink, always say "no thank you", politely and directly
quantoVoceBebeSimGravidezP26= Try to stay away from people or places that make you drink
quantoVoceBebeSimGravidezP27= Do not store alcoholic beverages at home
quantoVoceBebeSimGravidezP28= If you are unable to stop drinking, consult with a healthcare professional and ask for help
quantoVoceBebeSimGravidezP29= If you do not have access to a healthcare professional, use Viva Voz (Dial 132 - toll-free)
