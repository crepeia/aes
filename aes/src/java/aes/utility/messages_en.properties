teenDrink03= You reported consuming alcohol, which can have negative health consequences in the future. Due to biological and legal reasons, minors under 18 should not use alcohol.
teenDrink06= Why should I not drink?
teenDrink07= Know that there are several ways to help you stop drinking. If someone offers you a drink, always say 'no thank you,' politely and directly. Try to stay away from people or places that make you drink. If you cannot stop drinking, seek a healthcare professional and ask for help. If you do not have access to a healthcare professional, use Viva Voz (Dial 132 - free call).
teenDrink08= If I already drink, what should I do?
teenNotDrink02= Congratulations on not consuming alcohol!
teenNotDrink03= Adolescence is a unique period for brain development. Studies show that even adolescents who have been consuming alcohol for a short time can experience a decrease in brain volume. Over time, adolescents who consume alcohol may also have greater difficulty solving problems that require reasoning. By avoiding alcohol consumption, you not only preserve your brain for longer but also avoid other possible damages that may be associated with health problems, accidents, fights, and arguments.
