alcoholYesDependence02= Considering your answers, your alcohol consumption could already be considered associated with several problems.
alcoholYesDependence03= The way you consume alcohol is consistent with the way alcohol-dependent people consume it.
alcoholYesDependence04= You are already experiencing significant problems and will greatly benefit from professional help.
alcoholYesDependence05= Generally known as alcoholism, alcohol dependence is a consequence of its abusive consumption.
alcoholYesDependence06= Problems related to alcohol consumption are considered important health problems and require care.
alcoholYesDependence08= We strongly recommend that you seek help from a healthcare professional or call the free 132 "Viva Voz" program.\n\nIf you prefer, you can also talk to us. We are available to help you and answer your questions with psychologists quickly and online!
alcoholYesDependence09= CLICK HERE TO LEARN MORE
alcoholYesDependence10= These steps can help you better understand how your alcohol consumption can currently harm your health.
alcoholYesDependence11= Would you additionally like to know some practical strategies that can help you with this problem?
alcoholYesDependence14= If you are interested in receiving our contact again, click the button below:
alcoholYesDependence15= Contact in 1 Year
alcoholYesDependence16= Or return to the main page:
alcoholYesLowRisk02= On some occasions you have been drinking above the recommended amount
alcoholYesLowRisk03= Although your consumption can be considered low risk, you have been drinking above what is recommended for you on some occasions
alcoholYesLowRisk04= Many health problems related to alcohol use take time to appear and depend on the amount you drink
alcoholYesLowRisk05= The World Health Organization recommends the following limits:
alcoholYesLowRisk07= Day: up to 2 standard drinks per day
alcoholYesLowRisk08= Week: No more than 10 standard drinks per week
