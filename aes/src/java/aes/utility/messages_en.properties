termsDescriptionP1= Welcome to the Alcohol & Health website. For the use of the site to be satisfactory and not offensive to you, it is important to read, understand and agree to the following terms and conditions.
termsDescriptionP2= This website was developed to be a public service to offer information and a program to prevent alcohol abuse.
termsDescriptionP3= The program is complementary to the other programs for preventing alcohol abuse, and its use is not a substitute for healthcare support.
termosUso07= The program is experimental and will be tested for its clinical efficacy.
termsAccessH3= Access to the site
termsAccessP= Some of the website pages are freely accessible to all visitors. However, access to the treatment program requires free registration. To be registered, it is necessary to choose a username and password. The username and password must be kept confidential and must not be shared with any other user. Visitors are requested not to disclose their username and password to third parties.
termosUso10= Prohibitions
termsRestrainsLi1= Use the name of another person, username, or password when accessing this website, without prior consent;
termsRestrainsLi2= Writing or transmitting any material that may, in some way, defame, offend or cause discomfort to anyone; be obscene or that in any way interfere with the use of other users on this website;
termsRestrainsLi3= Provide any information for the website that is confidential or owned by third parties;
termsRestrainsLi4= Using this website in any way that may violate laws, rules or regulations or the rights of third parties; or
termsRestrainsLi5= Transmit virus or any content that interferes with the functionality of the website.
termosUso16= Guarantees
termsGarantiesP1= Every effort has been made to ensure that the information and materials contained on this website are completely true and not harmful. The materials and information made available were evaluated by specialists in the field of tobacco treatment and by ex-smokers.
termsGarantiesP2= The website does not guarantee that the services will be made available uninterruptedly or constantly.
termsGarantiesP3= Although the services proposed by the website are intended to provide help to smokers, smokers are encouraged to seek support from health professionals. All users must use this website at their own risk.
termosUso20= Third-Party Services and Materials
termsThirdpartyP= Information on this site may include services and information from third parties. Third-party content and services will be made available with prior approval.
termosUso22= Links
termsLinksP= This site contains links to other sites that are not under our control or maintained by us. Third-party links are made available for convenience and information. If the user accesses this information, the risks of use are the sole responsibility of the user. The fact that a third-party website is linked to it does not necessarily imply sponsorship or that the third-party website is affiliated with this website.
termosUso24= Changes to Information, Products and Services
termsChangesP= Information, products, and services published on this website are subject to change without notice.
termsInfoH3= Information made available by the website
termsInfoP= People enrolled in the Alcohol & Health program make information related to their content involuntarily available. Once made available, the information owned by the user can be reproduced, published, transmitted, made available, subject to the obligations of the Privacy Policy.
