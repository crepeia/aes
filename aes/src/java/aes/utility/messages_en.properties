strategyStopIntroduction01= People who may be addicted may find it difficult to stop drinking without help.
strategyStopIntroduction03= There are currently several treatment approaches that have been proven to help you.
strategyStopIntroduction05= Starting by seeking help is an excellent path.
strategyStopIntroduction06= Your chances are much higher when you find a type of treatment that you feel comfortable with.
strategyStopIntroduction08= The following suggestions are most helpful for people who are at high risk of becoming dependent on alcohol.
strategyStopProfessionalSupport02= Advances in alcoholism treatment mean that patients now have more treatment options and professionals have more tools.
strategyStopProfessionalSupport03= New medications may help you stop drinking by targeting neural pathways.
strategyStopProfessionalSupport04= These newer medicines (e.g., Naltrexone, Topiramate, etc.) do not make you feel nauseous like the older medicines (e.g., Disulfiram).
strategyStopProfessionalSupport05= None of these medications are addictive, which is a concern for some alcohol support groups and counseling services.
strategyStopProfessionalSupport06= Studies have shown that patients with alcohol dependence can receive effective treatment by combining these new medications and brief visits to a healthcare professional for follow-up.
strategyStopProfessionalSupportTherapy02= There are different types of counseling/therapies that can help you and are effective:
strategyStopProfessionalSupportTherapy03= Some examples are the cognitive behavioral approach, motivational approach, 12 steps or a combination of these.
strategyStopProfessionalSupportTherapy04= Despite the differences in approaches, getting some kind of help for yourself is more important than a specific approach, as long as you are offered an approach that is empathetic, avoids harsh confrontations, increases your motivation, and offers you objective methods for changing your drinking.
strategyStopProfessionalSupportTherapy06= Some people, but not most, may require more intensive programs. If you need a referral to such a program, consult a healthcare professional.
strategyStopSocialSupport01= In this case it is important:
strategyStopSocialSupport02= Talk about your change with family and friends.
strategyStopSocialSupport03= Seek to develop new interests and new social groups.
strategyStopSocialSupport04= Find a pleasant way to use your time so that alcohol is not involved.
strategyStopSocialSupport05= We strongly recommend that if you want to stop drinking you should seek help from a healthcare professional.
strategyStopSocialSupport06= Ask for help from other people.
strategyStopSocialSupport07= When people stop drinking, they often face the challenge of rebuilding their lives without alcohol.
strategyStopSocialSupportAA02= People in recovery who attend groups like AA regularly tend to have better outcomes than those who don\'t.
strategyStopSocialSupportAA04= Find a group where you feel most comfortable.
strategyStopSocialSupportAA05= In a group where you feel more comfortable, you will have a better chance of getting involved, and you may even be able to help other people in the future.
strategyStopSocialSupportOthers02= Don\'t offer you alcohol.
strategyStopSocialSupportOthers03= Avoid using alcohol when you are present.
strategyStopSocialSupportOthers04= Offer you support and avoid criticism.
strategyStopSocialSupportOthers05= Don\'t ask you to take on new demands at this time.
strategyStopSocialSupportOthers07= Also seek help from a professional or groups like Al-Anon.
strategyStopSupportDepressionAndAnxiety02= Moderate symptoms may stop bothering you once you start drinking less or stop drinking altogether.
strategyStopSupportDepressionAndAnxiety04= Seek medical advice.
strategyStopSupportDepressionAndAnxiety06= There are treatments available that can help you through this situation.
strategyStopSupportDoNotGiveUp01= Changing behaviors like smoking, overeating, or drinking too much can take a lot of effort and may not yield positive results the first time.
strategyStopSupportDoNotGiveUp02= Some failures along the way are common, but you always learn more each time you go through them.
strategyStopSupportDoNotGiveUp03= Each of these attempts will bring you closer to your goal.
strategyStopSupportDoNotGiveUp05= If this approach doesn\'t work, try something else.
strategyStopSupportDoNotGiveUp06= If anything goes wrong along the way, try to get back on track as quickly as possible.
strategyStopSupportDoNotGiveUp08= Although this is a long journey, you have a good chance of success.
strategyStopSupportDoNotGiveUp09= The more you persist in trying, the greater your chances of success.
strategyStopSupportDoNotGiveUp10= Several studies support this, showing that it is possible to change your behavior regarding alcohol.
