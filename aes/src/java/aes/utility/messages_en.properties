h2PageBlank= Program Objective
aboutobjectiveContent= Provide support and quality health information for people who use alcohol.
h2PageBlank1= Development
pPageBlank1= Developed by specialists from the Federal University of Juiz de Fora, the principles of
pPageBlank2= The content is based on guidelines for the treatment of problems related to alcohol use - following the guidelines of the World Health Organization, Ministry of Health and NIAAA
pPageBlank3= This site does not replace the support provided by a health professional. The entire content of the site is being evaluated by a clinical survey registered with the UFJF Research Ethics Committee
h2Pesquisadores= Motivation
pPesquisadores1= Alcohol abuse is associated with more than 60 different types of health problems with a high economic and social cost.
pPesquisadores2= There is evidence that internet-based interventions can be effective in reducing alcohol abuse.
pPesquisadores3= The use of the internet in the country is growing exponentially, which characterizes this space as opportune to offer quality health information.
pPesquisadores31= . However, there are still few studies that assess the acceptability and effectiveness of these interventions in countries with socio-economic characteristics like Brazil.
pPesquisadores4= Although there are sites in Portuguese that offer information about alcohol, we consider that there is still an important
pPesquisadores5= "Disparity between the demand and the supply of quality of online interventions for various health behaviors."
h2Pesquisadores1= Our methodology
pPesquisadores6= The website's content is based on the guidelines of the World Health Organization for the identification of problems related to the use of alcohol and intervention for brief the use of risk and harmful use of alcohol. Part of the content is also based on the NIAAA classic guide "Helping Patients who Drink too much".
pPesquisadores7= During the development stages, people who consume alcohol were consulted through collective interviews and usability tests. After the end of the first version, its content was evaluated by specialists in brief interventions.
pPesquisadores8= The content respects the rules of the Federal Council of Medicine, Federal Council of Psychology and Health on the Net Foundation

