pregnantAdultDrink02= Caution!
pregnantAdultDrink03= You reported consuming alcohol - which is harmful to the healthy development of your baby. It is essential that you remain sober throughout your pregnancy and even while breastfeeding. We strongly recommend that you stop drinking and seek a healthcare professional as soon as possible to help you. This app does not yet have specific tools for pregnant women.
pregnantAdultDrink05= No, you cannot. Do not consume alcohol if you are or may be pregnant. The alcohol you consume affects your baby's development.
pregnantAdultDrink06= Can I consume alcoholic beverages if I am pregnant?
pregnantAdultDrink07= No, there isn't. Any drink containing alcohol, even in smaller amounts, can harm your baby. By alcoholic beverages, we mean all of them, even beer, wine, cocktails, 'ice,' or any other mixture containing alcohol.
pregnantAdultDrink08= Is there any type of alcoholic beverage that is safe to use during pregnancy?
pregnantAdultDrink09= No, each pregnancy is different. Alcohol consumption can harm one baby more than another. You might have had a child who was born healthy, but you could also have had a child born with problems.
pregnantAdultDrink10= If I drank during my last pregnancy and had no problems, is it okay to drink this time?
pregnantAdultDrink11= No, the problems affect your child's development. In some more severe cases, even as an adult, your child will need special care.
pregnantAdultDrink12= Will the problems my baby might have from my drinking improve over time?
pregnantAdultDrink13= If you drank alcohol before you knew you were pregnant, stop drinking now and seek a healthcare professional. You will feel better, and your baby will have a great chance of being born healthy. If you suspect you are pregnant - do not drink alcohol. Even if you are trying to conceive, do not drink alcohol, as you may already be pregnant and not know it. Even in the first two months, alcohol can harm your baby.
pregnantAdultDrink14= What should I do if I am pregnant but have been drinking?
pregnantAdultDrink15= In your case, we recommend seeking a healthcare professional to help you. The content of this site was not developed specifically for pregnant women, but some tips may be useful: Know that there are several ways to help you stop drinking; If someone offers you a drink, always say 'no thank you,' politely and directly; Try to stay away from people or places that make you drink; Do not keep alcoholic beverages at home; If you cannot stop drinking, seek a healthcare professional and ask for help; If you do not have access to a healthcare professional, use Viva Voz (Dial 132 - free call).
pregnantAdultDrink16= How do I stop drinking?
pregnantAdultNotDrink01= Information for Pregnant Women
pregnantAdultNotDrink03= You reported not consuming alcohol, which is essential for a baby's healthy development. It is fundamental to remain sober throughout pregnancy and even while breastfeeding. If you have questions, seek a healthcare professional.
pregnantAdultNotDrink04= Frequent questions among pregnant women:
pregnantTeenDrink02= Caution - you and your future baby are at risk!
pregnantTeenDrink03= You reported drinking and that you might be pregnant - Alcohol consumption is very harmful to adolescents and extremely harmful to your baby's healthy development. All teenage pregnancies can be considered high-risk pregnancies - Seek a healthcare professional for more guidance on what precautions to take. We strongly recommend that you stop drinking and seek a healthcare professional as soon as possible to help you. This application does not yet have specific tools for pregnant women and adolescents.
pregnantTeenDrink04= We recommend that you read the questions and answers about alcohol and teenage pregnancy below; they may help you.
pregnantTeenNotDrink02= Congratulations on not consuming alcohol! Caution: all teenage pregnancies are considered high-risk, even if you do not consume alcohol.
pregnantTeenNotDrink03= Adolescence is a unique period for brain development. Studies show that even adolescents who have been consuming alcohol for a short time can experience a decrease in brain volume. Over time, adolescents who consume alcohol may also have greater difficulty solving problems that require reasoning. By avoiding alcohol consumption, you not only preserve your brain for longer but also avoid other possible damages that may be associated with health problems, accidents, fights, and arguments.
pregnantTeenNotDrink04= Learning to have fun and enjoy life in a healthy way is always a good choice!
pregnantTeenNotDrink05= If you have questions or consider consuming alcohol in the future, seek a healthcare professional and discuss this matter.
pregnantTeenNotDrink06= Frequent questions among adolescents
pregnantTeenNotDrink07= Alcohol consumption is associated with a series of problems. Many of these problems take time to appear, and others are more visible. Health, legal, and accident problems are associated with alcohol consumption. Adolescents and adults can have their development impaired by alcohol, reducing their performance in sports, studies, and work.
pregnantTeenNotDrink08= Why should I continue not drinking?
pregnantTeenNotDrink09= In your case, if you are considering trying alcohol or starting to drink, we recommend seeking a healthcare professional for more information. We do not recommend starting to drink at this time; adolescents are much more exposed to the negative consequences related to alcohol consumption. The content of this site was not developed specifically for adolescents, but some tips may be useful: \n Know that there are several ways to resist pressure to drink; Always seek help or support when you are feeling pressured about this issue; \n If someone offers you a drink, always say 'no thank you,' politely and directly. This demonstrates strength and determination. Try to stay away from people or places that pressure you to start drinking. If you cannot resist and do consume alcohol, the sooner you stop, the smaller the negative effects of consumption will be - seek a healthcare professional and ask for help.
pregnantTeenNotDrink10= What if I don't drink but am thinking of trying it?
preparingDecreaseOrStop01= Would you like to stop drinking or reduce the amount you drink?
preparingDecreaseOrStop04= Ready to change?
preparingDecreaseOrStop05= At this time you can choose to reduce or stop drinking.
preparingDecreaseStopNo02= Continue to pay attention to how much you have been drinking, considering frequency and quantity.
preparingDecreaseStopNo03= Try to understand how much alcohol affects you.
preparingDecreaseStopNo04= Address other priorities that may be in the way of your change.
preparingDecreaseStopNo05= Ask for help from a friend, healthcare professional, or someone else you trust.
preparingDecreaseStopNo06= Re-evaluate on the website, mainly considering the pros and cons of changing.
preparingDecreaseStopNo08= The sooner we change, the greater our chances of success and the lesser the harm to the individual and their families.
preparingDecreaseStopNo12= You are not yet thinking about changing!
preparingDecreaseStopNo13= Although alcohol can cause problems, you replied that you are not yet ready to change.
