tip= Tip
tip10= Whenever you start to feel like drinking, start doing something fun that doesn't involve alcohol. Over time, you will drink less.
tip13= If you feel a strong urge to drink, talk to someone who can help. You will benefit from sharing your feelings and thoughts.
tip15= Communicate to your friends your decision to reduce the frequency and quantity of alcohol consumption \u2013 they can help maintain your decision by not offering you drinks.
tip19= Stay alert! If you need larger quantities than before to feel the same effects of alcohol, this indicates a significant problem, but it can be resolved if you try to stop drinking, at least for a while.
tip28= Want to drink less? Try to follow the reduction strategies that best suit you.
tip29= When your glass is empty, think about the consequences of drinking a little more. Going beyond the standard drinks you planned can lead to problems controlling your consumption.
tip33= Learn that it is your right to refuse a drink when someone offers it to you. Always say no, thank you very much! This formula is simple and can help in various situations.
tip34= If you want to stop drinking but have found it difficult, seek help from a health professional who can assist you. Asking for help can be a difficult step, but it will bring important rewards in the future.
tip36= Even if you are drinking less, never drive after drinking. Thinking about your health also involves thinking about avoiding accidents.
tip37= Always think about the consequences and your health before you start drinking. Create this habit of thinking about the consequences before you start drinking.
tip42= Avoid participating in drinking games or contests. These games often involve large quantities of drink, consumed very quickly, increasing the risk of problems resulting from consumption.
tip45= An exercise that can help you is to avoid taking the first sip. Wait about 1 or 2 hours before you start drinking; this time can help you control the urge to drink and think about the negative consequences of consumption.
tip49= Avoid participating in rounds. These occasions can lead you to consume alcohol beyond what you had planned.
tip54= Drink plenty of water before consuming any alcoholic beverage. Consider this advice especially if you are thirsty.
tip55= Identify the things, images, and thoughts that contribute to your well-being. Many people overdo it with alcohol because they are sad or angry.
tip62= Involve a trusted friend or family member to help you stay motivated. Share with them the goals you have achieved and also the moments of difficulty.
tip9= Is your glass half empty? Take a break and stop drinking for 15 minutes. You will notice that you will drink less using this strategy.
