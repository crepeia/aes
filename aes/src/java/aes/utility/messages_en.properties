termoConsentimentoTitle1= Consent Term | Alcohol & Health
tcleOptionTerm= Free and Informed Consent Term
termoConsentimentoP1A= You are being invited as a volunteer to participate in the research \ u201cInformalcool - Evaluation of the effectiveness of Brief-intervention steps to reduce the consumption of alcohol assisted by computer \ u201d.
termoConsentimento03= We emphasize that your data will be treated with the utmost confidentiality and will not be shared with third parties at any time. Evaluating the data of website users is important so that we can build increasingly elaborate intervention tools.
termoConsentimento04= In this study, we intend to evaluate the effectiveness of different virtual interventions for alcohol consumption reduction.
termoConsentimento05= The reason we are studying this topic is the public health relevance of alcohol-related harms that could be avoided through computer-mediated interventions, as has been demonstrated in several countries around the world (Netherlands, England, Sweden, Mexico, India, and Belarus).
termoConsentimentoP3= The procedures will be carried out as follows: we will evaluate the answers provided by each user during the navigation on the website, the scores of the AUDIT and the questionnaires, and the website usage.
termoConsentimento07= To participate in this study
termoConsentimentoP4b= you will have no cost,
termoConsentimentoP4c= nor receive any financial advantage.
termoConsentimento08= You will be clarified about the study in any aspect you wish and will be free to participate or refuse to participate.
termoConsentimentoP5b= You may withdraw your consent or discontinue participation at any time.
termoConsentimento09= Your participation is voluntary and refusal to participate will not incur any penalty or modification in the way you are assisted by the researcher. The researcher will treat your identity with professional standards of 
termoConsentimento091= confidentiality.
termoConsentimento10= Once again, we emphasize that 
termoConsentimento11= you will not be identified
termoConsentimentoP6d= in any publication that may result from this study. This study presents a minimal risk, that is, the same risk that exists in routine activities such as talking, bathing, reading, etc. Despite this, you have been guaranteed the right to compensation or indemnification in the event of any damages eventually produced by the research.
termoConsentimentoP7= The data and instruments used in the research will be archived with the researcher responsible for a period of 5 years, after which time it will be destroyed.
termoConsentimento14= I have been informed of the objectives of the present study in a clear and detailed manner and have clarified my doubts. I know that at any time I can request new information and change my decision to participate if I wish.
termoConsentimento15= I declare that I agree to participate in this study.
termoConsentimentoP9= REGISTER

termosDeUsoP2= This website was developed to be a public service, offering information and a program to help people at risk of alcohol consumption.
termosUso04= The program is complementary to traditional approaches that aim to help people drink less and 
termosUso05= No
termosUso06= replaces consultation with health professionals.
termosDeUsoP4= The program is
termosDeUsoP41= experimental and will be tested for clinical effectiveness
termosDeUsoP5= Some of the pages on the website are freely accessible to all visitors. However, access to the program requires free registration. If there is interest on the user's part, it is necessary to choose a username and password. Username and password must be kept confidential and must not be shared with any other user. Visitors are requested not to disclose their username and password to third parties.
termosDeUsoP6= Every effort has been made to ensure that the information and materials contained in this website are completely true and non-harmful. The materials and information provided were evaluated by experts in preventing alcohol abuse and by people who have already used the strategy of drinking less.
termosDeUsoObject1= gpl

quemSomosOsAutoresH13= The authors
quemSomosOsAutoresP1= The Alcohol & Health project was created by the e-health research group of
