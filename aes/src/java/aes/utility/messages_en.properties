quemSomosOsAutoresP3= CREPEIA Coordinator, Professor at Federal University of Juiz de Fora (Brazil). Masters in Social Psychology (UFMG, Brazil), Doctor in Health Sciences (Unifesp, Brazil), Post-Doctoral in Alcohol and Drugs (University of Connecticut Health Center, USA, and USP, Brazil). CNPq researcher.
quemSomosOsAutoresP4= Professor of the Psychology Department at Federal University of Juiz de Fora (Brazil). Her main themes of work and research are psychotropic substance use, clinical evaluation studies and validation of instruments, treatment for substance.
quemSomosOsAutoresP6= Psychologist and researcher at CREPEIA on the e-health group. Masters in Psychology within the project "Alcohol and Health". He did an internship in treatment groups for smokers and develops websites.
quemSomosOsAutoresP7= Professor and course coordinator at the Regional Drug Reference Center at Federal University of Juiz de Fora and Federal University of Sao Joao Del Rei. Masters in Psychology and Specialist in Statistics. Ph.D. student in Psychology in the e-health area.
quemSomosOsAutoresP8= Psychologist with training in Cognitive-Behavioral Therapy. Masters student in Psychology with the project "Comparison of the efficiency of brief Psychotherapy via internet and in-person for alcohol addicts: a randomized study".
quemSomosOsAutoresP9= Graduating in Computer Science at the Federal University of Juiz de Fora. She is currently a fellow at the Federal University of Juiz de Fora.
quemSomosOsAutoresP10= Graduating in Computer Science from the Federal University of Juiz de Fora. He is currently a fellow at the Federal University of Juiz de Fora.
quemSomosOsAutoresP11= Researcher at CREPEIA and Master's student at UFJF. Territory coordinator at the Regional Drug Reference Center at UFJF. Psychologist with a sandwich degree at the University of Kansas Medical Center (KUMC, USA).
quemSomosOsAutoresP12= Graduating in Computer Science from the Federal University of Juiz de Fora. He is currently a fellow at the Federal University of Juiz de Fora.
quemSomosOsAutoresP13= Graduated in Social Communication - Journalism from the Federal University of Juiz de Fora (2013). She studied Specialization in Advertising Creation at PUC Minas (2015). She is currently a Master's student in the Post-graduate Program in Communication at the Federal University of Juiz de Fora.
quemSomosOsAutoresP14= Professor of Computer Science at UFJF. Holds a PhD in Informatics from PUC-RJ and is a member of the Laboratory of Innovative Applications in Computing (LApIC), where he researches Natural Language Processing, Information Retrieval, and Artificial Intelligence in Education. He works on technological development and innovation projects in the field of AI in Education and is a reviewer for scientific journals and events in the fields of Informatics in Education and AI in Education.
quemSomosOsAutoresP15= Master's student in Psychology in the Graduate Program in Psychology at the Federal University of Juiz de Fora (UFJF), in the research line of Psychosocial Processes in Health, and a psychologist graduated from the same university. Researcher at the Reference Center for Research, Intervention, and Evaluation in Alcohol and Other Drugs (CREPEIA), focusing on online interventions for alcohol use.
quemSomosOsAutoresP16= Holds a Master's degree in Computational Modeling from the Federal University of Juiz de Fora. Holds a degree in Statistics from the Federal University of Juiz de Fora.
