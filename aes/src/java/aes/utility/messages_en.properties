estrategiaDimRegistroTitle1= Track how much you drink | Alcohol & Health
keepDrinking01= Record how much you drink
estrategiaDimRegistroLi1= Track how much you are drinking is one of the tasks that can most help you to reduce your consumption
estrategiaDimRegistroLi2= It is important that you choose the most practical way to make this registration
alternativeDecreaseRegist01= Below are some suggestions for logging
estrategiaDimRegistroLi3= Use the website tool
estrategiaDimRegistroLi4= Use printed cards that can be in your wallet or purse
estrategiaDimRegistroLi5= Use a calendar at home to register
estrategiaDimRegistroLi6= Register in the notepad of your cellphone or computer
alternativeDecreaseRegist06= You can also do this log on the website or print it as you will see on the next page

estrategiaPararApoioDepreAnsiTitle1= Stopping Drinking
estrategiaPararApoioDepreAnsiH31= Feeling depressed or anxious
strategyStopSupportDepressionAndAnxiety01= Feeling depressed or anxious is common among people who have some kind of alcohol problem
estrategiaPararApoioDepreAnsiLi1= Moderate symptoms can stop bothering you after you start drinking less or stop drinking
strategyStopSupportDepressionAndAnxiety03= If symptoms persist or worsen:
estrategiaPararApoioDepreAnsiLi2= Seek help from a healthcare professional
strategyStopSupportDepressionAndAnxiety05= If you have had thoughts related to suicide, seek emergency services near you (such as the fire department, emergency room, or your own doctor)
estrategiaPararApoioDepreAnsiLi3= There are treatments available that can help you get through this situation

strategyStopIntroduction07= Quitting Drinking
estrategiaPararApoioIntroH41= The following suggestions are most helpful for people who are very likely to have become addicted to alcohol
estrategiaPararApoioIntroLi1= People who may be addicted may find it difficult to stop drinking without help
strategyStopIntroduction02= We strongly recommend that if you want to stop drinking, you seek help from a health professional
estrategiaPararApoioIntroLi2= There are currently several treatment approaches that are proven to help you
strategyStopIntroduction04= It is important to emphasize that there is no single type of treatment and that each person may adapt better to a specific one
estrategiaPararApoioIntroLi3= Starting looking for help is an excellent way
estrategiaPararApoioIntroLi4= Your chances are much greater when you find a type of treatment that you feel comfortable with

quittingDrinkingProfessionalSuport= Quitting Drinking - Professional Support
strategyStopProfessionalSupportTherapy01= Counseling or "Therapy"
estrategiaPararApoioProfTerapiaP1= There are different types of counseling/therapies that can help you and that are effective
estrategiaPararApoioProfTerapiaLi1= Some examples are the cognitive-behavioral approach, motivational approach, 12 steps, or a combination of them
estrategiaPararApoioProfTerapiaLi2= Despite the differences between the approaches, getting some help itself is more important than a specific approach, as long as it is offered to you an empathetic approach, avoids heavy confrontations, increases your motivation, and offers you multiple goals to change the way you drink
strategyStopProfessionalSupportTherapy05= Specialized intensive treatment programs
estrategiaPararApoioProfTerapiaLi3= Some people, not most of them, may need more intensive programs. If you need a referral to a program like this, search for a healthcare professional

strategyStopProfessionalSupport01= Medications to treat alcoholism
estrategiaPararApoioProfissionalP1= Advances in the treatment of alcoholism mean that currently, patients have more treatment alternatives and that health professionals have more tools
estrategiaPararApoioProfissionalLi1= New drugs can help you stop drinking by acting on neural pathways
estrategiaPararApoioProfissionalLi2= These new drugs (e.g., Naltrexone, Topiramate, etc.) do not make you feel nauseous like the older drugs (e.g., Disulfiram)
estrategiaPararApoioProfissionalLi3= None of these medications cause dependence, which concerns some support groups and counseling services for alcohol.
estrategiaPararApoioProfissionalLi4= Studies have shown that patients with alcohol dependence can receive effective treatment combining these new medications and brief visits by a health professional for follow-up.

estrategiaPararApoioProfissionalNaoDesistaTitle= Stopping drinking | Alcohol & Health
changingYourBehaviorDontGiveUp= Changing Your Behavior - Don\'t Give Up
estrategiaPararApoioProfissionalNaoDesistaP1= Changing behaviors such as smoking, overeating, or drinking too much can take a lot of effort and may not have positive results in the first attempt
estrategiaPararApoioProfissionalNaoDesistaLi1= Some flaws along the way are common, but you always learn more each time you pass them
estrategiaPararApoioProfissionalNaoDesistaLi2= Each of these attempts will bring you closer to your goal
strategyStopSupportDoNotGiveUp04= Whichever path you choose - try it fairly
estrategiaPararApoioProfissionalNaoDesistaLi3= If this approach does not work, try something else
estrategiaPararApoioProfissionalNaoDesistaLi4= If any failure occurs during this path, try to get back to the tracks as quickly as possible
strategyStopSupportDoNotGiveUp07= Remember:
estrategiaPararApoioProfissionalNaoDesistaLi5= Despite this being a long journey, you have great chances of success
estrategiaPararApoioProfissionalNaoDesistaLi6= The more you persist in trying, the greater the chances of success
estrategiaPararApoioProfissionalNaoDesistaLi7= Several researches support this, showing that it is possible to change your behavior with alcohol

quittingDrinkingSelfHelpGroups= Quitting Drinking - Self-Help Groups
strategyStopSocialSupportAA01= Consider joining a self-help group like Alcoholics Anonymous
estrategiaPararApoioSocialAaLi1= People in recovery who attend groups like AA regularly tend to have better results than those who do not
strategyStopSocialSupportAA03= Groups can vary greatly
estrategiaPararApoioSocialAaLi2= Search for a group in which you feel most comfortable
estrategiaPararApoioSocialAaLi3= In a group that you feel more comfortable with, you will be more likely to get involved, including being able to help others in the future

quittingDrinkingAskingForHelp= Quitting Drinking - Asking for Help
strategyStopSocialSupportOthers01= When asking for help to stop drinking, whether from friends or anyone else, it is important to ask them to
estrategiaPararApoioSocialOutrosLi1= Do not offer you alcohol
estrategiaPararApoioSocialOutrosLi2= Avoid using alcohol when you are present
estrategiaPararApoioSocialOutrosLi3= Support you and avoid criticism
estrategiaPararApoioSocialOutrosLi4= Do not ask you to take on new demands at the moment
estrategiaPararApoioSocialOutrosLi6= Also, seek help from a health professional or groups like AA

estrategiaPararApoioSocialH31= Stopping Drinking - Social Support
estrategiaPararApoioSocialH41= When quitting drinking, people often face the challenge of rebuilding their life without alcohol
estrategiaPararApoioSocialH32= In this case, it is important that:
estrategiaPararApoioSocialLi1= Talk about your change with family and friends
estrategiaPararApoioSocialLi2= Try to develop new interests and new social groups
estrategiaPararApoioSocialLi3= Find a pleasant way to use your time so that alcohol is not involved
estrategiaPararApoioSocialLi5= Ask for help from other people

