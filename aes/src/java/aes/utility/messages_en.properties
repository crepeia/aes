termosUso29= All content of Alcohol & Health, including programs, design, texts and graphics are licensed under the General Public License - GNU, guaranteeing the freedom to use the program's content for any purpose, modify the program, share it with your neighbors and friends, and share the changes you make.
termosUso32= Alcohol & Health contains registered third-party trademarks and logos, protected by law. Their use is not permitted without prior consent.
