#######################################
estrategiaDimAltPlanFisTitle1= Fissure control plan | Alcohol & Health
estrategiaDimAltPlanFisH31= Controlling the fissure
alternativePlanFissureText01= Plan to resist the urge to drink (craving)
estrategiaDimAltPlanFisLi1= Some events around you can make you feel very much like drinking
alternativePlanFissureText03= When this happens, you should consider these three options:
estrategiaDimAltPlanFisL12= Remember the reasons that led you to change the way you drink (keep it in writing or recorded on your phone/computer)
estrategiaDimAltPlanFisLi3= Share this with someone you trust - talk about how this process is going
estrategiaDimAltPlanFisL14= Try to engage in a healthy activity or something that distracts you (such as exercise or a hobby that does not involve alcohol).
alternativePlanFissureText07= Accept your craving
alternativePlanFissureText08= Instead of fighting what you're feeling, accept it and wait for your urge to pass.
estrategiaDimAltPlanFisP4= Even the most intense urge to drink will pass - usually within a few minutes. Remembering this will help
alternativePlanFissureText10= Think of this urge as a wave that strongly hits a beach but loses its strength after a while.
