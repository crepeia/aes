tcleBody11= We would like to invite you to participate as a volunteer in the research 
tcleBody12= \u201cMobile Application with Game Elements in an Intervention for Excessive Alcohol Consumption\u201d. 
tcleBody13= The reason we are conducting this research is the importance of a system that assists in interventions for high-risk alcohol users. In this research, we intend to evaluate user satisfaction and experience with the use of a mobile application that assists in such interventions.
tcleBody21= If you agree to participate, some closed questions will appear during the use of the application. These questions will be asked to assess your degree of satisfaction and your experience with the system and with the game elements 
tcleBody22= (level, badge, leader board, and ranking) 
tcleBody23= present in the application. We ask that you answer these questions seriously so as not to affect the final result of the research. If you agree to participate, we will also collect some data obtained through your interaction with the application.
tcleBody3= The questions will appear every day at a time you define. You can choose this time after this document, in case of a positive response for participation in the research. You can also change the time you will receive the questions through an option in the settings.
tcleBody4= This research has a risk, which is the emergence of psychologically uncomfortable situations. To reduce the chance of this risk occurring, the questions to be asked have been developed to avoid as much as possible the appearance of uncomfortable situations and past psychological problems. The research can help you to have greater satisfaction and engagement in using the application and in the intervention processes it offers.
tcleBody5= To participate in this study, you will have no cost and will not receive any financial advantage. However, if you suffer any harm due to the activities we carry out with you in this research, you have the right to seek compensation. You will have all the information you want about this research and will be free to participate or refuse to participate. Even if you want to participate now, you can change your mind or stop participating at any time, through an option in the settings that allows you to enter and exit the research at any time. Your participation is voluntary and not wanting to participate will not bring any penalty. The researcher will not disclose your name. The research results will be available to you when finalized. Your name or material indicating your participation will not be released without your permission. You will not be identified in any publication that may result from this research.
tcleBody61= The researchers will treat your identity with professional standards of secrecy, complying with Brazilian legislation 
tcleBody62= (Resolution No. 466/12 of the National Health Council)
tcleBody63= , and using the information only for academic and scientific purposes. The researchers will also treat your data obtained in the research in a way that protects your fundamental rights to freedom and privacy and following the principles expressed by the 
tcleBody64= General Data Protection Law (LGPD, Law No. 13,709/2018).
tcleBody71= If you have any questions regarding the process, we will answer them via email 
