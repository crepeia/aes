alternativeDecrease01= Choose among them which ones you believe could help you.
alternativeDecrease02= Initially choose two or three strategies that would be most suitable for your routine.
alternativeDecrease03= Try using these strategies next week and the following week.
alternativeDecrease04= Choose others if necessary.
alternativeDecrease05= If you do not make progress after 2 or 3 months, you may also consider stopping drinking and seeking help from a health professional.
alternativeDecrease08= Strategies to decrease!
alternativeDecrease09= Small changes can make a big difference. Follow the steps until your personalized plan is ready.
alternativeDecreaseRegist02= Use the tool on the website itself.
alternativeDecreaseRegist03= Use printed cards that can be in your own wallet or purse.
alternativeDecreaseRegist04= Use a calendar at home to log.
alternativeDecreaseRegist05= Log in the notepad on your phone or computer.
alternativeDecreaseRegist08= Log how much you drink!
alternativeDecreaseSlow02= Always try to drink slowly.
alternativeDecreaseSlow03= Avoid drinking more than one standard drink per hour.
alternativeDecreaseSlow04= Always consume a non-alcoholic beverage before and after a standard drink, leaving space between drinks.
alternativeDecreaseSlow05= As non-alcoholic beverages, you can use water, juices, or soft drinks.
alternativeDecreaseSlow07= Never drink on an empty stomach.
alternativeDecreaseSlow08= Always try to eat something while drinking.
alternativeDecreaseSlow09= Having eaten makes alcohol absorbed into your body more slowly.
alternativeDecreaseSlow11= Controlling the Pace.
alternativePlanFissureText02= Some events around you can make you feel a strong urge to drink.
alternativePlanFissureText04= Remember the reasons that led you to change the way you drink (keep this written down or saved on your phone/computer).
alternativePlanFissureText05= Share this with someone you trust - talk about how this process is going.
alternativePlanFissureText06= Try to get involved in a healthy activity or something that distracts you (like physical exercise or a hobby that doesn't involve alcohol).
alternativePlanFissureText09= The urge to drink, even the most intense, will pass - usually within a few minutes - remembering this will help.
alternativePlanFissureText11= Was this page helpful to you?
alternativePlanFissureText12= Controlling Cravings.
alternativePlanPlanSayNoText02= Have you noticed that there's a greater chance of someone offering you a drink when you're not drinking?
alternativePlanPlanSayNoText04= The secret is to say no quickly and directly! This prevents you from thinking of excuses to allow yourself to drink.
alternativePlanPlanSayNoText07= Seeking Alternatives!
alternativePlanTriggers04= Important tip!
alternativePlanTriggers05= Try to avoid these situations above - Always think of options that don't involve drinking alcohol.
alternativePlanTriggers08= Avoiding Risk Situations - Triggers.
alternativeReduceAlter02= Have you ever stopped to think that drinking can take up a large part of your free time or leisure?
alternativeReduceAlter03= Look for new, healthier activities, such as physical exercises (e.g., walks, cycling, outdoor recreation, etc.).
alternativeReduceAlter04= Over time you will be healthier and more confident if you avoid drinking to:
alternativeReduceAlter05= Feel comfortable in conversations, parties, barbecues, etc.
alternativeReduceAlter06= Improve your mood.
alternativeReduceAlter07= Deal with problems.
alternativeReduceAlter09= Doing something different!
