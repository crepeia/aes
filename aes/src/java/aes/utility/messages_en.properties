alcoholYesLowRisk11= Week: No more than 5 standard drinks per week
alcoholYesUseRisk02= Your consumption can be considered risky
alcoholYesUseRisk06= We recommend that you continue using the app and learn about some tools that can help you prevent these problems
alcoholYesUserHarmful02= Your consumption can be considered harmful to your health
