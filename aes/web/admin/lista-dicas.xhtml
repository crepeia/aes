<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:w="http://xmlns.jcp.org/jsf/composite/ezcomp">
    <f:view locale="#{languageController.locale}">
    <h:head>
        <title>#{messages['dicas']}</title>
        <w:head_comum />
        <w:topmenu />
        <w:header />
    </h:head>
    <h:body>
        <div id="corpo">
            <div class="main">
                <div class="pagecontent">
                    <h1>#{messages['dicas']}</h1>
                    <div class="maintop">
                        <h:dataTable id="tipTable" binding="#{table}" value="#{tipController.tipList()}" var="tip" class="table table-striped table-hover table-bordered tableUpdated">
                            <h:column>
                                <f:facet name="header">ID</f:facet>
                                <h:outputText value="#{tip.id}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">Título</f:facet>
                                <h:outputText value="#{tip.title}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">Descrição em português</f:facet>
                                <h:outputText value="#{tip.descriptionPT}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">Descrição em inglês</f:facet>
                                <h:outputText value="#{tip.descriptionEN}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">Descrição em espanhol</f:facet>
                                <h:outputText value="#{tip.descriptionES}" />
                            </h:column>
                        </h:dataTable>
                    </div>
                </div>
            </div>
        </div>
        <w:footer />
    </h:body>
    </f:view>
</html>
