<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:w="http://xmlns.jcp.org/jsf/composite/ezcomp"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <f:view locale="#{languageController.locale}">
        <h:head>
            <title>#{messages['cadastrarNovoDesafioTitle1']}</title>
            <w:head_comum />
            <w:header/>
            <w:topmenu />
        </h:head>

        <h:body>    
            <div id="corpo"> 
                <!--mainmenu-->         	
                <div class="main">
                    <div class="pagecontent">


                        <div class="signupcenter">
                            <div id="signupright">
                            <div id="signup">
                                
                                <h1>#{messages['cadastrarNovoDesafioTitle1']}</h1>
                                
                                <h:form id="form" class="form-signup">
                                    <p:ajaxStatus onstart="statusDialog.show()" onsuccess="statusDialog.hide()" />
                                    <p:dialog widgetVar="statusDialog" modal="true" draggable="false" closable="false" resizable="false" showHeader="false">
                                        <p:graphicImage library="default" name="images/loading.gif" />
                                    </p:dialog>
                                    <div class="signuptext"><input type="hidden" name="cx" value="000901674862427730485:_xhsedehfns"/></div>
                                    <div class="signuptext"><input type="hidden" name="ie" value="UTF-8" /></div>
                                    <p:inputText type="hidden" styleClass="col-sm-10 form-control" id="idTxt" value="#{challengeController.challenge.id}" required="true" />
                                    <div class="signuptext form-group row">
                                        <label for="nameTxt" class="col-sm-2 col-form-label">#{messages['challengePrefixTitle']}</label>
                                        <p:inputText styleClass="col-sm-10 form-control" id="prefixTxt" value="#{challengeController.challenge.prefix}" required="true" size="30" label="#{messages['challengePrefixTitle']}" >
                                            <f:validateLength maximum="100" />
                                        </p:inputText>
                                        <p:watermark for="prefixTxt" value="#{messages['challengePrefixTitle']}" />
                                        <p:message for="prefixTxt" />
                                    </div>
                                    <div class="signuptext form-group row">
                                        <label for="emailTxt" class="col-sm-2 col-form-label">#{messages['desafioBaseValue']}</label>
                                        <p:inputText styleClass="col-sm-10 form-control" id="baseTxt" value="#{challengeController.challenge.base_value}" required="true" size="30" label="#{messages['desafioBaseValue']}"  />
                                        <p:watermark for="baseTxt" value="#{messages['desafioBaseValue']}" />
                                        <p:message for="baseTxt" />
                                    </div>
                                    
                                    <div class="signuptext form-group row">
                                        <label for="emailTxt" class="col-sm-2 col-form-label">#{messages['challengeModifierTitle']}</label>
                                        <p:inputText styleClass="col-sm-10 form-control" id="modTxt" value="#{challengeController.challenge.modifier}" required="true" size="30" label="#{messages['challengeModifierTitle']}"  />
                                        <p:watermark for="modTxt" value="#{messages['challengeModifierTitle']}" />
                                        <p:message for="modTxt" />
                                    </div>
                                    
                                    <div class="signuptext form-group row">
                                        <label for="emailTxt" class="col-sm-2 col-form-label">#{messages['challengeTypeTitle']}</label>
                                        <p:selectOneMenu styleClass="col-sm-10 form-control" id="typeTxt" value="#{challengeController.challenge.type}" required="true" label="#{messages['challengeTypeTitle']}" >
                                            <f:selectItems value="#{challengeController.challengeTypes}" />
                                        </p:selectOneMenu>
                                       <p:watermark for="typeTxt" value="#{messages['challengeTypeTitle']}" />
                                        <p:message for="typeTxt" />
                                    </div>
                                    

                                    <div id="signupbottom">

                                        <div id="signupsubmit">			                                            
                                            <div>
                                                <p:messages id="errorMessage" redisplay="true" globalOnly="true" />
                                            </div>
                                            <div id="signupbtn">
                                                <p:commandButton styleClass="btn btn-primary" id="saveBtn" value="#{messages['register']}" update="@form"  actionListener="#{challengeController.edit}"/>
                                            </div>
                                        </div>
                                    </div>
                                </h:form>	    		
                            </div>
                            </div><!-- end.main left -->
                        </div>

                    </div>
                </div>        
            </div><!-- end.corpo --> 
            <!--Footer -->
            <w:footer />
          
        </h:body>
    </f:view>
</html>
