<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:w="http://xmlns.jcp.org/jsf/composite/ezcomp">
    <f:view locale="#{languageController.locale}">
    <h:head>
        <title>#{messages['desafios']}</title>
        <w:head_comum />
        <w:topmenu />
        <w:header />
    </h:head>
    <h:body>
        <div id="corpo">
            <div class="main">
                <div class="pagecontent">
                    <h1>#{messages['desafios']}</h1>
                    <div class="maintop">
                        <h:dataTable id="challengeTable" binding="#{table}" value="#{challengeController.challengeList(languageController.locale)}" var="challenge" class="table table-striped table-hover table-bordered tableUpdated">
                            <h:column>
                                <f:facet name="header">ID</f:facet>
                                <h:outputText value="#{challenge.id}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">#{messages['challenge.prefix.title']}</f:facet>
                                <h:outputText value="#{challenge.prefix}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">#{messages['challenge.type.title']}</f:facet>
                                <h:outputText value="#{challenge.type}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">#{messages['challenge.base.value.title']}</f:facet>
                                <h:outputText value="#{challenge.baseValue}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">#{messages['challenge.modifier.title']}</f:facet>
                                <h:outputText value="#{challenge.modifier}" />
                            </h:column>
                        </h:dataTable>
                    </div>
                </div>
            </div>
        </div>
        <w:footer />
    </h:body>
    </f:view>
</html>
